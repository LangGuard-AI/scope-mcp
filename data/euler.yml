    risk: medium
    business_impact: "Reads partner-directory profiles that can include identifiable contact and company information."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: euler.partners
    object: Partner
    action: partners
    description: "Queries company partners with list, pending, and summary actions, returning roster and status data."
    category: Customer
    risk: medium
    business_impact: "Reads the partner roster and status metrics, which can include identifiable partner-contact data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
