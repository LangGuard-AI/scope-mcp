schema_version: "1.2"
platform: euler
display_name: EULER
source: langguard-editorial
updated: "2026-06"
server_version: "2026-06"
server_website: https://mcp.eulerapp.com/public/docs
maintainer: help@eulerapp.com
reference: https://mcp.eulerapp.com/public/docs
# Tool surface: 29 verbatim tools across 13 categories (22 read / 7 write) sourced
# from the vendor's authoritative structured manifest at
# https://mcp.eulerapp.com/public/docs.json (HTTP 200, server.name "euler-mcp").
# The manifest tags each tool with operation = read | write | write_destructive:
# 22 read, 4 write, 3 write_destructive. The 3 vendor-badged write_destructive
# tools are: flow_steps (deactivate), flow_assignment (unassign), and
# communications_manage (send_broadcast — irreversible bulk external partner email).
# Live introspection of the /mcp endpoint returns 401 (OAuth 2.1 + PKCE + DCR
# gated per the manifest's authentication block), so ids come from the public
# manifest, not a token'd tools/list — but the manifest IS the server's own
# canonical per-tool reference, so ids are verbatim. `get_form_for_partner` /
# `get_answers` / `list_audiences` / `send_broadcast` etc. are action values
# inside generic tools (referrals, communications, communications_manage), not
# separate tools, and are correctly represented as actions of their parent tool.
actions:
  # ---------- Messaging ----------
  - id: euler.communications_manage
    object: Broadcast
    action: communications_manage
    description: "Creates audiences and templates, adds partner contacts, and sends email broadcasts to real partners (send_broadcast cannot be undone)."
    reference: https://mcp.eulerapp.com/public/docs
    category: Messaging
    risk: high
    business_impact: "Sends irreversible bulk email broadcasts to identifiable external partner contacts via send_broadcast; an external-communication and anti-spam (CAN-SPAM/TCPA-style) exposure regardless of intent, and vendor-badged write-destructive."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: euler.communications
    object: Broadcast
    action: communications
    description: "Read-only access to the Communications Hub: lists audiences, templates, and sent emails, and previews broadcasts and templates with sample recipient data."
    reference: https://mcp.eulerapp.com/public/docs
    category: Messaging
    risk: medium
    business_impact: "Reads partner email-program data including recipients, subjects, and open/click engagement metrics plus sample contacts; recipient and behavioral PII."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Identity & Access ----------
  - id: euler.invite_partner_to_portal
    object: PartnerContact
    action: invite_partner_to_portal
    description: "Invites a partner contact by email to a partner's portal, creating the contact record and triggering an invitation email."
    category: Identity & Access
    risk: high
    business_impact: "Provisions external portal access for a new person and sends an invitation email carrying their name and email address; idempotent so re-invites are no-ops."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Customer ----------
  - id: euler.list_partner_contacts
    object: PartnerContact
    action: list_partner_contacts
    description: "Retrieves the contacts associated with a partner, including name, email, role, and portal access status."
    category: Customer
    risk: high
    business_impact: "Returns identifiable contact PII (names, email addresses, roles) for a partner; a bulk PII read."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: euler.list_accounts
    object: Account
    action: list_accounts
    description: "Returns the customer and partner accounts the user authorized during the MCP consent screen."
    category: Customer
    risk: medium
    business_impact: "Reads the roster of authorized customer and partner accounts, which can include identifiable account contacts."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: euler.partner_directory_search
