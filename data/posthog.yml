    category: Platform & DevOps
    risk: medium
    business_impact: "Defines an A/B test that will split production traffic between variants; reviewable before launch."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: posthog.experiment-update
    object: Experiment
    action: experiment-update
    description: "Update experiment."
    category: Platform & DevOps
    risk: medium
    business_impact: "Edits an experiment's variants, targeting, or metrics; can change how production traffic is split while the test is running."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.experiment-launch
    object: Experiment
    action: experiment-launch
    description: "Launch experiment."
    category: Platform & DevOps
    risk: high
    business_impact: "Starts splitting live production traffic across experiment variants, changing what real users experience."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: posthog.experiment-pause
    object: Experiment
    action: experiment-pause
    description: "Pause experiment."
    category: Platform & DevOps
    risk: medium
    business_impact: "Halts traffic splitting on a running experiment; unilaterally changes live production behavior back toward control."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.experiment-resume
    object: Experiment
    action: experiment-resume
    description: "Resume experiment."
    category: Platform & DevOps
    risk: high
    business_impact: "Restarts traffic splitting on a paused experiment, re-exposing live users to variant behavior without a new review."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.experiment-ship-variant
    object: Experiment
    action: experiment-ship-variant
    description: "Ship experiment variant."
    category: Platform & DevOps
    risk: high
    business_impact: "Promotes one experiment variant to 100% of traffic, making a production-behavior change permanent for all users."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: posthog.experiment-end
    object: Experiment
    action: experiment-end
    description: "End experiment."
    category: Platform & DevOps
    risk: high
    business_impact: "Concludes a running experiment, unilaterally collapsing the live production traffic split back to a single behavior for all users."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.experiment-reset
    object: Experiment
    action: experiment-reset
    description: "Reset experiment."
    category: Platform & DevOps
    risk: medium
    business_impact: "Resets a running experiment's state and accumulated results; discards collected exposure data and restarts the test."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.experiment-archive
    object: Experiment
    action: experiment-archive
    description: "Archive experiment."
    category: Platform & DevOps
    risk: medium
    business_impact: "Archives an experiment, removing it from active views and stopping its participation in production traffic splitting."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.experiment-unarchive
    object: Experiment
    action: experiment-unarchive
    description: "Unarchive experiment."
    category: Platform & DevOps
    risk: medium
    business_impact: "Restores an archived experiment to active state; can re-introduce it into production traffic configuration."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.experiment-delete
    object: Experiment
    action: experiment-delete
    description: "Delete experiment."
    category: Platform & DevOps
    risk: medium
    business_impact: "Removes an experiment and its configuration; results history for that test is lost."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

