    action: cdp-functions-create
    description: "Create function."
    reference: https://posthog.com/docs/model-context-protocol/tools
    category: Platform & DevOps
    risk: high
    business_impact: "Creates a CDP destination/transformation that can forward event and person data to an external system; new data-egress path."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.cdp-functions-partial-update
    object: Function
    action: cdp-functions-partial-update
    description: "Update function."
    category: Platform & DevOps
    risk: high
    business_impact: "Mutates a live CDP destination/transformation; can repoint or widen an active data-egress function forwarding event and person data externally."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.cdp-functions-delete
    object: Function
    action: cdp-functions-delete
    description: "Delete function."
    category: Platform & DevOps
    risk: medium
    business_impact: "Removes a CDP destination/transformation; silently stops data delivery or processing that downstream systems rely on."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.cdp-functions-invocations-create
    object: Function
    action: cdp-functions-invocations-create
    description: "Test-invoke function."
    category: Platform & DevOps
    risk: medium
    business_impact: "Runs a CDP function against sample data, which can emit a real outbound event to the configured destination."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Platform & DevOps: Reverse Proxy (infra) ----------
  - id: posthog.proxy-create
    object: ReverseProxy
    action: proxy-create
    description: "Create reverse proxy."
    category: Platform & DevOps
    risk: high
    business_impact: "Provisions a reverse-proxy that routes ingestion traffic through a custom domain; infrastructure change affecting how all event data reaches PostHog."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.proxy-delete
    object: ReverseProxy
    action: proxy-delete
    description: "Delete reverse proxy."
    category: Platform & DevOps
    risk: high
    business_impact: "Tears down a reverse-proxy ingestion route; can break event delivery for any SDK pointed at that custom domain."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Platform & DevOps: Feature Flags ----------
  - id: posthog.create-feature-flag
    object: FeatureFlag
    action: create-feature-flag
    description: "Create feature flag."
    reference: https://posthog.com/docs/model-context-protocol/tools
    category: Platform & DevOps
    risk: medium
    business_impact: "Introduces a new runtime flag that can gate production behavior for end users; reviewable and reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: posthog.update-feature-flag
    object: FeatureFlag
    action: update-feature-flag
    description: "Update feature flag."
    category: Platform & DevOps
    risk: high
    business_impact: "Changes a live flag's rollout or targeting, instantly altering production behavior for a slice of users without a deploy."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: posthog.delete-feature-flag
    object: FeatureFlag
    action: delete-feature-flag
    description: "Delete feature flag."
    category: Platform & DevOps
    risk: high
    business_impact: "Removes a flag controlling production behavior; can abruptly disable or expose a gated code path for all users."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: posthog.feature-flags-bulk-delete-create
    object: FeatureFlag
    action: feature-flags-bulk-delete-create
    description: "Bulk delete feature flags."
    category: Platform & DevOps
    risk: critical
    business_impact: "Removes many production-gating flags at once; mass change-management bypass affecting live user-facing behavior."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: posthog.feature-flags-bulk-update-tags-create
    object: FeatureFlag
    action: feature-flags-bulk-update-tags-create
    description: "Bulk update tags on feature flags."
    category: Platform & DevOps
    risk: medium
    business_impact: "Rewrites tags across many feature flags in one call; bulk metadata mutation that can disrupt flag organization and ownership routing."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.feature-flags-copy-flags-create
    object: FeatureFlag
    action: feature-flags-copy-flags-create
    description: "Copy feature flag across projects."
    category: Platform & DevOps
    risk: medium
    business_impact: "Replicates a flag's targeting into another project, potentially activating production behavior in a new environment."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.scheduled-changes-create
    object: ScheduledChange
    action: scheduled-changes-create
    description: "Create a scheduled change."
    category: Platform & DevOps
    risk: medium
    business_impact: "Schedules a future automatic change to a feature flag; defers a production-behavior change past the point of review."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.scheduled-changes-update
    object: ScheduledChange
    action: scheduled-changes-update
    description: "Update a scheduled change."
    category: Platform & DevOps
    risk: medium
    business_impact: "Edits a pending scheduled flag change; can alter a deferred production-behavior change before it auto-applies, outside the original review."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.scheduled-changes-delete
    object: ScheduledChange
    action: scheduled-changes-delete
    description: "Delete a scheduled change."
    category: Platform & DevOps
    risk: medium
    business_impact: "Cancels a pending scheduled flag change; can silently prevent an approved production-behavior change from taking effect."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Platform & DevOps: Experiments (production traffic) ----------
