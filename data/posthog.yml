schema_version: "1.1"
platform: posthog
display_name: PostHog
source: langguard-editorial
updated: "2026-06"
reference: https://posthog.com/docs/model-context-protocol/tools
# PostHog's MCP server exposes 400+ verbatim tools (kebab-case, domain-prefixed)
# across 40+ domains. Tool ids below are copied verbatim from the vendor
# Tools-reference page (https://posthog.com/docs/model-context-protocol/tools)
# and cross-confirmed against the connector mounted live in-session (the
# in-session tool-domain list matches the documented domain prefixes:
# survey/experiment/cdp-functions/scheduled-changes/cohorts/proxy/
# external-data-sources/feature-flag/error-tracking/notebooks/insight/
# dashboard/view, etc.).
#
# Per the curator WRITE-SURFACE-FIRST trim rule, this file keeps the
# highest-blast-radius surface: EVERY destructive/state-changing operation an
# agent is likely to invoke (create/update/delete/launch/stop/pause/resume/
# archive/ship/merge/split/copy/enable/run/send), plus every bulk/PII-sensitive
# read. Within each domain we carry, CRUD and paired-lifecycle verbs
# (create/update/delete, launch/stop, archive/unarchive) are kept together so
# the write surface is symmetric, not partial.
#
# Trimmed (routine, low-sensitivity reads and whole low-blast-radius domains an
# agent rarely mutates): single-record getters and list readers
# (alerts/annotations/comments reads, function-templates, endpoints OpenAPI/
# versions, docs-search, sdk-doctor, organization/role read-only listings),
# and the read-heavy peripheral domains tasks, signals, replay-vision scanners,
# tracing/APM, logs-alerts, visual-review, subscriptions, customer-analytics
# accounts, and the AI-observability evaluation/skill/prompt CRUD surface
# (kept only the LLM-trace PII read). These return aggregates or operate on
# non-PII config; none are destructive to production behavior or to PII at scale.
# See provenance note in the final report.
actions:
  # ---------- Data Access (queries, schema, exports, warehouse) ----------
  - id: posthog.execute-sql
    object: Query
    action: execute-sql
    description: "Execute an SQL query."
    reference: https://posthog.com/docs/model-context-protocol/tools
    category: Data Access
    risk: high
    business_impact: "Runs arbitrary HogQL/SQL against the project's event and person store; can read any analytics or PII column the project holds."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: posthog.read-data-schema
    object: Schema
    action: read-data-schema
    description: "Explore the user's events, actions, properties, and property values."
    category: Data Access
    risk: medium
    business_impact: "Enumerates event/person property names and sample values, exposing the shape of stored PII before any query is run."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.read-data-warehouse-schema
    object: Schema
    action: read-data-warehouse-schema
    description: "Read core data warehouse schemas and table lists."
    category: Data Access
    risk: medium
    business_impact: "Exposes the structure of warehouse-synced source data, which may include customer or financial tables."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.query-logs
    object: Logs
    action: query-logs
    description: "Query logs."
    category: Data Access
    risk: medium
    business_impact: "Searches ingested application logs that can contain user identifiers and request payloads."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.view-create
    object: SavedQuery
    action: view-create
    description: "Create saved query."
    category: Data Access
    risk: medium
    business_impact: "Persists a SQL view over event/warehouse data; reusable query surface that can encode broad PII access."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.view-update
    object: SavedQuery
    action: view-update
    description: "Update saved query."
    category: Data Access
    risk: medium
    business_impact: "Edits a persisted SQL view; can silently broaden the PII or warehouse data a reusable query exposes."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.view-delete
    object: SavedQuery
    action: view-delete
    description: "Delete saved query."
    category: Data Access
    risk: medium
    business_impact: "Removes a saved SQL view; breaks downstream insights, materializations, or endpoints that depend on it."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.view-materialize
    object: SavedQuery
    action: view-materialize
    description: "Materialize saved query."
    category: Data Access
    risk: medium
    business_impact: "Persists a saved query's results into a materialized table, duplicating event/PII data into a new stored artifact."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Data Access: Pipelines & Exports ----------
  - id: posthog.batch-export-create
    object: BatchExport
    action: batch-export-create
    description: "Create batch export."
    reference: https://posthog.com/docs/model-context-protocol/tools
    category: Data Access
    risk: critical
    business_impact: "Establishes a recurring bulk export of raw event and person data to an external destination; standing data-exfiltration channel."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: posthog.batch-export-update
    object: BatchExport
    action: batch-export-update
    description: "Update batch export."
    category: Data Access
    risk: high
    business_impact: "Changes a recurring export's destination or filter; can redirect a standing PII data stream to a different external system."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.batch-export-delete
    object: BatchExport
    action: batch-export-delete
    description: "Delete batch export."
    category: Data Access
    risk: medium
    business_impact: "Removes a recurring export; silently halts a data feed downstream systems may depend on."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.file-download-batch-exports-create
    object: BatchExport
    action: file-download-batch-exports-create
    description: "Start file download export."
    category: Data Access
    risk: critical
    business_impact: "Streams a bulk download of raw event/person data as a file; direct mass PII exfiltration event."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Platform & DevOps: Data Warehouse ----------
  - id: posthog.external-data-sources-create
    object: DataWarehouseSource
    action: external-data-sources-create
    description: "Create data warehouse source."
    category: Platform & DevOps
    risk: high
    business_impact: "Connects an external database into the warehouse, ingesting that system's customer or financial data into PostHog."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.external-data-sources-partial-update
    object: DataWarehouseSource
    action: external-data-sources-partial-update
    description: "Update data warehouse source."
    category: Platform & DevOps
    risk: high
    business_impact: "Mutates a live warehouse source's connection or credentials; can repoint ingestion at a different system holding customer or financial data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.external-data-sources-destroy
    object: DataWarehouseSource
    action: external-data-sources-destroy
    description: "Delete data warehouse source."
    category: Platform & DevOps
    risk: high
    business_impact: "Removes a warehouse source and its sync configuration; breaks downstream models that depend on the ingested data."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.external-data-schemas-delete-data
    object: DataWarehouseSchema
    action: external-data-schemas-delete-data
    description: "Delete synced table data."
    category: Platform & DevOps
    risk: high
    business_impact: "Deletes all synced rows for a warehouse table; destroys ingested source data that may include customer records."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.external-data-schemas-partial-update
    object: DataWarehouseSchema
    action: external-data-schemas-partial-update
    description: "Update data import schema."
    category: Platform & DevOps
    risk: medium
    business_impact: "Changes how a warehouse table is synced; can alter which source columns of customer data are ingested."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.external-data-sources-create-webhook-create
    object: DataWarehouseSource
    action: external-data-sources-create-webhook-create
    description: "Create and register a webhook for a source."
    category: Platform & DevOps
    risk: medium
    business_impact: "Registers an outbound webhook on a warehouse source; creates a new channel that can emit ingested data externally."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: posthog.external-data-sources-delete-webhook-create
    object: DataWarehouseSource
    action: external-data-sources-delete-webhook-create
    description: "Delete a source's webhook."
    category: Platform & DevOps
    risk: medium
    business_impact: "Removes an outbound webhook from a warehouse source; silently stops an external notification channel downstream systems may rely on."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Platform & DevOps: CDP Functions (data egress) ----------
  - id: posthog.cdp-functions-create
