schema_version: "1.3"
platform: webex-meetings
display_name: Webex Meetings
logo: https://developer.webex.com/favicon.ico
source: langguard-editorial
updated: "2026-09"
mcp_server_url: https://mcp.webexapis.com/mcp/webex-meeting
reference: https://developer.webex.com/mcp/docs/meetings-mcp-server
server_website: https://developer.webex.com/mcp/docs/meetings-mcp-server
actions:
  # ---------- Data Access ----------

  # source: https://developer.webex.com/mcp/docs/meetings-mcp-server
  - id: webex-meetings.webex-list-transcripts
    object: Transcript
    action: webex-list-transcripts
    description: "Lists transcript metadata and downloads the full text content of meeting transcripts."
    category: Data Access
    risk: critical
    business_impact: "Pulls the full verbatim text of recorded meetings, exposing negotiations, HR discussions, and any confidential speech captured across every transcript the host can reach."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developer.webex.com/mcp/docs/meetings-mcp-server
  - id: webex-meetings.webex-list-recordings
    object: Recording
    action: webex-list-recordings
    description: "Lists recording metadata along with playback and download URLs."
    category: Data Access
    risk: high
    business_impact: "Surfaces playback and download links for meeting recordings, turning a metadata listing into a route to the full audio and video of private sessions."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developer.webex.com/mcp/docs/meetings-mcp-server
  - id: webex-meetings.webex-get-meeting-summary
    object: Meeting
    action: webex-get-meeting-summary
    description: "Retrieves AI-generated summary notes and action items for a meeting."
    category: Data Access
    risk: high
    business_impact: "Returns AI-generated notes and action items derived from what was said in the meeting, which can restate confidential decisions and named individuals' commitments."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developer.webex.com/mcp/docs/meetings-mcp-server
  - id: webex-meetings.webex-get-meeting-status
    object: Meeting
    action: webex-get-meeting-status
    description: "Retrieves meeting details and the live participant list."
    category: Data Access
    risk: medium
    business_impact: "Reveals who is currently in a meeting along with its details, disclosing attendee identities and attendance patterns for a specific session."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Operations ----------

  # source: https://developer.webex.com/mcp/docs/meetings-mcp-server
  - id: webex-meetings.webex-update-meeting
    object: Meeting
    action: webex-update-meeting
    description: "Updates meeting properties and manages the invitee list."
    category: Operations
    risk: medium
    business_impact: "Changes meeting properties and the invitee roster, which can admit an unintended attendee to a confidential session or move a meeting without the host noticing."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developer.webex.com/mcp/docs/meetings-mcp-server
  - id: webex-meetings.webex-delete-meeting
    object: Meeting
    action: webex-delete-meeting
    description: "Deletes a scheduled meeting, optionally sending a cancellation email."
    category: Operations
    risk: medium
    business_impact: "Cancels a scheduled meeting and can mail every invitee about it; the slot and its join details are gone and must be rebuilt by hand."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developer.webex.com/mcp/docs/meetings-mcp-server
  - id: webex-meetings.webex-create-meeting
    object: Meeting
    action: webex-create-meeting
    description: "Creates a meeting with title, time, duration, invitees, recurrence, and password."
    category: Operations
    risk: low
    business_impact: "Schedules a new meeting and mails invitations to the named attendees, including external addresses, under the host's identity."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developer.webex.com/mcp/docs/meetings-mcp-server
  - id: webex-meetings.webex-list-meetings
    object: Meeting
    action: webex-list-meetings
    description: "Lists and searches meetings with filters for date range, topic, state, and type."
    category: Operations
    risk: low
    business_impact: "Enumerates scheduled and past meetings with their topics and times, giving a read-only view of the host's calendar activity."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial
