    access_methods: [REST, MCP]

  # ---------- Files & Folders ----------
  - id: box.upload_file
    object: File
    action: upload_file
    description: "Uploads a new file to Box."
    category: Files & Folders
    risk: medium
    business_impact: "Adds new content to Box; reversible but may introduce unreviewed or sensitive material into the workspace."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: box.upload_file_version
    object: File
    action: upload_file_version
    description: "Uploads a new version of an existing file."
    category: Files & Folders
    risk: medium
    business_impact: "Replaces a file's current version; prior content is retained in version history but the live document changes."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: box.copy_file
    object: File
    action: copy_file
    description: "Copies an existing file to a destination folder."
    category: Files & Folders
    risk: medium
    business_impact: "Duplicates a file into another folder, potentially moving sensitive content across access boundaries."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: box.copy_folder
    object: Folder
    action: copy_folder
    description: "Copies an existing folder to a destination parent folder."
    category: Files & Folders
    risk: medium
    business_impact: "Duplicates a whole folder tree, potentially replicating sensitive content across access boundaries."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: box.move_file
    object: File
    action: move_file
    description: "Moves an existing file to a destination folder."
    category: Files & Folders
    risk: medium
    business_impact: "Relocates a file, which can change its inherited permissions and exposure depending on the destination folder."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: box.move_folder
    object: Folder
    action: move_folder
    description: "Moves a folder to a new parent."
    category: Files & Folders
    risk: medium
    business_impact: "Relocates a folder tree, which can change inherited permissions and exposure for all contained items."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

