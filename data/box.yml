schema_version: "1.1"
platform: box
display_name: Box
source: langguard-editorial
updated: "2026-06"
reference: https://developer.box.com/guides/box-mcp/tools/
actions:
  # ---------- Sharing & External Exposure ----------
  - id: box.add_folder_shared_link
    object: Folder
    action: add_folder_shared_link
    description: "Creates or updates a shared link for a Box folder."
    category: Sharing & External Exposure
    risk: critical
    business_impact: "Exposes an entire folder tree via a public shared link; bulk external data exposure regardless of intent."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: box.add_file_shared_link
    object: File
    action: add_file_shared_link
    description: "Creates or updates a shared link for a Box file."
    category: Sharing & External Exposure
    risk: high
    business_impact: "Creates a public/shared link for a file, unilaterally exposing its contents outside the organization's access controls."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Identity & Access ----------
  - id: box.create_collaboration
    object: Collaboration
    action: create_collaboration
    description: "Invites a user or group to a file, folder, or hub."
    category: Identity & Access
    risk: high
    business_impact: "Grants a user or group access to content; access escalation that bypasses centralized provisioning review."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: box.update_collaboration
    object: Collaboration
    action: update_collaboration
    description: "Updates a file, folder, or hub collaboration."
    category: Identity & Access
    risk: high
    business_impact: "Modifies an existing access grant (e.g. raises a viewer to editor); access escalation outside provisioning review."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
  - id: box.list_item_collaborations
    object: Collaboration
    action: list_item_collaborations
    description: "Lists all existing collaborations on an item."
    category: Identity & Access
    risk: medium
    business_impact: "Enumerates who has access to a file or folder; an access-control read that exposes the principal list and permission levels."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Content Egress ----------
  - id: box.get_download_url
    object: File
    action: get_download_url
    description: "Issues a temporary, single-use URL for downloading a file's binary content."
    category: Content Egress
    risk: high
    business_impact: "Produces a direct download URL for file contents; data-egress surface that can carry PII out of Box."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: box.get_file_content
    object: File
    action: get_file_content
    description: "Returns the content of a file stored in Box."
    category: Content Egress
    risk: high
    business_impact: "Reads raw file contents into the agent context; can surface PII or confidential material."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, HIPAA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: box.get_file_preview
    object: File
    action: get_file_preview
    description: "Returns the preview widget for a file stored in Box."
    category: Content Egress
    risk: medium
    business_impact: "Renders file contents in a preview; can expose PII or confidential material without a full download."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: box.get_upload_url
    object: File
    action: get_upload_url
    description: "Issues a temporary, single-use URL for uploading binary file content."
    category: Content Egress
    risk: medium
    business_impact: "Produces a single-use upload URL that enables writing arbitrary binary content into Box outside the standard upload path."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Search ----------
  - id: box.search_files_keyword
    object: File
    action: search_files_keyword
    description: "Searches for files using keywords."
    category: Search
    risk: medium
    business_impact: "Returns files matching a keyword across the user's accessible content; can surface confidential or PII-bearing documents in bulk."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, HIPAA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: box.search_files_metadata
    object: File
    action: search_files_metadata
    description: "Searches for files using SQL-like metadata queries."
    category: Search
    risk: medium
    business_impact: "Runs structured metadata queries across accessible files; can enumerate sensitive documents by attribute in bulk."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

