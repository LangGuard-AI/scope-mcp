actions:
  # ---------- Messaging ----------

  # source: https://sprouts-mcp-server.kartikay-dhar.workers.dev/
  - id: sprouts.sprouts_sequence_run
    object: Sequence
    action: sprouts_sequence_run
    description: "Launches a staged outreach sequence, sending real email to every enrolled recipient."
    category: Messaging
    risk: critical
    business_impact: "Sends live outbound email to every recipient enrolled in a sequence in one call and cannot be unsent; a misdirected or unapproved sequence reaches real inboxes and exposes the sender to unsolicited-email complaints."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://sprouts-mcp-server.kartikay-dhar.workers.dev/
  - id: sprouts.sprouts_send_reply
    object: Message
    action: sprouts_send_reply
    description: "Sends a reply inside an existing conversation thread with a contact."
    category: Messaging
    risk: high
    business_impact: "Delivers a real message to a named individual and returns the prior thread context, putting one person's private correspondence into the agent's hands and into the record."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://sprouts-mcp-server.kartikay-dhar.workers.dev/
  - id: sprouts.sprouts_generate_messages
    object: Message
    action: sprouts_generate_messages
    description: "Generates personalized cold-outreach email and LinkedIn copy for up to 20 contacts."
    category: Messaging
    risk: medium
    business_impact: "Drafts outbound copy for up to 20 named prospects at once, processing each person's role, employer and research profile to personalize the pitch before any human review."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://sprouts-mcp-server.kartikay-dhar.workers.dev/
  - id: sprouts.sprouts_sequence
    object: Sequence
    action: sprouts_sequence
    description: "Creates and manages email outreach sequences, including steps, messages and recipients."
    category: Messaging
    risk: medium
    business_impact: "Builds and edits multi-step outreach campaigns and enrolls named recipients into them, staging who will be contacted and with what copy once the sequence is launched."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://sprouts-mcp-server.kartikay-dhar.workers.dev/
  - id: sprouts.sprouts_sequence_preview
    object: Sequence
    action: sprouts_sequence_preview
    description: "Read-only timeline view of a sequence's steps, timing, copy and recipient status."
    category: Messaging
    risk: low
    business_impact: "Renders a sequence's steps, subject lines, bodies and recipient counts for review; read-only and nothing is sent."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://sprouts-mcp-server.kartikay-dhar.workers.dev/
  - id: sprouts.sprouts_brand_guidelines
    object: Document
    action: sprouts_brand_guidelines
    description: "Uploads brand-voice guideline text or inspects the prompts derived from an earlier upload."
    category: Messaging
    risk: low
    business_impact: "Stores brand-voice rules that every generated outreach message is written against; bad guidelines skew all downstream copy but the upload is reversible."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

