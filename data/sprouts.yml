  - id: sprouts.enrich_phone_email
    object: Contact
    action: enrich_phone_email
    description: "Reveals a contact's phone number and email address from a LinkedIn URL or name plus company."
    category: Data Access
    risk: high
    business_impact: "Unmasks one person's direct phone number and email address and charges up to 12 credits, turning a public profile into contactable personal data held by the operator."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://sprouts-mcp-server.kartikay-dhar.workers.dev/
  - id: sprouts.sprouts_personalization
    object: Account
    action: sprouts_personalization
    description: "Runs background research on a company domain, returning pain points, offerings and buying-intent topics with public source links."
    category: Data Access
    risk: low
    business_impact: "Compiles company-level sales research from publicly sourced material; read-only and each claim carries a source link."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://sprouts-mcp-server.kartikay-dhar.workers.dev/
  - id: sprouts.search_history
    object: Search
    action: search_history
    description: "Views and reuses the user's past prospect searches and patterns across them."
    category: Data Access
    risk: low
    business_impact: "Replays the operator's prior prospecting queries, exposing the targeting strategy behind them but no new contact data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

