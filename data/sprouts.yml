  - id: sprouts.sprouts_data_intelligence
    object: Contact
    action: sprouts_data_intelligence
    description: "Natural-language prospect search across the Sprouts contact and company database."
    category: Data Access
    risk: high
    business_impact: "Pulls lists of identifiable individuals — names, titles, employers and firmographics — from a third-party B2B database into the agent's context on a single free-text query."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://sprouts-mcp-server.kartikay-dhar.workers.dev/
  - id: sprouts.sprouts_lookup
    object: Contact
    action: sprouts_lookup
    description: "Batch-resolves named contacts or companies by name, email or domain; optionally returns full account detail."
    category: Data Access
    risk: high
    business_impact: "Resolves a supplied list of people or companies against the vendor database and can return a 67-field account profile, matching third-party records to individuals the operator already named."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

