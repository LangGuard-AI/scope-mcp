  # ---------- Operations ----------
  - id: atlassian.updateJsmOpsAlert
    object: Alert
    action: updateJsmOpsAlert
    description: "Perform alert actions, like acknowledge, unacknowledge, close, or escalate an alert."
    category: Operations
    risk: medium
    business_impact: "Acknowledges, closes, or escalates an operations alert; can suppress an active incident signal."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.getJsmOpsAlerts
    object: Alert
    action: getJsmOpsAlerts
    description: "Get an operations alert by ID or alias, or search query."
    category: Operations
    risk: low
    business_impact: "Reads operations alert details; incident-response data that may reference responders by name."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.getJsmOpsScheduleInfo
    object: Schedule
    action: getJsmOpsScheduleInfo
    description: "List on-call schedules or get current/next responders."
    category: Operations
    risk: low
    business_impact: "Reveals on-call schedules and named responders; exposes identifiable staffing data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.getJsmOpsTeamInfo
    object: Team
    action: getJsmOpsTeamInfo
    description: "List operation teams and team details."
    category: Operations
    risk: low
    business_impact: "Lists operations teams and their members; exposes identifiable staffing data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Code & Release ----------
  - id: atlassian.bitbucketPullRequest
    object: PullRequest
    action: bitbucketPullRequest
    description: "Get, create, and update pull requests; read actions list/get/comments/diff and write actions create/merge/approve/comment."
    category: Code & Release
    risk: medium
    business_impact: "Bundles read and write on pull requests; a single principal can both approve and merge, bypassing independent code review."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.bitbucketRepoContent
    object: Repository
    action: bitbucketRepoContent
    description: "Get repository content and create branches/commits; read actions branch/commit/files and write actions branch.create/commit.create."
    category: Code & Release
    risk: medium
    business_impact: "Bundles read and write on repository content; can commit directly to a branch, bypassing the pull-request review gate."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.bitbucketPipeline
    object: Pipeline
    action: bitbucketPipeline
    description: "Get pipeline details and run pipelines; read actions list/get/steps/step.log and write action run."
    category: Code & Release
    risk: medium
    business_impact: "Bundles read and write on CI pipelines; a single principal can trigger a pipeline run (build or deploy) without independent change approval."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.bitbucketEnvironment
    object: Environment
    action: bitbucketEnvironment
    description: "Get and manage deployment environments; read actions list/get and write actions create/delete/update (admin scope)."
    category: Code & Release
    risk: medium
    business_impact: "Bundles read and write on deployment environments; can create, update, or delete a deployment target under admin scope."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.bitbucketDeployment
    object: Deployment
    action: bitbucketDeployment
    description: "Get deployment information."
    category: Code & Release
    risk: low
    business_impact: "Reads deployment history and status; operational release data."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.bitbucketRepository
    object: Repository
    action: bitbucketRepository
    description: "Get repository details and content."
    category: Code & Release
    risk: low
    business_impact: "Reads repository metadata, content, and default reviewers; may expose source code."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.bitbucketWorkspace
    object: Workspace
    action: bitbucketWorkspace
    description: "Get workspace details."
    category: Code & Release
    risk: low
    business_impact: "Reads Bitbucket workspace metadata; low-sensitivity configuration read."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.bitbucketUser
    object: User
    action: bitbucketUser
    description: "Get pull requests for the authenticated user."
    category: Code & Release
    risk: low
    business_impact: "Reads the authenticated user's pull requests; exposes identifiable contributor data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Data Access ----------
  - id: atlassian.searchAtlassian
    object: "*"
    action: searchAtlassian
    description: "Search across Jira and Confluence using natural language (beta)."
    category: Data Access
    risk: medium
    business_impact: "Runs a natural-language search across Jira and Confluence; can surface content from many products in one call."
    compliance: [SOC2, ISO_27001, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.fetchAtlassian
    object: "*"
    action: fetchAtlassian
    description: "Fetch content by Atlassian Resource Identifier (beta)."
    category: Data Access
    risk: medium
    business_impact: "Retrieves arbitrary content by resource identifier across Atlassian products; broad cross-product read reach."
    compliance: [SOC2, ISO_27001, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.getTeamworkGraphObject
    object: "*"
    action: getTeamworkGraphObject
    description: "Fetch all available data for objects across connected Atlassian products and apps (beta)."
    category: Data Access
    risk: medium
    business_impact: "Aggregates all available data for objects across multiple products and connected apps; broad cross-product read reach."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.getTeamworkGraphContext
    object: "*"
    action: getTeamworkGraphContext
    description: "Retrieve connected context and relationships across Atlassian products (beta)."
    category: Data Access
    risk: low
    business_impact: "Reads relationship context across connected products; cross-product graph metadata."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.addTeamworkGraphContext
    object: "*"
    action: addTeamworkGraphContext
    description: "Adds a relationship between two objects in the Teamwork Graph."
    category: Data Access
    risk: low
    business_impact: "Creates a relationship link between two graph objects; reversible cross-product metadata write."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

