schema_version: "1.1"
platform: atlassian
display_name: Atlassian Rovo
source: langguard-editorial
updated: "2026-06"
reference: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/supported-tools/
actions:
  # ---------- Identity & Access ----------
  - id: atlassian.lookupJiraAccountId
    object: User
    action: lookupJiraAccountId
    description: "Find Jira user account IDs by name or email."
    category: Identity & Access
    risk: low
    business_impact: "Resolves a name or email to a Jira account ID; exposes identifiable user data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: atlassian.atlassianUserInfo
    object: User
    action: atlassianUserInfo
    description: "Get current Atlassian user details, such as account ID."
    category: Identity & Access
    risk: low
    business_impact: "Returns the calling user's account profile; exposes identifiable user data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: atlassian.getAccessibleAtlassianResources
    object: Resource
    action: getAccessibleAtlassianResources
    description: "List Atlassian cloud sites the user can access."
    category: Identity & Access
    risk: low
    business_impact: "Enumerates the cloud sites and tenant ids the principal can reach; maps the accessible attack surface."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Issues ----------
  - id: atlassian.createJiraIssue
    object: Issue
    action: createJiraIssue
    description: "Create a Jira issue."
    category: Issues
    risk: low
    business_impact: "Adds a new Jira issue to a project; reversible and individually audited."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: atlassian.editJiraIssue
    object: Issue
    action: editJiraIssue
    description: "Update fields on an existing Jira issue."
    category: Issues
    risk: low
    business_impact: "Modifies fields on an existing issue; reversible and individually audited."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: atlassian.transitionJiraIssue
    object: Issue
    action: transitionJiraIssue
    description: "Perform a workflow transition on a Jira issue."
    category: Issues
    risk: low
    business_impact: "Advances an issue through its workflow (e.g. to Done or Approved); reversible state change."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.addCommentToJiraIssue
    object: Comment
    action: addCommentToJiraIssue
    description: "Add a comment to a Jira issue."
    category: Issues
    risk: low
    business_impact: "Posts a comment on an issue; visible to all project members but reversible."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: atlassian.addWorklogToJiraIssue
    object: Worklog
    action: addWorklogToJiraIssue
    description: "Adds a time-tracking worklog to a Jira issue."
    category: Issues
    risk: low
    business_impact: "Records time-tracking against an issue; reversible and individually audited."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: atlassian.getJiraIssue
    object: Issue
    action: getJiraIssue
    description: "Get a Jira issue by ID or key."
    category: Issues
    risk: low
    business_impact: "Reads a single issue's fields and comments; operational project data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: atlassian.searchJiraIssuesUsingJql
    object: Issue
    action: searchJiraIssuesUsingJql
    description: "Search Jira issues using a JQL query."
    category: Issues
    risk: low
    business_impact: "Returns issues matching an arbitrary JQL query; can surface many records at once but scoped to permissions."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: atlassian.getVisibleJiraProjects
    object: Project
    action: getVisibleJiraProjects
    description: "List Jira projects the user can access."
    category: Issues
    risk: low
    business_impact: "Enumerates accessible projects; low-sensitivity directory read."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

