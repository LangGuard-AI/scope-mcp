reference: https://support.strava.com/hc/en-us/articles/46190267796237-Strava-MCP-Connector
# NOTE: Strava's official MCP Connector (launched 2026-06-01, a subscriber-gated
# remote MCP server) is OAuth-gated and not anonymously reachable, so tools/list
# could not be retrieved via live introspection (no token available; the local
# `mcp` client is not installed; the connector is not mounted live in this
# session). The canonical support/setup article 403s anonymous fetches, and
# developers.strava.com (the REST API docs) publishes NO MCP tool reference.
# Strava publishes only plain-language capability labels for the MCP surface —
# "Activity history", "Fitness trends", "Readiness", "Goal planning",
# "Cross-sport", "Gear" (per the press release and support materials). These are
# recorded via the capability-form fallback (id_form: capability); the ids are
# intent-level slugs, NOT verbatim MCP identifiers, so every entry is capped at
# confidence: medium.
#
# The official connector is explicitly READ-ONLY: "Claude can analyze Strava
# data but cannot upload, edit, or delete activities." There is therefore NO
# destructive / state-changing write surface to curate. All entries are reads.
#
# Unlike a public-catalog connector (e.g. AllTrails), these reads return the
# AUTHENTICATED ATHLETE'S OWN PERSONAL DATA — GPS route traces, per-second heart
# rate and pace streams, cycling power, full activity history. That is personal
# data of an identifiable individual held by a global SaaS, so the personal-data
# reads carry the full 8-regime privacy stack. HIPAA is NOT tagged: consumer
# fitness/heart-rate data is not PHI and Strava is not a HIPAA covered entity.
# AI-decisioning regimes are NOT tagged: these are read/analyze actions, not
# automated consequential decisions about individuals.
#
# The community servers (r-huijts/strava-mcp ~25 tools, MCPBundles ~16 tools,
# bronteee, mdecesare13, etc.) were deliberately NOT used as a source — they are
# different, conflicting implementations from the official connector, and the
# spec treats conflicting community implementations as non-authoritative.
actions:
