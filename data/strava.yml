  - id: strava.activity_history
    object: Activity
    action: activity_history
    id_form: capability
    description: "Activity history"
    reference: https://support.strava.com/hc/en-us/articles/46190267796237-Strava-MCP-Connector
    category: Data Access
    risk: low
    business_impact: "Reads the authenticated athlete's full activity history — including GPS route traces and per-second heart-rate and pace streams — exposing precise location and biometric data; read-only over the user's own authorized data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
