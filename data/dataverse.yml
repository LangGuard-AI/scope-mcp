  # source: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/data-platform-mcp
  - id: dataverse.delete_table
    object: Table
    action: delete_table
    description: "Deletes a table from Dataverse, only after explicit user approval."
    category: Platform & DevOps
    risk: critical
    business_impact: "Drops an entire Dataverse table and every row it holds — irreversible loss of all business and customer data stored in that table."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/data-platform-mcp
  - id: dataverse.create_table
    object: Table
    action: create_table
    description: "Creates a new table with a specified schema."
    category: Platform & DevOps
    risk: medium
    business_impact: "Adds a new table and schema to the Dataverse environment, altering the data model that downstream apps and flows depend on."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/data-platform-mcp
  - id: dataverse.update_table
    object: Table
    action: update_table
    description: "Modifies schema or metadata of an existing table."
    category: Platform & DevOps
    risk: medium
    business_impact: "Alters the schema or metadata of an existing table, which can break dependent apps, forms, and integrations relying on the old shape."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
