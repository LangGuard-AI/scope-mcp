  - id: verisk-underwriting-intelligence.iso_losscost_indications_get
    object: LossCostIndication
    action: iso_losscost_indications_get
    description: "Retrieve ISO loss cost indications (current-review / filing-aligned intelligence)."
    category: Data Access
    risk: low
    business_impact: "Returns the ISO loss cost indications an actuary carries into a rate filing; a stale or misattributed figure propagates into filed rates and reserve estimates."
    compliance: [SOX, COSO]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

