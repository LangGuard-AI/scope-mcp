source: langguard-editorial
updated: "2026-06"
reference: https://github.com/LSEG-API-Samples/lseg-claude-plugin/blob/main/CONNECTORS.md
# LSEG (London Stock Exchange Group) exposes a single read-only financial-analytics
# MCP server (the LFA MCP Server at https://api.analytics.lseg.com/lfa/mcp/server-cl).
# Every tool retrieves market data, prices, curves, or analytics — there are no
# writes, no destructive actions, no money movement, and no personal data of
# identifiable individuals. compliance arrays are intentionally empty: this is
# market/instrument reference data, not customer PII (privacy regimes out), not the
# org's own financial-reporting system (SOX/COSO out), and not a financial-account
# data store (GLBA out). LSEG's data-licensing/entitlement sensitivity is contractual,
# not a regulatory regime, so it is noted in business_impact prose only.
actions:
