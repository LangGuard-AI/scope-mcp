  - id: london-stock-exchange-group.bond_price
    object: Bond
    action: bond_price
    description: "Calculate bond pricing, valuation, and analytics from ISIN/RIC/CUSIP/AssetId; returns yield, duration, convexity, DV01, accrued interest, with what-if overrides."
    category: Bond Pricing
    risk: low
    business_impact: "Reads bond pricing and analytics from LSEG market data; no state change, though results are entitlement-gated licensed data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: london-stock-exchange-group.bond_future_price
