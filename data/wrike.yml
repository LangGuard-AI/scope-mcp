  # ---------- Identity & Access ----------

  # source: https://developers.wrike.com/docs/available-tools-on-wrike-mcp
  - id: wrike.get_users
    object: User
    action: get_users
    description: "Look up specific users by id or email, or resolve 'me'."
    category: Identity & Access
    risk: medium
    business_impact: "Resolves account holders to their profile and email address, exposing employee and collaborator contact details to the agent."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developers.wrike.com/docs/available-tools-on-wrike-mcp
  - id: wrike.search_users
    object: User
    action: search_users
    description: "Find people or groups by name — or, with no query, surface your top collaborators."
    category: Identity & Access
    risk: medium
    business_impact: "Enumerates the account's people directory and infers working relationships from collaboration frequency, handing an agent an internal org map."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

