  # source: https://developers.wrike.com/docs/available-tools-on-wrike-mcp
  - id: wrike.update_items
    object: WorkItem
    action: update_items
    description: "Edit title, description, status, dates and custom fields; apply the same change to up to 20 items at once."
    category: Operations
    risk: high
    business_impact: "Rewrites titles, descriptions, statuses, dates and custom fields across up to 20 work items in one call, so a single mistaken batch can distort project state and reporting for an entire team."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

