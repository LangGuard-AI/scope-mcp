    category: Operations
    risk: medium
    business_impact: "Files an intake request under the acting user's identity, creating the task or project the form configures and starting whatever downstream routing that form triggers."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

