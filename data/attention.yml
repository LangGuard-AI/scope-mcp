actions:
  # ---------- Secrets & Workflows ----------

  # source: https://docs.attention.com/mcp/tools-overview.md
  - id: attention.create_api_key
    object: ApiKey
    action: create_api_key
    category: Secrets & Workflows
    risk: critical
    business_impact: "Mints a new API key whose token is displayed only once, creating a long-lived credential that can authenticate full API access if leaked."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.attention.com/mcp/tools-overview.md
  - id: attention.delete_api_key
    object: ApiKey
    action: delete_api_key
    category: Secrets & Workflows
    risk: high
    business_impact: "Permanently revokes an API key, immediately breaking any integration or automation that authenticates with it."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.attention.com/mcp/tools-overview.md
  - id: attention.list_api_keys
    object: ApiKey
    action: list_api_keys
    category: Secrets & Workflows
    risk: medium
    business_impact: "Enumerates every API key configured for the org (metadata only, no token values), exposing the credential inventory and integration footprint."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

