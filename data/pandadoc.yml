schema_version: "1.3"
platform: pandadoc
display_name: PandaDoc
logo: https://developers.pandadoc.com/favicon.ico
source: langguard-editorial
updated: "2026-09"
mcp_server_url: https://developers.pandadoc.com/mcp
reference: https://developers.pandadoc.com/mcp
actions:
  # ---------- Data Access ----------

  # source: https://developers.pandadoc.com/mcp
  - id: pandadoc.execute-request
    object: "*"
    action: execute-request
    description: "Executes an API request with a given HAR request object."
    category: Data Access
    risk: critical
    business_impact: "Issues any authenticated HTTP call to the PandaDoc API, so one invocation can delete documents and templates or pull signed contracts and signer PII in bulk with no per-endpoint boundary."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOX, COSO, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Operations ----------

  # source: https://developers.pandadoc.com/mcp
  - id: pandadoc.list-endpoints
    object: APIEndpoint
    action: list-endpoints
    description: "Lists all API paths and their HTTP methods with summaries, organized by path."
    category: Operations
    risk: low
    business_impact: "Enumerates every PandaDoc API path and method from the published spec; read-only reconnaissance that exposes no customer data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developers.pandadoc.com/mcp
  - id: pandadoc.get-endpoint
    object: APIEndpoint
    action: get-endpoint
    description: "Gets detailed information about a specific API endpoint, including security schemes and servers."
    category: Operations
    risk: low
    business_impact: "Returns the full spec for one PandaDoc endpoint, including its security schemes and server hosts, which maps the auth surface an agent could later call."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developers.pandadoc.com/mcp
  - id: pandadoc.search-endpoints
    object: APIEndpoint
    action: search-endpoints
    description: "Performs a deep search through paths, operations, and parameters to discover relevant API endpoints."
    category: Operations
    risk: low
    business_impact: "Searches PandaDoc's API reference for endpoints, operations, and parameters matching a keyword; read-only discovery over spec metadata."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial
