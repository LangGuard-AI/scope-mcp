    action: get_list
    description: "Retrieve configuration and tracking options for a list."
    category: Customer
    risk: low
    business_impact: "Reads one list's configuration and tracking options; metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

