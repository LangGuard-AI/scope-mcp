schema_version: "1.1"
platform: activecampaign
display_name: ActiveCampaign
source: langguard-editorial
updated: "2026-06"
reference: https://developers.activecampaign.com/page/mcp-available-tools
actions:
  # ---------- Customer ----------
  - id: activecampaign.list_contacts
    object: Contact
    action: list_contacts
    description: "Retrieve contacts with advanced filtering (segment, form, list, tag) and pagination."
    category: Customer
    risk: high
    business_impact: "Bulk paginated read of the contact database; mass PII extraction (names, emails, phone numbers) and a data-exfiltration event regardless of intent."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: activecampaign.get_contact
    object: Contact
    action: get_contact
    description: "Fetch detailed information for a specific contact by ID."
    category: Customer
    risk: medium
    business_impact: "Reads a single contact's PII (name, email, phone, engagement); exposure limited to one record."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: activecampaign.create_or_update_contact
    object: Contact
    action: create_or_update_contact
    description: "Add or update contact data using email as a unique identifier."
    category: Customer
    risk: medium
    business_impact: "Writes or overwrites a contact's PII keyed on email; affects marketing consent state and downstream automation eligibility."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Customer Data Fields ----------
  - id: activecampaign.list_contact_field_values
    object: ContactFieldValue
    action: list_contact_field_values
    description: "Retrieve actual data values stored in custom fields."
    category: Customer
    risk: high
    business_impact: "Bulk read of arbitrary custom-field values that frequently hold sensitive PII (date of birth, address, identifiers); data-exfiltration surface."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: activecampaign.get_contact_field_value
    object: ContactFieldValue
    action: get_contact_field_value
    description: "Fetch a specific data point for a contact field."
    category: Customer
    risk: medium
    business_impact: "Reads a single custom-field data point for one contact, which may contain sensitive PII depending on the field definition."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: activecampaign.create_contact_field_value
    object: ContactFieldValue
    action: create_contact_field_value
    description: "Set or create a value for a specific contact's custom field."
    category: Customer
    risk: medium
    business_impact: "Writes a custom-field value for a contact, potentially storing additional PII against the record."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: activecampaign.update_contact_field_value
    object: ContactFieldValue
    action: update_contact_field_value
    description: "Modify an existing custom field value."
    category: Customer
    risk: medium
    business_impact: "Overwrites a stored custom-field value for a contact; may alter PII held against the record."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: activecampaign.list_contact_custom_fields
    object: ContactCustomField
    action: list_contact_custom_fields
    description: "Retrieve definitions of all contact custom fields."
    category: Customer
    risk: low
    business_impact: "Reads custom-field schema definitions only, not values; reveals what PII the workspace collects but exposes no individual data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: activecampaign.get_contact_custom_field
    object: ContactCustomField
    action: get_contact_custom_field
    description: "Fetch details for a specific custom field definition."
    category: Customer
    risk: low
    business_impact: "Reads one custom-field definition; metadata only, no contact values exposed."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: activecampaign.create_contact_custom_field
    object: ContactCustomField
    action: create_contact_custom_field
    description: "Create a new field (text, date, dropdown, etc.)."
    category: Customer
    risk: low
    business_impact: "Adds a new custom-field definition to the schema; reversible configuration change, no contact data touched."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: activecampaign.create_field_options
    object: ContactCustomField
    action: create_field_options
    description: "Batch create options for selection-based custom fields."
    category: Customer
    risk: low
    business_impact: "Adds selectable options to a dropdown-style custom field; reversible schema configuration."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: activecampaign.create_contact_field_relationship
    object: ContactCustomField
    action: create_contact_field_relationship
    description: "Link a custom field to specific contact lists."
    category: Customer
    risk: low
    business_impact: "Associates a custom field with specific lists; reversible configuration change with no data exposure."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

