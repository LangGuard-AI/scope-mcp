updated: "2026-09"
mcp_server_url: https://mcp.auraintelligence.com/mcp
# Aura's own docs host (docs.getaura.ai) serves an expired certificate and 404s on
# every documented path as of 2026-09-26, and the getaura.ai / auraintelligence.com
# marketing domains now redirect to an unrelated Bain Consulting page. The
# Anthropic-verified connector listing is therefore the only surviving first-party
# evidence for the tool surface; the server itself gates `tools/list` behind OAuth,
# so no live introspection was possible and every entry is capped at `medium`
# confidence. `logo` is omitted deliberately: no vendor-controlled URL currently
# serves an image.
reference: https://claude.com/connectors/aura
