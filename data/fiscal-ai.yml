source: langguard-editorial
updated: "2026-06"
server_version: "2026-06"
reference: https://docs.fiscal.ai/docs/guides/mcp-integration
# Provenance note (curator): Fiscal.ai's MCP endpoint (https://api.fiscal.ai/mcp,
# streamable-http; legacy SSE at https://api.fiscal.ai/mcp/sse) gates tools/list
# behind OAuth, so the full verbatim tool set could not be introspected. The vendor
# docs name exactly ONE MCP tool verbatim — `company_profile` (Quick Test section) —
# captured below as a verbatim entry. The remaining read surface is documented only as
# plain-language capability labels (introduction page), captured below as
# id_form: capability entries: each entry's `id` is the snake_case slug of its own
# verbatim `description` label, and confidence is capped at medium.
# The REST operationIds in the OpenAPI spec (get_CompanyProfile, get_CompaniesList, …)
# were deliberately NOT used as tool ids: they are REST PascalCase and demonstrably
# differ from the published MCP name `company_profile` (snake_case), so deriving MCP
# ids from them would be fabrication. Reference/catalog endpoints that exist ONLY as
# REST operations with no matching vendor capability label (companies-list,
# standardized-metrics-list, ratios-list, earnings-calendar, top-news) were omitted
# rather than invented. The entire surface is READ-ONLY institutional financial data on
# public companies (SEC filings, market quotes, fundamentals) — no writes, no PII, no
# payment/health data.
actions:
  # ---------- Reference Data ----------
  - id: fiscal-ai.company_profile
    object: Company
    action: company_profile
    description: "Get the company profile for a single company (the MCP tool named verbatim in the vendor Quick Test)."
    reference: https://docs.fiscal.ai/docs/guides/mcp-integration
    category: Data Access
    risk: low
    business_impact: "Reads a single public company's profile; non-sensitive public reference data."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: fiscal-ai.company_logo
