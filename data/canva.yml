actions:
  # ---------- Imports & Exports ----------
  - id: canva.export-design
    object: Design
    action: export-design
    description: "Exports a design as a downloadable file (PDF, image, etc.)."
    category: Imports & Exports
    risk: medium
    business_impact: "Moves a single design's creative content outside the platform; may carry confidential branded material but is not bulk PII exfiltration."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: canva.import-design-from-url
    object: DesignImport
    action: import-design-from-url
    description: "Imports external design content from a supplied URL into the workspace."
    category: Imports & Exports
    risk: medium
    business_impact: "Pulls arbitrary remote content into the workspace from a caller-supplied URL; provenance is unvetted and the fetch can reach internal endpoints."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: canva.resize-design
    object: Design
    action: resize-design
    description: "Produces a resized variant of an existing design."
    category: Imports & Exports
    risk: low
    business_impact: "Creates a resized copy of a design; reversible and non-sensitive."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

