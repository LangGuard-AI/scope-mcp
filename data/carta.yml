reference: https://docs.carta.com/api-platform/docs/claude-plugins-setup
# The Carta connector (https://claude.com/connectors/carta) bundles three official
# plugins served by TWO MCP servers, both verbatim-verified from primary sources:
#   1. Cap Table + Investors — generic-dispatcher tools on the OAuth-gated server
#      https://mcp.app.carta.com/mcp. The 9 verbatim tool names below are confirmed
#      from the official carta/plugins marketplace repo: every SKILL.md `allowed-tools`
#      frontmatter (the authoritative proxy for tools/list) enumerates exactly
#      mcp__carta__{fetch,call_tool,discover,set_context,list_contexts,list_accounts,
#      welcome,authenticate,complete_authentication}. The `fetch` and `call_tool` tools
#      both dispatch named
#      command verbs (cap_table:get:*, fa:mutate:*, dwh:execute:query, ...) and covers
#      the full read/write financial + data-warehouse surface; `discover` searches the
#      command catalog. There is NO standalone `execute_query` MCP tool — SQL runs as
#      `fetch(command="dwh:execute:query", {sql})`; the README's "MCP Tools" table is a
#      conceptual/legacy description, not the real tool list (removed prior fabrication).
#   2. Carta CRM (ListAlpha) — explicit per-tool list published verbatim at
#      https://docs.carta.com/crm/docs/carta-crm-mcp (server https://mcp.listalpha.com/mcp).
#      78 distinct named tools (47 read + 31 write); the page's "92 total" headline is
#      not backed by 92 distinct names (two independent fetches return the same 78).
# Verified surface: 87 tools (9 cap-table/investors + 78 CRM). Written: 72.
# Trimmed: 15 routine CRM schema/field/custom-field-definition/folder/how-to getters
# with no PII or financial payload. Every write/destructive tool and every PII/financial
# or bulk/aggregate read is kept.
actions:
  # ---------- Financial ----------
  - id: carta.fetch
    object: "*"
    action: fetch
    description: "Dispatches a named Carta command (e.g. cap_table:get:*, compensation:get:*, fa:mutate:*, dwh:execute:query) to read or mutate cap-table, equity, valuation, compensation, fund-admin, and data-warehouse records."
    reference: https://docs.carta.com/api-platform/docs/claude-plugins-setup
    category: Financial
    risk: critical
    business_impact: "Generic dispatcher over the cap table, grants, 409A valuations, fund-admin records, and the data warehouse — can read or mutate equity and financial data that feeds financial statements, in scope for SOX ITGCs, and can bulk-extract NAV/LP/portfolio financials via SQL."
    compliance: [SOX, COSO, GLBA, SOC2, ISO_27001, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: carta.call_tool
    object: "*"
    action: call_tool
    description: "Invokes a named Carta command by name with arguments (e.g. cap_table:get:*, compensation:get:*, fa:mutate:*, dwh:execute:query) — the generic command dispatcher that reads or mutates cap-table, equity, valuation, compensation, fund-admin, and data-warehouse records."
    reference: https://docs.carta.com/api-platform/docs/claude-plugins-setup
    category: Financial
    risk: critical
    business_impact: "Generic dispatcher over the cap table, grants, 409A valuations, fund-admin records, and the data warehouse — can read or mutate equity and financial data that feeds financial statements, in scope for SOX ITGCs, and can bulk-extract NAV/LP/portfolio financials via SQL."
    compliance: [SOX, COSO, GLBA, SOC2, ISO_27001, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: carta.discover
    object: Command
    action: discover
    description: "Searches the cap-table/fund-admin command catalog by keyword and returns matching command names, required params, and help."
    reference: https://docs.carta.com/api-platform/docs/claude-plugins-setup
    category: Financial
    risk: low
    business_impact: "Read-only catalog search over available dispatcher commands; returns metadata, no financial records."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

