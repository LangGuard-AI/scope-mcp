  # ---------- Trimmed toolsets (read-only helpers / no-data utilities, omitted) ----------
  # The Datadog MCP server exposes 148 verbatim tools across 21 toolsets. This file
  # curates the 61 risk-bearing tools (every create/update/delete/edit/upsert/execute/
  # sync/append write, plus the PII-plausible reads: logs, RUM, traces/spans, error
  # tracking, cases, security signals, DDSQL, reference tables, DB query text). Both
  # destructive deletes (delete_datadog_dashboard, delete_datadog_security_suppression)
  # are included.
  #
  # The 87 omitted tools are non-risk-bearing and an audit does not need to gate them:
  #   - Onboarding toolset (7): guided setup walkthroughs, no data access.
  #   - Widget/notebook helpers: get_widget, get_widget_reference[_compressed],
  #     validate_dashboard_widget, validate_notebook_cell[s], verify_widget_data,
  #     visualize_tabular_data, swap_widget_type, search_datadog_widgets, ask_widget_expert.
  #   - Schema/spec getters: ddsql_get_spec, ddsql_schema_*, *_schema getters for security
  #     signals / detection rules / findings.
  #   - Infra-telemetry reads (metrics, hosts, service deps, APM analysis, watchdog,
  #     change/recommendation stories, monitor/SLO/dashboard/notebook reads, DBM diagnostic
  #     reads, network/NDM reads, RUM aggregate reads, list/get reads on cases/flags/
  #     workflows/synthetics, CI/test/coverage/DORA aggregate reads, describe_k8s_resource).
  #   - These carry no personal data beyond what their write/PII-bearing counterparts above
  #     already represent, so they are intentionally not enumerated as separate actions.
