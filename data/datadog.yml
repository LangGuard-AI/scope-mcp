    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: datadog.link_jira_issue_to_datadog_case
    object: Case
    action: link_jira_issue_to_datadog_case
    description: "Links a Jira issue to a Datadog case."
    category: Operations
    risk: low
    business_impact: "Associates a Jira issue with a case; reversible cross-system link, no data destruction."
    compliance: [SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: datadog.search_datadog_cases
    object: Case
    action: search_datadog_cases
    description: "Searches Case Management cases with filters including status, priority, project, and assignee."
    category: Operations
