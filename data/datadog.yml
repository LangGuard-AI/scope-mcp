    risk: medium
    business_impact: "Returns full error-issue detail including stack traces and user context that may contain PII."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: datadog.update_datadog_error_tracking_issue
    object: ErrorTrackingIssue
    action: update_datadog_error_tracking_issue
    description: "Updates the state or assignee of an Error Tracking Issue."
    category: Issues
    risk: low
    business_impact: "Changes the workflow state or assignee of an error issue; reversible and individually audited."
    compliance: [SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

