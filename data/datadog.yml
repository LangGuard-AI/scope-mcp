schema_version: "1.2"
platform: datadog
display_name: Datadog
source: langguard-editorial
updated: "2026-06"
server_version: "2026-06"
server_website: https://docs.datadoghq.com/bits_ai/mcp_server/
maintainer: https://www.datadoghq.com/support/
reference: https://docs.datadoghq.com/bits_ai/mcp_server/tools/
# Source: live tools/list was OAuth-gated (HTTP 401); tool ids extracted verbatim from
# the vendor MCP tools reference page (148 tools across 21 toolsets). This file covers
# the risk-bearing surface: all writes/deletes, code execution, workflow execution,
# security-control mutations, and the PII-plausible reads (logs, RUM, traces/spans,
# error-tracking, cases, security signals, DDSQL). Pure-noise toolsets are trimmed and
# noted at the bottom of this file.
actions:
  # ---------- Code Execution ----------
  - id: datadog.execute_code
    object: Sandbox
    action: execute_code
    description: "Executes AI agent-authored TypeScript in a Datadog-managed sandbox that can query and modify any Datadog resource the caller's RBAC permits."
    category: Platform & DevOps
    risk: critical
    business_impact: "Runs arbitrary agent-authored code against Datadog APIs under the caller's identity; can read or mutate any resource the user can access, bypassing per-tool review."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Security ----------
  - id: datadog.create_datadog_security_suppression
    object: SecuritySuppression
    action: create_datadog_security_suppression
    description: "Creates a suppression rule that prevents a detection rule from generating signals for matching conditions."
    category: Identity & Access
    risk: critical
    business_impact: "Suppresses future security detections; a single actor can silence alerting on real threats without a second approver."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: datadog.update_datadog_security_suppression
    object: SecuritySuppression
    action: update_datadog_security_suppression
    description: "Updates an existing security suppression rule."
    category: Identity & Access
    risk: critical
    business_impact: "Weakens an active security detection gate; a single actor can widen a suppression to silence future detections, the direct analogue of disabling change-control protection."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: datadog.delete_datadog_security_suppression
    object: SecuritySuppression
    action: delete_datadog_security_suppression
    description: "Deletes a security suppression rule."
    category: Identity & Access
    risk: medium
    business_impact: "Removes a suppression rule; reversible by recreating it, but changes the active detection posture."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: datadog.update_datadog_security_signals_triage
    object: SecuritySignal
    action: update_datadog_security_signals_triage
    description: "Updates the triage state or assignee of up to 500 security signals in bulk."
    category: Identity & Access
    risk: high
    business_impact: "Bulk-closes or reassigns security signals; a single actor can mark active threats resolved, bypassing incident-review controls."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: datadog.datadog_secrets_scan
    object: Secret
    action: datadog_secrets_scan
    description: "Scans code for hardcoded secrets and credentials (AWS keys, API keys, passwords, tokens, private keys, database credentials)."
    category: Secrets & Workflows
    risk: high
    business_impact: "Surfaces hardcoded secrets and credentials in code; results expose live credential material if mishandled."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: datadog.search_datadog_security_signals
    object: SecuritySignal
    action: search_datadog_security_signals
    description: "Searches security signals from Cloud SIEM, App & API Protection, and Workload Protection."
    category: Operations
    risk: high
    business_impact: "Returns security detection signals that can include attacker activity, source IPs, and impacted-user identifiers."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: datadog.analyze_datadog_security_signals
    object: SecuritySignal
    action: analyze_datadog_security_signals
    description: "Analyzes security signals using SQL queries for aggregations, grouping, and trend analysis."
    category: Operations
    risk: high
    business_impact: "Runs SQL aggregations over security signals; can extract patterns across signals containing source IPs and user identifiers."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: datadog.get_datadog_security_signal
    object: SecuritySignal
    action: get_datadog_security_signal
    description: "Retrieves the full details of a single security signal by ID, including triage state and case correlations."
    category: Operations
    risk: medium
    business_impact: "Returns one security signal's full detail, which may include source IPs and impacted-user identifiers."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: datadog.list_datadog_security_detection_rules
    object: DetectionRule
    action: list_datadog_security_detection_rules
    description: "Lists detection rules that define when security signals are generated."
    category: Operations
    risk: low
    business_impact: "Reads the org's security detection-rule definitions; exposes the detection posture but not personal data."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: datadog.analyze_security_findings
    object: SecurityFinding
    action: analyze_security_findings
    description: "Analyzes security findings using SQL queries over the last 24 hours of live data."
    category: Operations
    risk: high
    business_impact: "Runs SQL over live security/posture findings; surfaces misconfigurations and vulnerable assets across the estate."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: datadog.search_security_findings
    object: SecurityFinding
    action: search_security_findings
    description: "Retrieves full security finding details when SQL analysis is insufficient."
    category: Operations
    risk: medium
    business_impact: "Returns full security finding objects describing vulnerable or misconfigured assets."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Logs & Query (PII-bearing data access) ----------
  - id: datadog.search_datadog_logs
    object: Log
    action: search_datadog_logs
    description: "Searches logs with filters (time, query, service, host, storage tier) and returns log details."
    category: Data Access
    risk: high
    business_impact: "Bulk-reads application logs that commonly contain PII, request payloads, and credentials in plaintext."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: datadog.analyze_datadog_logs
    object: Log
    action: analyze_datadog_logs
    description: "Analyzes logs using SQL queries for counting, aggregations, and numerical analysis."
    category: Data Access
    risk: high
    business_impact: "Runs SQL aggregations across the log estate; can extract patterns from logs containing PII at scale."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: datadog.ddsql_run_query
    object: Dataset
    action: ddsql_run_query
    description: "Runs a DDSQL query across infrastructure resources, logs, metrics, RUM, and spans."
    category: Data Access
    risk: high
    business_impact: "SQL access across logs, RUM, and spans in one query; a single statement can exfiltrate PII spanning multiple data sources."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: datadog.ddsql_create_link
    object: Dataset
    action: ddsql_create_link
    description: "Generates a Datadog UI link to the DDSQL Editor with a given query pre-populated."
    category: Data Access
    risk: low
    business_impact: "Builds a shareable query link; constructs but does not execute a query, surfacing no data directly."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- RUM (real-user monitoring; session/PII data) ----------
  - id: datadog.search_datadog_rum_events
    object: RUMEvent
    action: search_datadog_rum_events
    description: "Searches Datadog RUM events using advanced query syntax."
    category: Data Access
    risk: high
    business_impact: "Reads real-user-monitoring events containing end-user sessions, IP addresses, geolocation, and behavior data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: datadog.get_rum_insight
    object: RUMApplication
    action: get_rum_insight
    description: "Returns aggregated RUM insights: waterfall, long tasks, vital distributions, and tag analysis."
    category: Data Access
    risk: medium
    business_impact: "Returns aggregated real-user-monitoring insights; aggregated but derived from end-user session data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- APM Traces & Spans (may carry PII in tags/payloads) ----------
  - id: datadog.get_datadog_trace
    object: Trace
    action: get_datadog_trace
    description: "Fetches a complete trace from Datadog APM using a trace ID."
