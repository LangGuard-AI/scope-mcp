schema_version: "1.1"
platform: stripe
display_name: Stripe
source: langguard-editorial
updated: "2026-06"
reference: https://docs.stripe.com/mcp
actions:
  # ---------- Financial ----------
  - id: stripe.create_refund
    object: Refund
    action: create_refund
    description: "Issues a refund for a charge or payment intent, moving money back to the customer."
    category: Financial
    risk: critical
    business_impact: "Moves money out of the account to a customer; effectively irreversible once settled and a direct general-ledger event."
    compliance: [SOX, COSO, PCI, PSD2, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.finalize_invoice
    object: Invoice
    action: finalize_invoice
    description: "Finalizes a draft invoice, locking it and triggering payment collection."
    category: Financial
    risk: critical
    business_impact: "Locks the invoice and commits the receivable to collection; revenue-recognition event tied to the GL."
    compliance: [SOX, COSO, PCI, PSD2, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.create_invoice
    object: Invoice
    action: create_invoice
    description: "Creates a new invoice for a customer."
    category: Financial
    risk: high
    business_impact: "Creates a billable invoice; revenue-recognition relevant once finalized."
    compliance: [SOX, COSO, PCI, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.create_invoice_item
    object: InvoiceItem
    action: create_invoice_item
    description: "Adds a line item to a draft invoice."
    category: Financial
    risk: high
    business_impact: "Adds a charge line to a draft invoice; affects the amount billed to the customer."
    compliance: [SOX, COSO, PCI, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.create_payment_link
    object: PaymentLink
    action: create_payment_link
    description: "Creates a shareable payment link that initiates a checkout flow."
    category: Financial
    risk: high
    business_impact: "Generates a publicly shareable URL that initiates a payment against the account; a payment-initiation surface."
    compliance: [PCI, PSD2, SOX, COSO, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.list_invoices
    object: Invoice
    action: list_invoices
    description: "Lists invoices on the account."
    category: Financial
    risk: medium
    business_impact: "Reads invoice history including amounts and customer references; transaction-record exposure."
    compliance: [PCI, SOX, COSO, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.list_payment_intents
    object: PaymentIntent
    action: list_payment_intents
    description: "Lists PaymentIntents on the account."
    category: Financial
    risk: medium
    business_impact: "Reads payment attempts including amounts, status, and partial card data; transaction-record exposure."
    compliance: [PCI, PSD2, SOX, COSO, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.retrieve_balance
    object: Balance
    action: retrieve_balance
    description: "Retrieves the current account balance."
    category: Financial
    risk: low
    business_impact: "Reads current available and pending Stripe balance; aggregate financial figure, no PII."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  # ---------- Disputes ----------
  - id: stripe.update_dispute
    object: Dispute
    action: update_dispute
    description: "Updates a dispute, typically to submit or modify evidence."
    category: Financial
    risk: high
    business_impact: "Submits or modifies chargeback evidence; affects dispute outcome and the funds at stake."
    compliance: [PCI, PSD2, SOX, COSO, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.list_disputes
    object: Dispute
    action: list_disputes
    description: "Lists disputes on the account."
    category: Financial
    risk: medium
    business_impact: "Reads chargeback / dispute records including amounts, reason codes, and customer references."
    compliance: [PCI, PSD2, SOX, COSO, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  # ---------- Revenue & Pipeline ----------
  - id: stripe.cancel_subscription
    object: Subscription
    action: cancel_subscription
    description: "Cancels an active subscription."
    category: Revenue & Pipeline
    risk: high
    business_impact: "Ends a recurring revenue stream; reverses future-period revenue recognition for that customer."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.update_subscription
    object: Subscription
    action: update_subscription
    description: "Updates plan, quantity, or trial state of a subscription."
    category: Revenue & Pipeline
    risk: high
    business_impact: "Changes the plan, quantity, or trial state of a recurring billing relationship; alters recognized revenue."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.list_subscriptions
    object: Subscription
    action: list_subscriptions
    description: "Lists subscriptions on the account."
    category: Revenue & Pipeline
    risk: medium
    business_impact: "Reads recurring billing arrangements including customer, plan, and amount; couples revenue data with customer PII."
    compliance: [SOX, COSO, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.create_price
    object: Price
    action: create_price
    description: "Creates a price for a product."
    category: Revenue & Pipeline
    risk: medium
    business_impact: "Defines pricing applied to subsequent invoices and subscriptions; revenue-recognition relevant."
    compliance: [SOX, COSO]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.create_coupon
    object: Coupon
    action: create_coupon
    description: "Creates a discount coupon."
    category: Revenue & Pipeline
    risk: medium
    business_impact: "Creates a discount instrument that reduces future invoice amounts; affects recognized revenue."
    compliance: [SOX, COSO]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.create_product
    object: Product
    action: create_product
    description: "Creates a product in the catalog."
    category: Revenue & Pipeline
    risk: low
    business_impact: "Defines a new sellable item in the catalog; metadata only, no money movement or PII."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.list_prices
    object: Price
    action: list_prices
    description: "Lists prices on the account."
    category: Revenue & Pipeline
    risk: low
    business_impact: "Reads pricing definitions; catalog metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.list_products
    object: Product
    action: list_products
    description: "Lists products in the catalog."
    category: Revenue & Pipeline
    risk: low
    business_impact: "Reads catalog products; metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.list_coupons
    object: Coupon
    action: list_coupons
    description: "Lists coupons on the account."
    category: Revenue & Pipeline
    risk: low
    business_impact: "Reads available discount instruments; catalog metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  # ---------- Customer ----------
  - id: stripe.list_customers
    object: Customer
    action: list_customers
    description: "Lists customers on the account."
    category: Customer
    risk: high
    business_impact: "Bulk read of customer records including billing PII (name, email, address); data-exfiltration risk at scale."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, PCI, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.create_customer
    object: Customer
    action: create_customer
    description: "Creates a customer record."
    category: Customer
    risk: medium
    business_impact: "Creates a customer record holding billing PII (name, email, address)."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  # ---------- Platform & DevOps ----------
  - id: stripe.search_stripe_resources
    object: "*"
    action: search_stripe_resources
    description: "Searches across Stripe resources matching a query."
    category: Platform & DevOps
    risk: medium
    business_impact: "Generic search across Stripe resources; may return customer PII and financial records depending on the query."
    compliance: [PCI, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: stripe.fetch_stripe_resources
    object: "*"
    action: fetch_stripe_resources
    description: "Fetches a specific Stripe object by id."
    category: Platform & DevOps
    risk: medium
    business_impact: "Generic fetch of an arbitrary Stripe object by id; PII and financial exposure depends on the target resource."
    compliance: [PCI, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: stripe.get_stripe_account_info
    object: Account
    action: get_stripe_account_info
    description: "Retrieves information about the connected Stripe account."
    category: Platform & DevOps
    risk: low
    business_impact: "Reads metadata about the connected Stripe account; no customer PII or money movement."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: stripe.search_stripe_documentation
    object: Documentation
    action: search_stripe_documentation
    description: "Searches Stripe's knowledge base of documentation and support articles."
    category: Platform & DevOps
    risk: low
    business_impact: "Searches Stripe's public documentation; no account data accessed."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]
