  - id: cloudflare.d1_databases_list
    object: D1Database
    action: d1_databases_list
    description: "Lists the D1 databases in the account."
    category: Platform & DevOps
    risk: low
    business_impact: "Enumerates D1 databases in the account; infrastructure inventory metadata only."
    compliance: []
    sod_concern: false
