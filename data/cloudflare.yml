    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: cloudflare.r2_bucket_get
    object: R2Bucket
    action: r2_bucket_get
    description: "Retrieves details of a single R2 storage bucket."
    category: Platform & DevOps
    risk: low
    business_impact: "Reads metadata for one R2 bucket; infrastructure detail only."
    compliance: []
    sod_concern: false
    confidence: high
