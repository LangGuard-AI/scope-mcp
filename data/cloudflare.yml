schema_version: "1.1"
platform: cloudflare
display_name: Cloudflare
source: langguard-editorial
updated: "2026-06"
reference: https://developers.cloudflare.com/agents/model-context-protocol/mcp-servers-for-cloudflare/
# Scope: the claude.com/connectors/cloudflare connector maps to Cloudflare's
# "Workers Bindings" remote MCP server (https://bindings.mcp.cloudflare.com/mcp),
# whose source registers KV, Workers, R2, D1, Hyperdrive, and Docs tools. Tool
# names are verbatim from the server's tool-registration source
# (cloudflare/mcp-server-cloudflare, packages/mcp-common/src/tools/*.tools.ts and
# apps/workers-bindings/src/bindings.app.ts). The separate Code-Mode API server
# (search/execute) and the other domain servers (Observability, Radar, Audit
# Logs, etc.) are NOT part of this connector and are intentionally excluded.
actions:
  # ---------- Data Access ----------
  - id: cloudflare.d1_database_query
    object: D1Database
    action: d1_database_query
    description: "Runs an arbitrary SQL statement against a D1 database in the account."
    category: Data Access
    risk: critical
    business_impact: "Executes unrestricted SQL against a production D1 database; a single call can read every row (bulk data exfiltration) or run DELETE/DROP to irreversibly destroy stored data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: cloudflare.workers_get_worker_code
    object: Worker
    action: workers_get_worker_code
    description: "Returns the source code of a deployed Cloudflare Worker."
    category: Data Access
    risk: high
    business_impact: "Returns deployed Worker source, which frequently embeds API keys, tokens, or business logic; sensitive read with secret-exposure potential."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  # ---------- Platform & DevOps ----------
  - id: cloudflare.d1_database_delete
    object: D1Database
    action: d1_database_delete
    description: "Deletes a D1 database from the account."
    category: Platform & DevOps
    risk: critical
    business_impact: "Irreversibly destroys a D1 database and all rows it holds, including any personal data the database stored; no recovery once executed (server marks this destructive)."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: cloudflare.r2_bucket_delete
    object: R2Bucket
    action: r2_bucket_delete
    description: "Deletes an R2 storage bucket from the account."
    category: Platform & DevOps
    risk: critical
    business_impact: "Irreversibly destroys an R2 object-storage bucket and all objects it holds, including any personal data those objects contained; no recovery once executed (server marks this destructive)."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: cloudflare.kv_namespace_delete
    object: KVNamespace
    action: kv_namespace_delete
    description: "Deletes a Workers KV namespace from the account."
    category: Platform & DevOps
    risk: critical
    business_impact: "Irreversibly destroys a KV namespace and all key-value pairs it holds, including any personal data those values contained; no recovery once executed (server marks this destructive)."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: cloudflare.hyperdrive_config_delete
    object: HyperdriveConfig
    action: hyperdrive_config_delete
    description: "Deletes a Hyperdrive configuration from the account."
    category: Platform & DevOps
    risk: critical
    business_impact: "Removes a Hyperdrive configuration that pools and routes connections to an origin database, severing application database access until rebuilt (server marks this destructive)."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: cloudflare.hyperdrive_config_edit
    object: HyperdriveConfig
    action: hyperdrive_config_edit
    description: "Patches an existing Hyperdrive configuration, including its origin database and credentials."
    category: Platform & DevOps
    risk: high
    business_impact: "Repoints or re-credentials a live Hyperdrive config; can silently redirect application database traffic to a different origin."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: cloudflare.d1_database_create
    object: D1Database
    action: d1_database_create
    description: "Creates a new D1 database in the account."
    category: Platform & DevOps
    risk: medium
    business_impact: "Provisions a new D1 database in the account; reversible by deletion and individually logged."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: cloudflare.r2_bucket_create
    object: R2Bucket
    action: r2_bucket_create
    description: "Creates a new R2 storage bucket in the account."
    category: Platform & DevOps
    risk: medium
    business_impact: "Provisions a new R2 object-storage bucket; reversible by deletion and individually logged."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: cloudflare.kv_namespace_create
    object: KVNamespace
    action: kv_namespace_create
    description: "Creates a new Workers KV namespace in the account."
    category: Platform & DevOps
    risk: medium
    business_impact: "Provisions a new KV namespace; reversible by deletion and individually logged."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: cloudflare.kv_namespace_update
    object: KVNamespace
    action: kv_namespace_update
    description: "Updates the title of a Workers KV namespace."
    category: Platform & DevOps
    risk: low
    business_impact: "Renames a KV namespace (title metadata only); reversible and low-impact."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Platform & DevOps (reads) ----------
