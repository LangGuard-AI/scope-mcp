actions:
  # ---------- Design ----------
  - id: magic-patterns.create_design
    object: Design
    action: create_design
    description: "Initiates a new design project, either blank or AI-generated from a prompt with optional template and design-system selection."
    category: Operations
    risk: low
    business_impact: "Creates a new design project in the workspace; reversible and isolated from existing designs."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: magic-patterns.send_prompt
    object: Design
    action: send_prompt
    description: "Submits natural-language instructions that update an existing design's content via background AI processing."
    category: Operations
    risk: medium
    business_impact: "Mutates an existing design via AI generation; reversible through version history but changes the active working content."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: magic-patterns.publish_artifact
    object: Artifact
    action: publish_artifact
    description: "Compiles source files and activates an artifact as the design's current working version."
    category: Operations
    risk: medium
    business_impact: "Promotes an artifact to the live working version of a design; reversible by republishing a prior version from history."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Artifacts ----------
  - id: magic-patterns.write_artifact_files
    object: Artifact
    action: write_artifact_files
    description: "Creates or overwrites source files within an artifact; requires a separate publish step to take effect."
    category: Operations
    risk: medium
    business_impact: "Overwrites source files inside an artifact; reversible via version history and gated behind a separate publish."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: magic-patterns.create_new_artifact
    object: Artifact
    action: create_new_artifact
    description: "Clones an existing artifact into a new named version."
    category: Operations
    risk: low
    business_impact: "Clones an artifact into a new version; additive and non-destructive to the source."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: magic-patterns.get_artifact
    object: Artifact
    action: get_artifact
    description: "Retrieves the active artifact's ID and file listing for a design."
    category: Operations
    risk: low
    business_impact: "Reads the active artifact's identifier and file listing; no state change."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: magic-patterns.read_artifact_files
    object: Artifact
    action: read_artifact_files
    description: "Reads the full contents of specified files within an artifact."
    category: Operations
    risk: low
    business_impact: "Reads source file contents from an artifact; no state change."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

