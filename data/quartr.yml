  # source: https://mcp.quartr.com/docs
  - id: quartr.update_keyword
    object: KeywordAlert
    action: update_keyword
    category: Monitoring & Alerts
    risk: medium
    business_impact: "Re-scopes a keyword alert; narrowing it to fewer companies or watchlists quietly shrinks what the user gets notified about."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
