actions:
  # ---------- Identity & Access ----------

  # source: https://mcp.quartr.com/docs
  - id: quartr.get_current_user
    object: User
    action: get_current_user
    category: Identity & Access
    risk: medium
    business_impact: "Returns the signed-in user's name, email address and subscription tier, pulling account-holder identity into the agent context and any downstream transcript."
    compliance: [GDPR, UK_GDPR, CCPA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Research Workspaces ----------

  # source: https://mcp.quartr.com/docs
  - id: quartr.delete_workspace
    object: Workspace
    action: delete_workspace
    category: Research Workspaces
    risk: high
    business_impact: "Destroys a workspace along with the research notes it holds, removing it for everyone with access and with no documented recovery path."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.quartr.com/docs
  - id: quartr.write_workspace
    object: Workspace
    action: write_workspace
    category: Research Workspaces
    risk: medium
    business_impact: "Rewrites a workspace document body; overwrite mode replaces the entire note live for every connected teammate, though a prior-state snapshot remains in version history."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.quartr.com/docs
  - id: quartr.read_workspace
    object: Workspace
    action: read_workspace
    category: Research Workspaces
    risk: medium
    business_impact: "Pulls the full body of an internal research workspace, surfacing the desk's private investment thesis and any market-sensitive notes into the model context."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.quartr.com/docs
  - id: quartr.create_workspace
    object: Workspace
    action: create_workspace
    category: Research Workspaces
    risk: low
    business_impact: "Adds a new research workspace to the account; visible to teammates but created empty, so nothing existing is altered."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.quartr.com/docs
  - id: quartr.tag_company_to_workspace
    object: Workspace
    action: tag_company_to_workspace
    category: Research Workspaces
    risk: low
    business_impact: "Links a company to a workspace, changing how the note is filed and which coverage views surface it."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.quartr.com/docs
  - id: quartr.untag_company_from_workspace
    object: Workspace
    action: untag_company_from_workspace
    category: Research Workspaces
    risk: low
    business_impact: "Unlinks a company from a workspace, dropping that coverage association from the team's filing structure."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Monitoring & Alerts ----------

  # source: https://mcp.quartr.com/docs
  - id: quartr.delete_keyword
    object: KeywordAlert
    action: delete_keyword
    category: Monitoring & Alerts
    risk: medium
    business_impact: "Removes a keyword alert, silently ending monitoring coverage for that term across the companies and watchlists it was scoped to."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
