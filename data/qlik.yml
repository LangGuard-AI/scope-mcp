schema_version: "1.2"
platform: qlik
display_name: Qlik
source: langguard-editorial
updated: "2026-06"
server_version: "2026-06"
server_website: https://help.qlik.com/en-US/cloud-services/Subsystems/Hub/Content/Sense_Hub/QlikMCP/Qlik-MCP-server.htm
maintainer: https://community.qlik.com/t5/Support/ct-p/qlikSupport
reference: https://help.qlik.com/en-US/cloud-services/Subsystems/Hub/Content/Sense_Hub/QlikMCP/Qlik-MCP-server-tools.htm
actions:
  # ---------- Data Access ----------
  # Value-returning tools: these surface ACTUAL underlying data values, whose
  # type is tenant-dependent and may include personal data. Tagged with the full
  # privacy stack at medium confidence (data type depends on the customer's app).
  - id: qlik.qlik_create_data_object
    object: DataObject
    action: qlik_create_data_object
    description: "Builds a temporary hypercube/calculation object to run ad-hoc queries against an app's loaded data."
    category: Data Access
    risk: high
    business_impact: "Ad-hoc query engine that surfaces underlying record values from the app's data model; can return personal data depending on the loaded dataset."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: qlik.qlik_get_field_values
    object: Field
    action: qlik_get_field_values
    description: "Retrieves the distinct values present in a specific field of an app."
    category: Data Access
    risk: high
    business_impact: "Dumps the distinct values of a column; for fields like name, email, or customer id this is a direct read of personal data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: qlik.qlik_search_field_values
    object: Field
    action: qlik_search_field_values
    description: "Searches for specific values across fields in an app."
    category: Data Access
    risk: high
    business_impact: "Returns matching underlying field values across the data model; can expose personal data when fields hold PII."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: qlik.qlik_get_chart_data
    object: Chart
    action: qlik_get_chart_data
    description: "Fetches paginated data rows backing an existing chart visualization."
    category: Data Access
    risk: medium
    business_impact: "Reads the actual values rendered by a chart; paginated but can include personal data depending on the chart's dimensions."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: qlik.qlik_get_dataset_sample
    object: Dataset
    action: qlik_get_dataset_sample
    description: "Previews the first rows of a dataset."
    category: Data Access
    risk: medium
    business_impact: "Returns sample rows of raw dataset content; bounded preview but can contain personal data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: qlik.qlik_get_dataset_profile
    object: Dataset
    action: qlik_get_dataset_profile
    description: "Accesses profiling statistics and value distributions for a dataset."
    category: Data Access
    risk: medium
    business_impact: "Surfaces value distributions and frequencies derived from raw data; can reveal personal-data patterns at the column level."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: qlik.qlik_get_dataset_schema
    object: Dataset
    action: qlik_get_dataset_schema
    description: "Retrieves the column definitions (names and types) of a dataset."
    category: Data Access
    risk: low
    business_impact: "Reads column metadata only; exposes field names and types, not the underlying values."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: qlik.qlik_search_knowledgebase_chunks
    object: KnowledgeBase
    action: qlik_search_knowledgebase_chunks
    description: "Searches indexed knowledge base contents and returns matching chunks."
    category: Data Access
    risk: medium
    business_impact: "Returns chunks of indexed document content; tenant-dependent and can include personal data depending on the indexed sources."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Data Products ----------
  # Governed data-product lifecycle: change-control surface over how data is
  # packaged, shared, and exposed in the tenant. SOC2/ISO on state changes.
  - id: qlik.qlik_create_data_product
    object: DataProduct
    action: qlik_create_data_product
    description: "Establishes a new data product in a space."
    category: Data Products
    risk: medium
    business_impact: "Creates a governed data product; reversible and individually audited."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: qlik.qlik_update_data_product
    object: DataProduct
    action: qlik_update_data_product
    description: "Modifies a data product's name, description, and dataset membership."
    category: Data Products
    risk: medium
    business_impact: "Changes which datasets a governed data product exposes; alters data sharing scope, reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: qlik.qlik_update_data_product_space
    object: DataProduct
    action: qlik_update_data_product_space
    description: "Relocates a data product to a different space."
    category: Data Products
    risk: medium
    business_impact: "Moves a data product between spaces, changing who can access it; a sharing-scope change."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: qlik.qlik_update_activate_data_product
    object: DataProduct
    action: qlik_update_activate_data_product
    description: "Activates a data product in a space, making it consumable."
    category: Data Products
    risk: medium
    business_impact: "Publishes a data product to consumers; reversible by deactivation."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: qlik.qlik_update_deactivate_data_product
    object: DataProduct
    action: qlik_update_deactivate_data_product
    description: "Deactivates a data product, removing it from consumers."
    category: Data Products
    risk: medium
    business_impact: "Withdraws a data product from consumers; can disrupt downstream dashboards but is reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: qlik.qlik_delete_data_product
    object: DataProduct
    action: qlik_delete_data_product
    description: "Removes a data product."
    category: Data Products
    risk: medium
    business_impact: "Deletes a governed data product definition; removes downstream access, reversible by recreation."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: qlik.qlik_get_data_product
    object: DataProduct
    action: qlik_get_data_product
    description: "Accesses a data product's metadata."
    category: Data Products
    risk: low
    business_impact: "Reads data-product metadata; definition only, no underlying record values."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Master Items ----------
  # Reusable library dimensions and measures: analytical DEFINITIONS (expressions),
