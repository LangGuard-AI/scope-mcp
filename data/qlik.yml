    description: "Establishes a reusable library dimension in an app."
    category: Master Items
    risk: low
    business_impact: "Adds a reusable dimension definition to an app; reversible and non-sensitive."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: qlik.qlik_update_dimension
    object: Dimension
    action: qlik_update_dimension
    description: "Modifies an existing library dimension."
    category: Master Items
    risk: low
    business_impact: "Changes a library dimension definition; affects charts that reuse it, reversible."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: qlik.qlik_delete_dimension
    object: Dimension
    action: qlik_delete_dimension
    description: "Removes a library dimension."
    category: Master Items
    risk: medium
    business_impact: "Deletes a reusable dimension; breaks charts that reference it but is recreatable."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: qlik.qlik_create_measure
    object: Measure
    action: qlik_create_measure
    description: "Establishes a reusable library measure with an expression."
    category: Master Items
    risk: low
    business_impact: "Adds a reusable measure (calculation) to an app; reversible and non-sensitive."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: qlik.qlik_update_measure
    object: Measure
    action: qlik_update_measure
    description: "Modifies an existing library measure."
    category: Master Items
    risk: medium
    business_impact: "Changes a measure's calculation expression; alters reported figures wherever the measure is reused, reversible."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: qlik.qlik_delete_measure
    object: Measure
    action: qlik_delete_measure
    description: "Removes a library measure."
    category: Master Items
    risk: medium
    business_impact: "Deletes a reusable measure; breaks charts that reference it but is recreatable."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: qlik.qlik_list_measures
    object: Measure
    action: qlik_list_measures
    description: "Inventories all library measures in an app."
    category: Master Items
    risk: low
    business_impact: "Reads the list of measure definitions; exposes calculation logic, not data values."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

