  # ---------- Usage & Reporting ----------
  - id: relativity.relone_usage_generate_report
    object: UsageReport
    action: relone_usage_generate_report
    description: "Creates a new usage report."
    category: Operations
    risk: medium
    business_impact: "Generates a usage/storage report whose row-level contents may include per-user activity metrics; reversible but produces a downloadable dataset."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: relativity.relone_usage_download_report
    object: UsageReport
    action: relone_usage_download_report
    description: "Downloads a completed usage report as a CSV file."
    category: Operations
    risk: medium
    business_impact: "Exports a usage report as CSV; contents are usage/storage metrics that may include per-user activity, so the file can carry user-identifying data off-platform."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: relativity.relone_usage_get_report_details
    object: UsageReport
    action: relone_usage_get_report_details
    description: "Retrieves the row-level data inside a usage report."
    category: Operations
    risk: medium
    business_impact: "Reads the row-level contents of a usage report, which may include per-user activity metrics; the underlying data may be user-identifying."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: relativity.relone_usage_delete_report
    object: UsageReport
    action: relone_usage_delete_report
    description: "Deletes a usage report."
    category: Operations
    risk: medium
    business_impact: "Deletes a usage report; the report is regenerable from source usage data, so the loss is reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: relativity.relone_usage_get_metadata
    object: UsageReport
    action: relone_usage_get_metadata
    description: "Gets a list of metadata available within usage reports."
    category: Operations
    risk: low
    business_impact: "Reads the catalog of metadata fields available for building usage reports; configuration metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: relativity.relone_usage_list_reports
    object: UsageReport
    action: relone_usage_list_reports
    description: "Lists usage reports that exist."
    category: Operations
    risk: low
    business_impact: "Enumerates existing usage reports; operational metadata, no report contents."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: relativity.relone_usage_get_report
    object: UsageReport
    action: relone_usage_get_report
    description: "Retrieves metadata and status for a specific usage report."
    category: Operations
    risk: low
    business_impact: "Reads the status and metadata of a single usage report; no row-level report contents."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: relativity.relone_usage_wait_for_report
    object: UsageReport
    action: relone_usage_wait_for_report
    description: "Blocks until a usage report finishes generating."
    category: Operations
    risk: low
    business_impact: "Polls a usage-report job until completion; operational metadata only, no state change."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Diagnostics ----------
  - id: relativity.relone_connection_status
    object: Session
    action: relone_connection_status
    description: "Checks the RelativityOne connection and confirms which instance and identity the session is bound to."
    category: Operations
    risk: low
    business_impact: "Reports the connected instance and the authenticated identity; diagnostic read with no state change."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
