schema_version: "1.1"
platform: klaviyo
display_name: Klaviyo
source: langguard-editorial
updated: "2026-06"
reference: https://developers.klaviyo.com/en/docs/klaviyo_mcp_server
# Tool ids are the UNPREFIXED names the hosted Klaviyo MCP server
# (https://mcp.klaviyo.com/mcp) exposes, matching Klaviyo's own published tools
# reference and every public catalog observation. (The local `klaviyo-mcp-server`
# PyPI build registers tools as `klaviyo_<func>` via tool_decorator.py, but the
# hosted connector that claude.com distributes uses the unprefixed form — that is
# what an MCP client sends and what the audit must match.) Risk/PII tagging was
# cross-checked against the package source's `has_writes` and
# `handles_user_generated_content` decorator flags.
# Tools from Klaviyo's published docs that are not yet in the latest public PyPI
# build (query_metric_aggregates, the extended Template tools, and all Translation
# tools) are tagged confidence: medium pending byte-level source verification.
actions:
  # ---------- Customer ----------
  - id: klaviyo.get_profiles
    object: Profile
    action: get_profiles
    description: "List your profiles."
    category: Customer
    risk: high
    business_impact: "Bulk-reads subscriber profiles including email, phone, consent state, and behavioral attributes; mass PII access regardless of intent."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: klaviyo.get_profile
    object: Profile
    action: get_profile
    description: "Get details of a profile."
    category: Customer
    risk: medium
