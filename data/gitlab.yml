schema_version: "1.1"
platform: gitlab
display_name: GitLab
source: langguard-editorial
updated: "2026-06"
reference: https://docs.gitlab.com/user/gitlab_duo/model_context_protocol/mcp_server_tools/
actions:
  # ---------- Pipelines ----------
  - id: gitlab.manage_pipeline
    object: Pipeline
    action: manage_pipeline
    description: "Lists, creates, updates, retries, cancels, or deletes CI/CD pipelines in a GitLab project."
    category: Pipelines
    risk: high
    business_impact: "Triggers, retries, cancels, or deletes CI/CD pipelines; can start or block production deployments and a delete removes the pipeline and its related data."
    compliance: [SOX, COSO, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: gitlab.get_pipeline_jobs
    object: Job
    action: get_pipeline_jobs
    description: "Retrieves the jobs for a specific CI/CD pipeline."
    category: Pipelines
    risk: low
    business_impact: "Reads CI job metadata and status for a pipeline."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: gitlab.get_job_log
    object: Job
    action: get_job_log
    description: "Retrieves the trace (log output) for a specific CI/CD job."
    category: Pipelines
    risk: medium
    business_impact: "Reads raw CI job logs, which routinely contain secrets, tokens, environment variables, and deploy output that can leak credentials or customer data."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: gitlab.get_merge_request_pipelines
    object: Pipeline
    action: get_merge_request_pipelines
    description: "Retrieves the pipelines for a specific merge request."
    category: Pipelines
    risk: low
    business_impact: "Lists CI pipelines associated with a merge request."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  # ---------- Code & Release ----------
  - id: gitlab.create_merge_request
    object: MergeRequest
    action: create_merge_request
    description: "Creates a merge request in a GitLab project."
    category: Code & Release
    risk: medium
    business_impact: "Opens a merge request proposing a production code change; reviewable but is the entry point to shipping code."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: gitlab.get_merge_request
    object: MergeRequest
    action: get_merge_request
    description: "Retrieves detailed information about a specific merge request."
    category: Code & Release
    risk: low
    business_impact: "Reads a merge request's metadata and description."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: gitlab.get_merge_request_commits
    object: MergeRequest
    action: get_merge_request_commits
    description: "Retrieves the list of commits in a merge request."
    category: Code & Release
    risk: low
    business_impact: "Lists the commits attached to a merge request."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: gitlab.get_merge_request_diffs
    object: MergeRequest
    action: get_merge_request_diffs
    description: "Retrieves the diffs for a specific merge request."
    category: Code & Release
    risk: medium
    business_impact: "Reads code diffs, which can surface secrets, customer data, or proprietary logic embedded in source."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  # ---------- Issues ----------
  - id: gitlab.create_issue
    object: Issue
    action: create_issue
    description: "Creates a new issue in a GitLab project."
    category: Issues
    risk: low
    business_impact: "Opens a new issue in a project; reversible and individually audited."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: gitlab.get_issue
    object: Issue
    action: get_issue
    description: "Retrieves detailed information about a specific GitLab issue."
    category: Issues
    risk: low
    business_impact: "Reads a single issue's contents."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: gitlab.create_workitem_note
    object: Note
    action: create_workitem_note
    description: "Creates a new note (comment) on a GitLab work item."
    category: Issues
    risk: low
    business_impact: "Adds a comment to a work item; reversible and visible to project members."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: gitlab.get_workitem_notes
    object: Note
    action: get_workitem_notes
    description: "Retrieves all notes (comments) for a specific work item."
    category: Issues
    risk: low
    business_impact: "Reads the comments on a work item."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  # ---------- Search ----------
  - id: gitlab.search
    object: "*"
    action: search
    description: "Searches for a term across the entire GitLab instance."
    category: Search
    risk: medium
    business_impact: "Searches across the GitLab instance; can surface code, issues, and merge requests beyond the agent's intended scope."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: gitlab.semantic_code_search
    object: Code
    action: semantic_code_search
    description: "Searches for relevant code snippets in a GitLab project using semantic matching."
    category: Search
    risk: medium
    business_impact: "Aggregates code context semantically across a project and may expose secrets-in-code or proprietary IP."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: gitlab.search_labels
    object: Label
    action: search_labels
    description: "Searches for labels in a GitLab project or group."
    category: Search
    risk: low
    business_impact: "Looks up labels in a project or group."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  # ---------- Platform ----------
  - id: gitlab.get_mcp_server_version
    object: Server
    action: get_mcp_server_version
    description: "Returns the current version of the GitLab MCP server."
    category: Platform
    risk: low
    business_impact: "Returns the MCP server version string; no business data exposed."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
