# NOTE: This file covers the account-level Wix MCP server (https://mcp.wix.com/mcp,
# GitHub wix/wix-mcp) — the server the claude.com/connectors/wix connector points
# to. Wix also ships a SEPARATE per-site "Wix Site MCP" with a different tool set
# (GenerateVisitorToken, SearchSiteApiDocs, GetBusinessDetails, SearchInSite); those
# tools are intentionally NOT included here because they belong to a different MCP
# server, not this connector.
#
# CallWixSiteAPI is one generic dispatcher tool that calls any Wix REST/SDK method on
# a site. Effective blast radius for that tool is the union of the connected business
# solutions (Stores, Bookings, Forms, CRM, etc.); per-API methods invoked through it
# fall through to platform-level matching.
schema_version: "1.1"
platform: wix
display_name: Wix
source: langguard-editorial
updated: "2026-06"
reference: https://dev.wix.com/docs/sdk/articles/use-the-wix-mcp/about-the-wix-mcp
actions:
  # ---------- Data Access ----------
  - id: wix.CallWixSiteAPI
    object: "*"
    action: CallWixSiteAPI
    description: "Perform an action or query for a given account and selected site."
    category: Data Access
    risk: critical
    business_impact: "Generic dispatcher that invokes any underlying Wix site API — Stores orders, Bookings appointments, CRM contacts, Forms submissions — enabling bulk data exfiltration, payment/revenue transactions, or arbitrary writes through a single tool."
    compliance: [SOX, COSO, PCI, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Site Management ----------
  - id: wix.ManageWixSite
    object: Site
    action: ManageWixSite
    description: "Perform a site-level action, such as creating a site."
    category: Site Management
    risk: high
    business_impact: "Performs site-lifecycle actions such as creating, and potentially deleting or transferring, a site; an account-wide configuration change a single actor can make unilaterally."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: wix.ListWixSites
    object: Site
    action: ListWixSites
    description: "Query the sites for a Wix account."
    category: Site Management
    risk: low
    business_impact: "Returns the list of sites in the account; exposes account-level metadata such as site names and identifiers but no end-user data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Documentation ----------
  - id: wix.SearchWixWDSDocumentation
    object: Documentation
    action: SearchWixWDSDocumentation
    description: "Search the Wix Design System documentation."
    category: Documentation
    risk: low
    business_impact: "Searches Wix's public Design System documentation; read-only and touches no customer or site data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: wix.SearchWixRESTDocumentation
    object: Documentation
    action: SearchWixRESTDocumentation
    description: "Search the Wix REST documentation."
    category: Documentation
    risk: low
    business_impact: "Searches Wix's public REST API documentation; read-only and touches no customer or site data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: wix.SearchWixSDKDocumentation
