  - id: wix.WixBusinessFlowsDocumentation
    object: Documentation
    action: WixBusinessFlowsDocumentation
    description: "Include complete step-by-step instructions for multi-step sample flows."
    category: Documentation
    risk: low
    business_impact: "Returns step-by-step guides for multi-step Wix sample flows; read-only reference content with no customer or site data."
    compliance: []
    sod_concern: false
    confidence: high
