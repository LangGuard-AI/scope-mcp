    business_impact: "Searches Wix's public SDK documentation; read-only and touches no customer or site data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: wix.SearchBuildAppsDocumentation
    object: Documentation
    action: SearchBuildAppsDocumentation
    description: "Search the Wix Build Apps documentation."
    category: Documentation
    risk: low
    business_impact: "Searches Wix's public Build Apps platform documentation; read-only and touches no customer or site data."
    compliance: []
    sod_concern: false
    confidence: high
