actions:
  # ---------- Data Access ----------

  # source: https://api.sybill.ai/docs/mcp.html
  - id: sybill.ask_sybill
    object: "*"
    action: ask_sybill
    category: Data Access
    risk: medium
    business_impact: "Runs a natural-language AI query across sales calls, deals, people, companies, and emails, potentially surfacing personal data and confidential deal intelligence in one synthesized answer."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://api.sybill.ai/docs/mcp.html
  - id: sybill.get_ask_sybill_result
    object: AskSybillRun
    action: get_ask_sybill_result
    category: Data Access
    risk: low
    business_impact: "Retrieves the status and final answer for a previously submitted Sybill query by run id, returning whatever content that query surfaced."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Conversation Intelligence ----------

  # source: https://api.sybill.ai/docs/mcp.html
  - id: sybill.get_conversation
    object: Conversation
    action: get_conversation
    category: Conversation Intelligence
    risk: medium
    business_impact: "Returns the full transcript, recording URLs, summary, and participant list for a recorded sales call, exposing private conversation content and identifiable personal data."
