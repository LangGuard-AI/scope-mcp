schema_version: "1.2"
platform: rillet
display_name: Rillet
source: langguard-editorial
updated: "2026-06"
server_version: "2026-06"
reference: https://docs.api.rillet.com/docs/mcp
# Tool ids are the operationId values from Rillet's published OpenAPI spec
# (https://docs.api.rillet.com/openapi/rillet-accounting-api.json). The MCP docs
# state the server "offers tools that implement the same features exposed by
# Rillet Public API"; the spec carries no x-mcp-tool-name overrides, so the
# documented default (operationId -> tool name) governs. The live MCP endpoint
# (https://api.rillet.com/mcp) is OAuth2-gated, so the exact tool-name string
# could not be confirmed via tools/list — every entry is confidence: medium.
actions:
  # ---------- Financial ----------
  - id: rillet.create-a-journal-entry
    object: JournalEntry
    action: create-a-journal-entry
    description: "Creates a journal entry."
    category: Financial
    risk: critical
    business_impact: "Posts a debit/credit pair to the general ledger; directly affects financial statements and is in scope for SOX ITGCs."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: rillet.update-a-journal-entry
    object: JournalEntry
    action: update-a-journal-entry
    description: "Updates a journal entry."
    category: Financial
    risk: critical
    business_impact: "Alters a posted general-ledger entry; changes financial-statement figures and is a SOX-controlled change."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: rillet.delete-a-journal-entry
    object: JournalEntry
    action: delete-a-journal-entry
    description: "Deletes a journal entry."
    category: Financial
    risk: critical
    business_impact: "Removes a general-ledger entry; single-actor reversal of a financial-statement posting that bypasses two-person GL controls."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: rillet.create-a-charge
    object: Charge
    action: create-a-charge
    description: "Create a charge."
    category: Financial
    risk: critical
    business_impact: "Initiates a payment charge; a money-movement and revenue event that may involve cardholder data."
    compliance: [SOX, COSO, PCI, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: rillet.delete-a-charge
    object: Charge
    action: delete-a-charge
    description: "Deletes a charge."
    category: Financial
    risk: critical
    business_impact: "Removes a recorded charge; single-actor reversal of a money-movement record affecting the GL and reconciliation."
    compliance: [SOX, COSO, PCI, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: rillet.setup-auto-payment
    object: PaymentMethod
    action: setup-auto-payment
    description: "Sets up auto-payment for a customer."
    category: Financial
    risk: high
    business_impact: "Configures recurring automatic payment collection against a customer; standing money-movement authorization that may touch payment-instrument data."
    compliance: [SOX, COSO, PCI, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

