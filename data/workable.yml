  # source: https://workable.readme.io/reference/workable-mcp-server
  - id: workable.update_member
    object: Member
    action: update_member
    description: "Update an existing member's roles, permission sets, or access scope"
    category: Identity & Access
    risk: high
    business_impact: "Changes a member's roles, permission sets, or job access scope, widening what recruiting and employee data that principal can read without an access review."
