  - id: asana-api.delete_task
    object: Task
    action: delete_task
    category: Issues
    risk: high
    business_impact: "Permanently deletes a task and all of its subtasks; the manifest states this cannot be undone, so a single caller destroys work irreversibly."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

