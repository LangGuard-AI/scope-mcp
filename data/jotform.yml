  # source: https://www.jotform.com/mcp/
  - id: jotform.get_submissions
    object: Submission
    action: get_submissions
    description: "Retrieve and filter form responses"
    category: Data Access
    risk: high
    business_impact: "Retrieves and filters form responses in bulk, exposing respondent-supplied personal data such as names, emails, and addresses captured by a form."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://www.jotform.com/mcp/
  - id: jotform.create_submission
    object: Submission
    action: create_submission
    description: "Make a submission to an existing form"
    category: Data Access
    risk: medium
    business_impact: "Writes a new submission into an existing form, inserting respondent-supplied personal data into the account's stored records."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

