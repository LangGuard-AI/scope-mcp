  - id: microsoft-onedrive.shareFileOrFolderInMyOnedrive
    object: DriveItem
    action: shareFileOrFolderInMyOnedrive
    category: Identity & Access
    risk: high
    business_impact: "Grants read or write access on a file or folder via a sharing invitation, a direct path to expose OneDrive content and any personal data it holds beyond its original audience."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

