actions:
  # ---------- Identity & Access ----------

  # source: https://raw.githubusercontent.com/zoom/zoom-plugin/main/skills/zoom-mcp/team-chat/references/tools.md
  - id: zoom.zoom_chat_channel_member_role_update
    object: ChannelMember
    action: zoom_chat_channel_member_role_update
    description: "Update a Team Chat channel member's role (for example promote a member to channel admin)."
    category: Identity & Access
    risk: high
    business_impact: "Promotes or demotes a channel member, handing one principal administrative control over a channel's membership and settings without an access review."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://raw.githubusercontent.com/zoom/zoom-plugin/main/skills/zoom-mcp/team-chat/references/tools.md
  - id: zoom.zoom_chat_channel_members_add
    object: ChannelMember
    action: zoom_chat_channel_members_add
    description: "Add users to an existing Team Chat channel."
    category: Identity & Access
    risk: high
    business_impact: "Adds people to a channel, exposing its entire message and file history to the new members the moment they join."
    compliance: [SOC2, ISO_27001, GDPR, UK_GDPR, CCPA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://raw.githubusercontent.com/zoom/zoom-plugin/main/skills/zoom-mcp/references/servers.md
  - id: zoom.canvas_transfer_file_ownership
    object: Document
    action: canvas_transfer_file_ownership
    description: "Transfer ownership of a Zoom Docs / Canvas file to another user."
    category: Identity & Access
    risk: high
    business_impact: "Moves a document to a new owner, stripping the original owner of control and handing the recipient full rights over its contents and sharing."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://raw.githubusercontent.com/zoom/zoom-plugin/main/skills/zoom-mcp/references/servers.md
  - id: zoom.canvas_modify_file_general_access_setting
    object: Document
    action: canvas_modify_file_general_access_setting
    description: "Change the general access setting of a Zoom Docs / Canvas file, such as who in the account can open it."
    category: Identity & Access
    risk: high
    business_impact: "Widens or narrows who can reach a document — a single call can turn an internal-only file into one every account member reads."
    compliance: [SOC2, ISO_27001, GDPR, UK_GDPR, CCPA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://raw.githubusercontent.com/zoom/zoom-plugin/main/skills/zoom-mcp/references/servers.md
  - id: zoom.canvas_add_file_collaborators
    object: Document
    action: canvas_add_file_collaborators
    description: "Add collaborators to a Zoom Docs / Canvas file."
    category: Identity & Access
    risk: high
    business_impact: "Grants named users access to a document's full contents and revision history, bypassing whatever sharing review the owner would normally apply."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://raw.githubusercontent.com/zoom/zoom-plugin/main/skills/zoom-mcp/references/servers.md
  - id: zoom.canvas_modify_file_collaborator_role
    object: Document
    action: canvas_modify_file_collaborator_role
    description: "Change an existing collaborator's role on a Zoom Docs / Canvas file."
    category: Identity & Access
    risk: high
    business_impact: "Escalates a viewer to an editor (or the reverse) on a document, changing who can rewrite or reshare its content."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

