    risk: medium
    business_impact: "Pulls the actual recorded audio, video, and transcript of a meeting, which routinely captures faces, voices, and whatever confidential or clinical matter was discussed."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, HIPAA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

