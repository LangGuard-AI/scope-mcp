actions:
  # ---------- Destructive Deletes (capability-form) ----------
  # The Outreach MCP Server gates create/delete writes behind an admin toggle
  # ("create (ON by default) and delete (OFF by default) actions over MCP") and
  # the May 2026 release notes describe the destructive surface in plain prose:
  # "Agents can now create and delete accounts, opportunities, and prospects, as
  # well as add or remove prospects from sequences." The vendor publishes NO
  # verbatim tool identifier for any delete/remove operation, so these four
  # entries use id_form: capability (confidence capped at medium) rather than
  # fabricated verbatim ids. The 27 verbatim tools below are unchanged.
  - id: outreach.prospect_delete
    object: Prospect
    action: prospect_delete
    id_form: capability
    description: "Delete a prospect"
    reference: https://support.outreach.io/support/solutions/articles/159000431194-outreach-product-release-notes-may-2026
    category: Revenue & Pipeline
    risk: critical
    business_impact: "Irreversibly destroys a prospect/contact record and its associated personal data; single-actor deletion with no documented recovery, off by default and gated by an admin toggle."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: outreach.account_delete
    object: Account
    action: account_delete
    id_form: capability
    description: "Delete an account"
    reference: https://support.outreach.io/support/solutions/articles/159000431194-outreach-product-release-notes-may-2026
    category: Customer
    risk: critical
    business_impact: "Irreversibly destroys a company account record along with its associated contact and owner identities; single-actor deletion with no documented recovery, off by default and gated by an admin toggle."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: outreach.opportunity_delete
    object: Opportunity
    action: opportunity_delete
    id_form: capability
    description: "Delete an opportunity"
    reference: https://support.outreach.io/support/solutions/articles/159000431194-outreach-product-release-notes-may-2026
    category: Revenue & Pipeline
    risk: critical
    business_impact: "Irreversibly destroys a deal/opportunity record and its pipeline history; single-actor deletion with no documented recovery, off by default and gated by an admin toggle."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: outreach.sequence_remove_prospects
    object: Sequence
    action: sequence_remove_prospects
    id_form: capability
    description: "Remove prospects from sequences"
    reference: https://support.outreach.io/support/solutions/articles/159000431194-outreach-product-release-notes-may-2026
    category: Revenue & Pipeline
    risk: medium
    business_impact: "Unenrolls prospects from an automated outreach sequence, halting their in-flight steps; reversible by re-adding them, and the counterpart to sequence_add_prospects."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

