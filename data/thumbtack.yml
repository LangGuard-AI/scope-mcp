  # source: https://docs.google.com/document/d/1RmGske5ktjAi9d7Ayok_yOv3a6Z2RDBSxIlX7aC5OEM/edit?usp=sharing
  - id: thumbtack.search_home_service_pros
    object: ProSearch
    action: search_home_service_pros
    description: "A unified tool that discovers service categories, fetches the request form, and searches for professionals — all in a single call."
    category: Service
    risk: low
    business_impact: "Sends the user's free-text project description and ZIP code to Thumbtack's marketplace and opens a search record that persists for seven days, disclosing household location and intent to a third party."
    compliance: [CCPA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.google.com/document/d/1RmGske5ktjAi9d7Ayok_yOv3a6Z2RDBSxIlX7aC5OEM/edit?usp=sharing
  - id: thumbtack.filter_home_service_pros
    object: ProSearch
    action: filter_home_service_pros
    description: "A follow-up mechanism for refining results using answers to clarifying questions."
    category: Service
    risk: medium
    business_impact: "Submits the completed request form to Thumbtack, updating the existing search or creating a new one, so agent-generated answers about the job and property become marketplace state."
    compliance: [CCPA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

