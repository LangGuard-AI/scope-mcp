  - id: thumbtack.get_reviews_for_pros
    object: Review
    action: get_reviews_for_pros
    description: "Retrieves customer reviews for professionals with flexible sorting options."
    category: Data Access
    risk: low
    business_impact: "Pulls up to 20 published reviews per business, which the agent may summarize into hiring recommendations that misrepresent a pro's overall rating if sorted selectively."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.google.com/document/d/1RmGske5ktjAi9d7Ayok_yOv3a6Z2RDBSxIlX7aC5OEM/edit?usp=sharing
  - id: thumbtack.get_category_recommendations
    object: Category
    action: get_category_recommendations
    description: "Returns home service recommendations sorted by popularity or trending status for a given location."
    category: Data Access
    risk: low
    business_impact: "Returns aggregate popular or trending service categories for a ZIP code; read-only marketplace metadata with no customer records involved."
    compliance: []
