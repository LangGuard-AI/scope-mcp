maintainer: https://github.com/XeroAPI/xero-mcp-server/issues
# Curated from the 51-tool Xero MCP server surface. Routine reference and
# lookup reads (accounts, items, tax rates, tracking categories, contact
# groups, quotes, org details, aged reports) and low-impact catalogue writes
# (items, quotes, tracking categories/options) are omitted; the manifest at
# _sources/xero-api/tools.json remains the complete tool inventory.
actions:
  # ---------- Financial ----------

  # source: https://github.com/XeroAPI/xero-mcp-server
  - id: xero-api.create-payment
    object: Payment
    action: create-payment
    description: "Create a new payment"
    category: Financial
    risk: critical
    business_impact: "Records a payment against an invoice or bill, settling a receivable or payable and moving cash balances in the general ledger."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://github.com/XeroAPI/xero-mcp-server
  - id: xero-api.create-manual-journal
    object: ManualJournal
    action: create-manual-journal
    description: "Create a new manual journal"
    category: Financial
    risk: critical
    business_impact: "Posts a journal entry directly to the general ledger, changing reported account balances without any originating source document."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://github.com/XeroAPI/xero-mcp-server
  - id: xero-api.update-manual-journal
    object: ManualJournal
    action: update-manual-journal
    description: "Update an existing manual journal"
    category: Financial
    risk: critical
    business_impact: "Rewrites an existing general-ledger journal entry, altering posted balances and the audit trail auditors rely on to trace period-end adjustments."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

