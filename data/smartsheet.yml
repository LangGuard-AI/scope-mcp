actions:
  # ---------- Sheet Data ----------
  - id: smartsheet.add_rows
    object: Row
    action: add_rows
    description: "Adds one or more new rows to a sheet with optional positioning control."
    category: Sheet Data
    risk: low
    business_impact: "Adds rows to a sheet; reversible and individually attributed, though the inserted cell values may contain personal data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: smartsheet.update_rows
    object: Row
    action: update_rows
    description: "Modifies existing row data in a sheet including cell values and row positioning."
    category: Sheet Data
    risk: medium
    business_impact: "Overwrites existing cell values across one or more rows; can mutate business-critical or PII-bearing data in place."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: smartsheet.delete_rows
    object: Row
    action: delete_rows
    description: "Permanently removes one or more rows from a sheet."
    category: Sheet Data
    risk: high
    business_impact: "Permanently deletes one or more rows with no soft-delete; bulk-capable irreversible loss of potentially PII-bearing records."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: smartsheet.get_sheet_summary
    object: Sheet
    action: get_sheet_summary
    description: "Retrieves sheet data with optional filtering, sorting, and column selection capabilities."
    category: Sheet Data
    risk: medium
    business_impact: "Returns sheet cell data in bulk; can surface PII or confidential business data held in rows."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: smartsheet.find_in_sheet
    object: Sheet
    action: find_in_sheet
    description: "Searches for text within a specific sheet, returning matching cells with location details."
    category: Sheet Data
    risk: medium
    business_impact: "Returns matching cell contents from within a sheet; can surface PII or confidential values via targeted search."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: smartsheet.get_cell_history
    object: Cell
    action: get_cell_history
    description: "Retrieves the complete modification history for a specific cell with timestamps and attribution."
    category: Sheet Data
    risk: medium
    business_impact: "Returns the full change history of a cell with prior values, timestamps, and the identity of each editor."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: smartsheet.get_sheet_version
    object: Sheet
    action: get_sheet_version
    description: "Returns the current version number of a sheet for change detection purposes."
    category: Sheet Data
    risk: low
    business_impact: "Returns a sheet's version number for change detection; exposes no row content."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

