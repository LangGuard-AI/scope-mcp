schema_version: "1.3"
platform: ashby-api
display_name: Ashby
logo: https://www.ashbyhq.com/favicon.png
source: langguard-editorial
updated: "2026-07"
server_website: https://docs.ashbyhq.com/ashby-mcp-server-beta
reference: https://docs.ashbyhq.com/ashby-mcp-server-beta
# The Ashby MCP server (https://mcp.ashbyhq.com/mcp/v1) gates tools/list behind a
# per-user OAuth flow, so the server only returns data the authenticated user can
# already see in Ashby. Ashby's vendor docs publish the tool surface only as
# plain-language capability labels — verbatim MCP identifiers are not available.
# Per the rubric's id_form: capability path, every entry below carries a slugified
# action and the verbatim label in `description`. Refresh to `id_form: verbatim`
# when a real tools/list capture becomes available.
actions:
  # ---------- Data Access ----------

  # source: https://docs.ashbyhq.com/ashby-mcp-server-beta
  - id: ashby-api.filter_records
    object: Record
    action: filter_records
    id_form: capability
    description: "filter records"
    category: Data Access
    risk: high
    business_impact: "Runs criteria-based queries across candidates, applications, and jobs, returning matching records in bulk — an exfiltration path for candidate PII at scale."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://docs.ashbyhq.com/ashby-mcp-server-beta
  - id: ashby-api.search_records_by_name
    object: Record
    action: search_records_by_name
    id_form: capability
    description: "search records by name"
    category: Data Access
    risk: medium
    business_impact: "Locates candidates, jobs, applications, and email templates by name, surfacing identifying candidate details to the caller."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://docs.ashbyhq.com/ashby-mcp-server-beta
  - id: ashby-api.get_record_details
    object: Record
    action: get_record_details
    id_form: capability
    description: "get record details"
    category: Data Access
    risk: medium
    business_impact: "Retrieves full information for a job, application, or offer, including offer compensation terms and applicant details."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://docs.ashbyhq.com/ashby-mcp-server-beta
  - id: ashby-api.describe_object_fields
    object: Schema
    action: describe_object_fields
    id_form: capability
    description: "describe object fields"
    category: Data Access
    risk: low
    business_impact: "Returns the filterable field metadata for an object type as a backend helper; exposes schema shape, not record data."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

