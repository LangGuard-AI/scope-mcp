  # ---------- Data Access ----------

  # source: https://docs.customer.io/ai/mcp/get-started/
  - id: customer-io.cio_delete_api
    object: "*"
    action: cio_delete_api
    category: Data Access
    risk: critical
    business_impact: "Issues authenticated DELETE requests against any Customer.io resource, irreversibly removing customer profiles, campaigns, or segments in a single call."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.customer.io/ai/mcp/get-started/
  - id: customer-io.cio_read_api
    object: "*"
    action: cio_read_api
    category: Data Access
    risk: high
    business_impact: "Issues authenticated GET requests across the Customer.io API, able to list and page through customer profiles and behavioral data — a broad read path to PII."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.customer.io/ai/mcp/get-started/
  - id: customer-io.cio_write_api
    object: "*"
    action: cio_write_api
    category: Data Access
    risk: high
    business_impact: "Issues authenticated POST, PUT, and PATCH requests, creating or editing any Customer.io resource including customer profiles and campaign configuration."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

