  - id: braze.get_custom_attributes
    object: CustomAttribute
    action: get_custom_attributes
    description: "Export custom attributes recorded for your app."
    category: Customer
    risk: medium
    business_impact: "Exports the custom-attribute schema recorded for the app; attribute names can reveal what personal data is tracked, though no per-user values are returned."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

