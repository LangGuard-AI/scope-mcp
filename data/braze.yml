schema_version: "1.1"
platform: braze
display_name: Braze
source: langguard-editorial
updated: "2026-06"
reference: https://www.braze.com/docs/user_guide/brazeai/mcp_server/available_api_functions
actions:
  # ---------- Platform & DevOps ----------
  # The Braze MCP server exposes three core dispatch tools. Named "API functions"
  # (below) are invoked THROUGH these. call_write_function is the single gateway
  # for every state-changing operation, so it carries the aggregate write risk.
  - id: braze.call_write_function
    object: '*'
    action: call_write_function
    description: "Calls a write-capable Braze API function (create/update) with provided parameters."
    category: Platform & DevOps
    risk: medium
    business_impact: "Single dispatch gateway for every write function; executes content, template, and asset mutations against the live Braze workspace."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: braze.call_function
    object: '*'
    action: call_function
    description: "Calls a specific read-only Braze API function with provided parameters."
    category: Platform & DevOps
    risk: low
    business_impact: "Dispatch gateway for read-only analytics and metadata functions; returns aggregate, non-profile data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: braze.list_functions
    object: '*'
    action: list_functions
    description: "Lists all available Braze API functions with their descriptions and parameters."
    category: Platform & DevOps
    risk: low
    business_impact: "Enumerates the server's callable functions; discovery only, no workspace data returned."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Content & Templates (write surface) ----------
  - id: braze.create_content_block
    object: ContentBlock
    action: create_content_block
    description: "Create a content block; requires name and content."
    category: Content & Templates
    risk: medium
    business_impact: "Adds a reusable content block injected into live customer messaging; reversible but affects production sends."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: braze.update_content_block
    object: ContentBlock
    action: update_content_block
    description: "Update an existing content block by content_block_id."
    category: Content & Templates
    risk: medium
    business_impact: "Modifies a content block already embedded across campaigns and Canvases; changes propagate to every message referencing it."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: braze.create_email_template
    object: EmailTemplate
    action: create_email_template
    description: "Create an email template; requires template_name, subject, and body."
    category: Content & Templates
    risk: medium
    business_impact: "Adds an email template available for production campaigns; reversible but enters the live messaging surface."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: braze.update_email_template
    object: EmailTemplate
    action: update_email_template
    description: "Update an existing email template by email_template_id."
    category: Content & Templates
    risk: medium
    business_impact: "Alters email content used by active campaigns; changes reach every send that references the template."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: braze.create_media_library_asset
    object: MediaAsset
    action: create_media_library_asset
    description: "Upload an asset (public URL or base64 file) to the Braze media library; 5 MB image limit."
    category: Content & Templates
    risk: medium
    business_impact: "Uploads an externally-sourced asset into the media library for use in live messaging; can fetch from an arbitrary public URL."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Identity & Access ----------
  - id: braze.get_sdk_authentication_keys
    object: SdkAuthenticationKey
    action: get_sdk_authentication_keys
    description: "List all SDK Authentication keys for your app."
    category: Identity & Access
    risk: high
    business_impact: "Exposes SDK authentication key metadata; disclosure of credential material weakens client-side authentication controls."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Customer ----------
  # Subscription/consent state is tied to identifiable users; preference-center
  # and subscription functions touch personal data and messaging-consent records.
  - id: braze.get_user_subscription_groups
    object: SubscriptionGroup
    action: get_user_subscription_groups
    description: "List and get the subscription groups of a certain user."
    category: Customer
    risk: medium
    business_impact: "Returns a specific user's subscription-group memberships; reveals personal messaging-consent state for an identifiable individual."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: braze.get_subscription_group_status
    object: SubscriptionGroup
    action: get_subscription_group_status
    description: "Get the subscription state of a user in a subscription group."
