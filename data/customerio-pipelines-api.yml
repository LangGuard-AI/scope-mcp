  # ---------- Data Access ----------

  # source: https://docs.customer.io/ai/mcp/get-started/
  - id: customerio-pipelines-api.cio_delete_api
    object: "*"
    action: cio_delete_api
    category: Data Access
    risk: critical
    business_impact: "Executes arbitrary authenticated DELETE requests, irreversibly removing customer profiles, segments, or any other resource the token can reach."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.customer.io/ai/mcp/get-started/
  - id: customerio-pipelines-api.cio_read_api
    object: "*"
    action: cio_read_api
    category: Data Access
    risk: high
    business_impact: "Executes arbitrary authenticated GET requests, exposing any customer profile, segment, or behavioral record the token can reach, including at list scale."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.customer.io/ai/mcp/get-started/
  - id: customerio-pipelines-api.cio_write_api
    object: "*"
    action: cio_write_api
    category: Data Access
    risk: high
    business_impact: "Executes arbitrary authenticated POST, PUT, and PATCH requests, creating or overwriting customer profiles and other resources including personal data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

