  # source: https://raw.githubusercontent.com/netlify/netlify-mcp/main/src/tools/deploy-tools/deploy-site.ts
  - id: netlify.deploy-site
    object: Deploy
    action: deploy-site
    description: "Build and deploy a project to Netlify (remote build-and-deploy operation, upload path)."
    category: Code & Release
    risk: high
    business_impact: "Builds and publishes code to a live Netlify site in one call, putting unreviewed changes in front of real traffic without passing through any human release gate."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    source: langguard-editorial
    access_methods: [REST, MCP, CLI]

  # source: https://raw.githubusercontent.com/netlify/netlify-mcp/main/src/tools/design-import/import-claude-design.ts
  - id: netlify.import-claude-design-from-url
    object: Deploy
    action: import-claude-design-from-url
    description: "Deploys a self-contained HTML design bundle from a signed URL to a new or existing Netlify site."
    category: Code & Release
    risk: high
    business_impact: "Publishes an externally fetched HTML bundle to a Netlify site; when an existing site is targeted the imported content replaces what visitors currently see."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    source: langguard-editorial
    access_methods: [MCP]

  # source: https://raw.githubusercontent.com/netlify/netlify-mcp/main/src/tools/design-import/import-claude-design.ts
  - id: netlify.get-design-import-job-status
