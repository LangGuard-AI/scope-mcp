    access_methods: [REST, MCP, CLI]

  # source: https://raw.githubusercontent.com/netlify/netlify-mcp/main/src/tools/deploy-tools/get-deploy-for-site.ts
  - id: netlify.get-deploy-for-site
    object: Deploy
