actions:
  # ---------- Secrets & Workflows ----------

  # source: https://raw.githubusercontent.com/netlify/netlify-mcp/main/src/tools/project-tools/manage-project-env-vars.ts
  - id: netlify.manage-env-vars
    object: EnvironmentVariable
    action: manage-env-vars
    description: "Get, create/update, or delete environment variables for a site."
    category: Secrets & Workflows
    risk: critical
    business_impact: "Reads out and rewrites a site's environment variables, which routinely hold API keys, database URLs and third-party credentials for the running production build."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    source: langguard-editorial
    access_methods: [REST, MCP, CLI]

  # ---------- Identity & Access ----------

  # source: https://raw.githubusercontent.com/netlify/netlify-mcp/main/src/tools/project-tools/update-visitor-access-controls.ts
  - id: netlify.update-visitor-access-controls
    object: Project
    action: update-visitor-access-controls
    description: "Update a site's visitor access controls (password protection or SSO team login requirement)."
    category: Identity & Access
    risk: high
    business_impact: "Changes who can view a deployed site; removing password protection or the SSO team-login requirement exposes a previously gated site to the open internet."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    source: langguard-editorial
    access_methods: [REST, MCP]

  # source: https://raw.githubusercontent.com/netlify/netlify-mcp/main/src/tools/user-tools/get-user.ts
  - id: netlify.get-user
    object: User
    action: get-user
    description: "Fetch the authenticated Netlify user's account details."
    category: Identity & Access
    risk: low
    business_impact: "Returns the calling user's own Netlify account profile, including name, email and account identifiers."
    compliance: []
    sod_concern: false
    confidence: medium
    source: langguard-editorial
    access_methods: [REST, MCP, CLI]

  # ---------- Data Access ----------

  # source: https://raw.githubusercontent.com/netlify/netlify-mcp/main/src/tools/project-tools/manage-form-submissions.ts
  - id: netlify.manage-form-submissions
    object: FormSubmission
    action: manage-form-submissions
    description: "Get or delete form submissions for a site or form."
    category: Data Access
    risk: critical
    business_impact: "Reads every visitor-submitted form record for a site — names, emails, free-text messages — and can permanently delete those submissions with no undo path."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    source: langguard-editorial
    access_methods: [REST, MCP]

  # source: https://raw.githubusercontent.com/netlify/netlify-mcp/main/src/tools/project-tools/update-project-forms.ts
  - id: netlify.update-forms
    object: Project
    action: update-forms
    description: "Enable or disable HTML form processing for a project."
    category: Data Access
    risk: medium
    business_impact: "Turns form capture on or off for a site; disabling it silently drops incoming lead and contact submissions, enabling it starts collecting visitor-supplied personal data."
    compliance: []
    sod_concern: false
    confidence: medium
    source: langguard-editorial
    access_methods: [REST, MCP]

  # source: https://raw.githubusercontent.com/netlify/netlify-mcp/main/src/tools/project-tools/get-forms-for-project.ts
  - id: netlify.get-forms-for-project
    object: Form
    action: get-forms-for-project
    description: "List the forms configured for a project."
    category: Data Access
    risk: low
    business_impact: "Lists the form definitions configured on a site along with their submission counts."
    compliance: []
    sod_concern: false
    confidence: medium
    source: langguard-editorial
    access_methods: [REST, MCP]

