schema_version: "1.3"
platform: netlify
display_name: Netlify
logo: https://www.netlify.com/favicon/favicon.ico
source: langguard-editorial
updated: "2026-08"
mcp_server_url: https://netlify-mcp.netlify.app/mcp
reference: https://docs.netlify.com/build/build-with-ai/netlify-mcp-server/
