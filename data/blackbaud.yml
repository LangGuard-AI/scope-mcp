  - id: blackbaud.get_event_details
    object: Event
    action: get_event_details
    description: "Retrieves event details such as dates, locations, and funds raised."
    category: Operations
    risk: low
    business_impact: "Surfaces fundraising event logistics and totals raised; aggregate program data with no individual donor identifiers attached."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/blackbaud
  - id: blackbaud.search_for_event_by_name
    object: Event
    action: search_for_event_by_name
    description: "Searches fundraising events by name or keyword."
    category: Operations
    risk: low
    business_impact: "Lists fundraising events matching a keyword; read-only lookup over non-personal program metadata."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Messaging ----------

  # source: https://claude.com/connectors/blackbaud
  - id: blackbaud.generate_content
    object: Content
    action: generate_content
    description: "Drafts personalized content such as thank-you notes and donor outreach referencing specific gifts."
    category: Messaging
    risk: low
    business_impact: "Drafts donor-facing copy that quotes specific gift amounts and donor details, so an unreviewed draft can restate confidential giving data in outbound communications."
    compliance: []
    sod_concern: false
