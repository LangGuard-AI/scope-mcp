actions:
  # ---------- Financial ----------

  # source: https://claude.com/connectors/blackbaud
  - id: blackbaud.get_gift_details
    object: Gift
    action: get_gift_details
    description: "Views donation amounts, dates, donors, and associated campaigns."
    category: Financial
    risk: medium
    business_impact: "Exposes an individual donation record linking a named donor to an amount, date, and campaign — donor giving detail that nonprofits treat as confidential."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Customer ----------

  # source: https://claude.com/connectors/blackbaud
  - id: blackbaud.get_constituent_details
    object: Constituent
    action: get_constituent_details
    description: "Retrieves detailed constituent/donor records including contact information, affiliations, and giving history."
    category: Customer
    risk: medium
    business_impact: "Pulls a full donor profile — contact details, affiliations, and lifetime giving history — into agent context, where it can be summarized or forwarded outside the CRM."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/blackbaud
  - id: blackbaud.search_for_constituent_by_name
    object: Constituent
    action: search_for_constituent_by_name
    description: "Searches donors/constituents by full or partial name across the Blackbaud database."
    category: Customer
    risk: low
    business_impact: "Returns matching donor identities from a partial name, letting an agent confirm whether a given individual exists in the organization's donor file."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Operations ----------

