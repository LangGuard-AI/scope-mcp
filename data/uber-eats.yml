# Capability-form fallback. Uber's official, first-party "Uber Eats" connector
# (made by Uber, listed at claude.com/connectors/uber-eats) gates its MCP server
# behind OAuth and an edge/WAF layer (every path under mcp.uber.com returns a
# blanket 403 "access denied"), so tools/list could not be introspected. Uber
# publishes NO developer MCP tools reference for Eats (developer.uber.com/docs/
# eats/mcp is a 404; the connector page's "Documentation" link points only at the
# www.ubereats.com consumer storefront). The only action-level labels reachable
# are the marketing capability taglines on the connector page, used verbatim in
# `description` below. The community `ubereats_*` GitHub/Apify servers are a
# DIFFERENT, third-party, browser-automation server and were deliberately NOT
# used as a source. Only the published read/browse surface is represented here;
# the connector's "Interactive" ordering/cart/checkout surface has no published
# action-level label and is intentionally omitted rather than fabricated.
reference: https://claude.com/connectors/uber-eats
