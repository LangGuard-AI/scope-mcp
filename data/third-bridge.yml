schema_version: "1.1"
platform: third-bridge
display_name: Third Bridge
source: langguard-editorial
updated: "2026-06"
# Third Bridge's MCP connector is served by the Aiera MCP server (mcp-pub.aiera.com).
# Tool ids are verbatim from the open-source aiera-inc/aiera-mcp TOOL_REGISTRY and are
# corroborated by the vendor tools reference below. Classifications are kept in parity
# with the sibling aiera.yml because these are byte-for-byte the same tool calls.
# The entire surface is read-only data retrieval (no create/update/delete/send/pay).
# The dominant real-world concern is MNPI / insider-trading exposure and the IP-licensing
# terms on Third Bridge expert content — neither maps to a canonical regime code, so it is
# captured in business_impact prose only, never in compliance.
reference: https://rest.aiera.com/docs/mcp-tools
actions:
  # ---------- Third Bridge ----------
  - id: third-bridge.find_third_bridge_events
    object: ThirdBridgeEvent
    action: find_third_bridge_events
    description: "Retrieves expert-insight events from Third Bridge."
    category: Data Access
    risk: low
    business_impact: "Searches Third Bridge expert-network event metadata; licensed third-party content governed by the customer's Third Bridge agreement, no personal data on data subjects."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: third-bridge.get_third_bridge_event
    object: ThirdBridgeEvent
    action: get_third_bridge_event
    description: "Retrieves detail and transcript for a specific Third Bridge event."
    category: Data Access
    risk: low
    business_impact: "Reads one Third Bridge expert-interview transcript; licensed research content whose use is bound by Third Bridge's IP and MNPI-handling terms, no personal data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: third-bridge.search_thirdbridge
    object: ThirdBridgeEvent
    action: search_thirdbridge
    description: "Performs semantic search within Third Bridge expert-interview transcripts."
    category: Data Access
    risk: low
    business_impact: "Semantic search over Third Bridge expert transcripts; licensed third-party content subject to IP and MNPI-handling terms, no personal data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

