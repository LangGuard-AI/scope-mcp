  # ---------- Operations ----------
  - id: retool.retool_delete_workflow
    object: Workflow
    action: retool_delete_workflow
    description: "Delete a workflow by workflow ID."
    category: Operations
    risk: high
    business_impact: "Permanently removes an automation workflow; unilateral destruction of operational logic that other systems may depend on."
