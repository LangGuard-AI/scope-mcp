schema_version: "1.2"
platform: retool
display_name: Retool
source: langguard-editorial
updated: "2026-06"
server_version: "2026-06"
server_website: https://docs.retool.com/education/labs/resources/mcp
maintainer: https://community.retool.com/t/welcome-to-the-retool-community/7
reference: https://docs.retool.com/org-users/reference/mcp-tools
# ---------------------------------------------------------------------------
# PROVENANCE / id_form NOTE
# Source: vendor_mcp_docs. Retool publishes a complete, verbatim tool table at
# https://docs.retool.com/org-users/reference/mcp-tools (Tool | Required Scope
# | Description). The full table is present in the page's static HTML — a
# single self-closing <table> of exactly 34 rows immediately followed by the
# page footer, with no truncation, no JS-loaded tail, and no separate
# "additional / beta / insiders" section. A WebFetch summarizer reported "40
# tools total", but the raw HTML contains no such count and exactly 34 unique
# `retool_*` tool ids; the 34 figure is ground truth and the phantom 6 do not
# exist. The hosted MCP server is per-instance (https://<instance>/mcp) and
# OAuth-gated, so live tools/list introspection was not possible without a real
# Retool instance + token; the static doc table is the authoritative source.
# All 34 tools written verbatim (id_form: verbatim, default). Required-scope
# annotations (mcp:read / mcp:write / mcp:admin) informed but did not mechanically
# set risk — e.g. retool_execute_resource_ts is mcp:write yet classified critical
# (arbitrary TypeScript against connected production resources).
# ---------------------------------------------------------------------------
actions:
  # ---------- Data Access ----------
  - id: retool.retool_execute_resource_ts
    object: Resource
    action: retool_execute_resource_ts
    description: "Execute a TypeScript snippet against selected resources using the bindings from retool_get_resource_ts_definitions."
    category: Data Access
    risk: critical
    business_impact: "Runs arbitrary TypeScript against connected production resources (databases, APIs, storage); enables unilateral data reads, writes, and bulk exfiltration with no review gate."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: retool.retool_get_resource
    object: Resource
    action: retool_get_resource
    description: "Get metadata for one resource by name; for resource details, not for querying the underlying data."
    category: Data Access
    risk: medium
    business_impact: "Reads connection metadata for one resource (type, host, configuration), which can reveal backend topology and credential field names."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: retool.retool_list_resources
    object: Resource
    action: retool_list_resources
    description: "List resources available in the organization, including databases, APIs, storage, and AI providers."
    category: Data Access
    risk: medium
    business_impact: "Enumerates every connected backend resource in the organization, exposing the full data-integration topology."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: retool.retool_get_resource_ts_definitions
    object: Resource
    action: retool_get_resource_ts_definitions
    description: "Generate global variable bindings and TypeScript definitions for selected resources; required before retool_execute_resource_ts."
    category: Data Access
    risk: low
    business_impact: "Generates read-only TypeScript bindings for selected resources; a prerequisite step that exposes no resource data itself."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: retool.retool_create_resource
    object: Resource
    action: retool_create_resource
    description: "Create a new resource; provide the resource type plus optional connection fields, then finish configuration in the returned URL."
    category: Data Access
    risk: high
    business_impact: "Provisions a new backend connection (database, API, storage, or AI provider), potentially storing credentials and widening the data-access surface."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Identity & Access ----------
  - id: retool.retool_create_user_invite
    object: UserInvite
    action: retool_create_user_invite
    description: "Create a user invite."
    category: Identity & Access
    risk: high
    business_impact: "Provisions access for a new user to the organization; grants entry to apps, resources, and data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: retool.retool_delete_user_invite
    object: UserInvite
    action: retool_delete_user_invite
    description: "Delete a user invite by invite ID."
    category: Identity & Access
    risk: medium
    business_impact: "Revokes a pending invite before acceptance; reversible by re-inviting and affects no active session."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: retool.retool_set_user_invite_attribute
    object: UserInvite
    action: retool_set_user_invite_attribute
    description: "Create or update a user attribute on a user invite."
    category: Identity & Access
    risk: high
    business_impact: "Sets attributes on a pending invite that drive permission and group assignment; can pre-grant elevated access on acceptance."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: retool.retool_delete_user_invite_attribute
    object: UserInvite
    action: retool_delete_user_invite_attribute
    description: "Delete a user attribute from a user invite."
    category: Identity & Access
    risk: medium
    business_impact: "Removes a permission-driving attribute from a pending invite, altering the access the user will receive on acceptance."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: retool.retool_list_users
    object: User
    action: retool_list_users
    description: "List users in the organization."
    category: Identity & Access
    risk: high
    business_impact: "Returns the full member directory (names, emails, identifiers); a bulk read of personal data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: retool.retool_get_user
    object: User
    action: retool_get_user
    description: "Get a single user by user ID."
    category: Identity & Access
    risk: medium
    business_impact: "Reads one user's profile and personal data (name, email, identifiers)."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: retool.retool_list_user_invites
    object: UserInvite
    action: retool_list_user_invites
    description: "List user invites in the organization."
    category: Identity & Access
    risk: medium
    business_impact: "Returns all pending invites including invitee email addresses; a bulk read of personal data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: retool.retool_get_user_invite
    object: UserInvite
    action: retool_get_user_invite
    description: "Get a single user invite by invite ID."
    category: Identity & Access
    risk: low
    business_impact: "Reads one pending invite including the invitee email address."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

