  - id: monday.all_monday_api
    object: "*"
    action: all_monday_api
    description: "Execute any monday.com API operation by generating GraphQL queries and mutations dynamically."
    category: Platform & DevOps
    risk: critical
    business_impact: "Runs an arbitrary GraphQL query or mutation against the whole account, bypassing every per-tool guardrail; can read, mutate, or bulk-export any data the token can reach."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

