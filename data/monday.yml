    category: Platform & DevOps
    risk: medium
    business_impact: "Reverses a prior change to board or item state; alters the record of what was last done without a separate approval."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: monday.manage_tools
