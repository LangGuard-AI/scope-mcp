  - id: xero.update-credit-note
    object: CreditNote
    action: update-credit-note
    description: "Update a draft credit note in Xero; all line items must be re-supplied."
    category: Financial
    risk: high
    business_impact: "Rewrites a draft credit note's line items and amounts; alters the offset to revenue or payable."
    compliance: [SOX, COSO, SOC2, ISO_27001, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: xero.create-quote
    object: Quote
    action: create-quote
    description: "Create a quote in Xero."
    category: Financial
    risk: medium
    business_impact: "Creates a customer quote; a pre-sale document with no ledger impact until accepted and converted."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
