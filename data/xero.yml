    confidence: high
    access_methods: [REST, MCP]

  - id: xero.update-quote
    object: Quote
    action: update-quote
    description: "Update a draft quote in Xero; all line items must be re-supplied."
    category: Financial
    risk: medium
    business_impact: "Rewrites a draft quote's line items and amounts; no ledger impact until accepted."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
