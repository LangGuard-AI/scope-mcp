    category: Financial
    risk: high
    business_impact: "Rewrites a draft invoice's line items and amounts; alters revenue/liability before approval."
    compliance: [SOX, COSO, SOC2, ISO_27001, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

