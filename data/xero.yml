schema_version: "1.1"
platform: xero
display_name: Xero
source: langguard-editorial
updated: "2026-06"
reference: https://github.com/XeroAPI/xero-mcp-server
actions:
  # ---------- Financial — General Ledger & Payments ----------
  - id: xero.create-payment
    object: Payment
    action: create-payment
    description: "Create a payment against an invoice in Xero."
    category: Financial
    risk: critical
    business_impact: "Records a payment transaction against an invoice; settles the receivable/payable and directly affects the books and cash position."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: xero.create-manual-journal
    object: ManualJournal
    action: create-manual-journal
    description: "Create a manual journal in Xero from debit/credit journal lines."
    category: Financial
    risk: critical
    business_impact: "Posts debit/credit lines to the general ledger; affects financial statements and is in scope for SOX ITGCs."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: xero.update-manual-journal
    object: ManualJournal
    action: update-manual-journal
    description: "Update a draft manual journal in Xero."
    category: Financial
    risk: high
    business_impact: "Alters general-ledger journal lines on a draft entry; financial-statement-relevant change before posting."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: xero.create-bank-transaction
    object: BankTransaction
    action: create-bank-transaction
    description: "Create a spend or receive bank transaction in Xero."
    category: Financial
    risk: high
    business_impact: "Writes a spend/receive money entry to a bank ledger; affects cash-account balances and the books."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: xero.update-bank-transaction
    object: BankTransaction
    action: update-bank-transaction
    description: "Update an existing bank transaction in Xero."
    category: Financial
    risk: high
    business_impact: "Modifies a recorded bank-ledger entry; changes cash-account state and financial records."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Sales & Accounts Receivable ----------
  - id: xero.create-invoice
    object: Invoice
