schema_version: "1.3"
platform: xero
display_name: Xero
logo: https://www.xero.com/favicon.ico
source: langguard-editorial
updated: "2026-09"
reference: https://developer.xero.com/ai
mcp_server_url: https://mcp.xero.com/mcp
# Xero's Anthropic-verified connector exposes a read-only financial surface: there are
# no write, post, void or delete tools in the published tool list. Risk is therefore
# driven by data sensitivity and read blast radius, not by state mutation.
actions:
  # ---------- Financial ----------

  # source: https://claude.com/connectors/xero
  - id: xero.get_bank_account_transactions
    object: BankTransaction
    action: get_bank_account_transactions
    category: Financial
    risk: high
    business_impact: "Returns line-level bank account transaction history, exposing counterparties, amounts and cash movement patterns for every connected bank feed."
    compliance: [GLBA, SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/xero
  - id: xero.get_1099_report_summary
    object: TaxReport
    action: get_1099_report_summary
    category: Financial
    risk: medium
    business_impact: "Surfaces contractor 1099 totals with payee identities and tax-reporting figures filed with the IRS."
    compliance: [CCPA, SOX, COSO, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/xero
