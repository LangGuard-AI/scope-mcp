  - id: airwallex.create_billing_checkout
    object: BillingCheckout
    action: create_billing_checkout
    description: "Create a new hosted billing checkout page."
    category: Financial
    risk: medium
    business_impact: "Creates a hosted sandbox checkout page that collects no real payment. The production analog would create a live, customer-facing checkout that accepts real payments."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: airwallex.list_billing_products
    object: BillingProduct
    action: list_billing_products
    description: "List available billing products in the sandbox account."
    category: Financial
    risk: low
    business_impact: "Reads sandbox billing-product records; no real catalog or revenue data is exposed."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: airwallex.list_billing_prices
    object: BillingPrice
    action: list_billing_prices
    description: "List available billing prices in the sandbox account."
    category: Financial
    risk: low
    business_impact: "Reads sandbox billing-price records; no real pricing or revenue data is exposed."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Platform & DevOps ----------
  - id: airwallex.get_default_api_version
    object: ApiVersion
    action: get_default_api_version
    description: "Get the default API version associated with the account or organization."
    category: Platform & DevOps
    risk: low
    business_impact: "Returns the account's default API version string; pure metadata read with no data or financial exposure."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: airwallex.search_public_docs
    object: Documentation
    action: search_public_docs
    description: "Search the Airwallex documentation (product docs, API reference, SDKs)."
    category: Data Access
    risk: low
    business_impact: "Searches public Airwallex documentation; returns only published reference content with no account or PII access."
    compliance: []
