schema_version: "1.2"
platform: shapes
display_name: Shapes
source: langguard-editorial
updated: "2026-06"
server_version: "2026-06"
reference: https://mcp.shapes.co/
actions:
  # ---------- People & Directory ----------
  - id: shapes.list_employees
    object: Employee
    action: list_employees
    description: "Searches and filters employee records with pagination."
    category: People & Directory
    risk: high
    business_impact: "Returns directory-scale employee PII (names, identifiers, org placement); a filtered query can stream a large fraction of the workforce, sitting at the bulk-extraction boundary."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: shapes.aggregate_employees
    object: Employee
    action: aggregate_employees
    description: "Computes counts and distributions over workforce data."
    category: People & Directory
    risk: medium
    business_impact: "Returns aggregated headcount and demographic distributions; can become identifying personal data when slices are narrow enough to re-identify individuals."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: shapes.get_current_employee
    object: Employee
    action: get_current_employee
    description: "Retrieves the authenticated caller's own employee profile."
    category: People & Directory
    risk: low
    business_impact: "Returns the caller's own profile PII; self-scoped and individually audited."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: shapes.get_reporting_chain
    object: Employee
    action: get_reporting_chain
    description: "Navigates the manager-to-report relationships above or below an employee."
    category: People & Directory
    risk: medium
    business_impact: "Exposes the management hierarchy as relational PII linking named individuals to one another."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: shapes.list_entities
    object: Entity
    action: list_entities
    description: "Looks up organizational entities such as jobs, offices, and teams by id or name."
    category: People & Directory
    risk: low
    business_impact: "Returns non-personal organizational reference metadata (jobs, offices, teams)."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: shapes.list_employee_field_types
    object: FieldType
    action: list_employee_field_types
    description: "Discovers the available employee field definitions in the HR schema."
    category: People & Directory
    risk: low
    business_impact: "Returns HR schema and field-definition metadata; no personal data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: shapes.list_employee_field_value_changes
    object: FieldValueChange
    action: list_employee_field_value_changes
    description: "Reads the audit trail of changes made to employee record fields."
    category: People & Directory
    risk: high
    business_impact: "Exposes the historical change log of employee records, including prior values of sensitive HR PII; a read of the audit trail rather than a modification of it."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: shapes.list_profile_pictures
    object: ProfilePicture
    action: list_profile_pictures
    description: "Returns employee profile-photo URLs in bulk."
    category: People & Directory
    risk: high
    business_impact: "Returns workforce-scale employee photographs; facial imagery is biometric-adjacent personal data and bulk retrieval sits at the extraction boundary."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

