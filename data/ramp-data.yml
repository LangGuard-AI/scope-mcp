logo: https://ramp.com/favicon.ico
source: langguard-editorial
updated: "2026-09"
mcp_server_url: https://mcp.ramp.com/ramp-data/anthropic/mcp
# NOTE: Ramp's public market-intelligence server (Ramp Rate + AI Index). Every tool is a
# read-only query over aggregate, de-identified software-spend benchmarks — no customer
# ledger, cardholder, or employee data is reachable through this surface.
actions:
  # ---------- Data Access ----------

  # source: https://mcp.ramp.com/ramp-data/anthropic/mcp
  - id: ramp-data.ramp_rate_list_categories
    object: SoftwareCategory
    action: ramp_rate_list_categories
    description: "Lists all available Ramp Rate software categories, each with a software_category field."
    category: Data Access
    risk: low
    business_impact: "Returns the catalog of software categories Ramp Rate tracks; a discovery call with no side effects and no company-identifiable data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://mcp.ramp.com/ramp-data/anthropic/mcp
  - id: ramp-data.ramp_rate_get_category_summary
    object: SoftwareCategory
