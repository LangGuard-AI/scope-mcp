schema_version: "1.1"
platform: similarweb
display_name: Similarweb
source: langguard-editorial
updated: "2026-06"
reference: https://developers.similarweb.com/docs/similarweb-mcp
actions:
  # ---------- Data Access (Web Metrics) ----------
  # All tools are read-only market-intelligence queries returning aggregate /
  # estimated metrics about websites and apps. The vendor's MCP docs publish
  # only Title Case capability labels under a "Tool Name" column (no verbatim
  # tool ids reachable; live server is OAuth-gated), so these are capability-
  # form entries: slugified ids, verbatim labels in `description`, confidence
  # capped at medium.
  - id: similarweb.traffic_and_engagement
    object: WebMetric
    action: traffic_and_engagement
    id_form: capability
    description: "Traffic and Engagement"
    category: Data Access
    risk: low
    business_impact: "Returns aggregate traffic-volume and engagement metrics over time for a website; read-only competitive intelligence."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: similarweb.traffic_sources
    object: WebMetric
    action: traffic_sources
    id_form: capability
    description: "Traffic Sources"
    category: Data Access
    risk: low
    business_impact: "Returns traffic broken down by marketing channel (direct, display, mail, search, referral, social) for a website."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

