  # source: https://docs.datahub.com/docs/features/feature-guides/mcp
  - id: datahub.save_document
    object: Document
    action: save_document
    category: Knowledge & Glossary
    risk: low
    business_impact: "Saves a standalone knowledge-base document such as an insight, decision, or FAQ under a configured parent folder."
    compliance: []
    sod_concern: false
