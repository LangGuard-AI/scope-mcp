    object: JournalEntry
    action: create_journal_entry
    description: "Create a journal entry in QuickBooks Online."
    category: Financial
    risk: critical
    business_impact: "Posts debit/credit lines directly to the general ledger; affects financial statements and is in scope for SOX ITGCs."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: intuit-quickbooks.update_journal_entry
