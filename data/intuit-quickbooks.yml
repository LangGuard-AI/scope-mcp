schema_version: "1.1"
platform: intuit-quickbooks
display_name: Intuit QuickBooks
source: langguard-editorial
updated: "2026-06"
# Tool ids are verbatim from Intuit's official open-source MCP server
# (github.com/intuit/quickbooks-online-mcp-server) — 140 registered tools. Each id
# below was confirmed against the `const toolName = "..."` declaration in the
# corresponding src/tools/<entity>.tool.ts file: all tools register snake_case
# except the Bill and Vendor entities, which register kebab-case (create-bill,
# update-bill, delete-bill, create-vendor, update-vendor, delete-vendor); those
# are preserved exactly. The Claude-distributed connector at
# claude.com/connectors/intuit-quickbooks is the hosted equivalent.
#
# Write-surface completeness (verified by source diff): the server registers
# exactly 71 create/update/delete tools and zero non-CRUD write verbs (no
# send/void/post/sync/etc.). ALL 71 are curated here. The catalog/config
# entities Class, Department, Term, PaymentMethod, and Account expose create+update
# but NO delete tool in source (QBO deactivates these via update Active=false), so
# create+update-only coverage for them is complete, not an omission. Beyond the
# full write surface, this file curates the 11 financial reports and the 8 bulk
# PII/financial searches. Per-entity single-record getters (get_*),
# read_invoice/read_item, and routine config getters/searches are trimmed as
# low-impact reads.
reference: https://github.com/intuit/quickbooks-online-mcp-server
actions:
