schema_version: "1.2"
platform: linear
display_name: Linear
source: langguard-editorial
updated: "2026-05"
maintainer: https://linear.app/contact/support
actions:
  # ---------- Issues ----------
  - id: linear.save_issue
    object: Issue
    action: save_issue
    description: "Creates or updates a Linear issue; if id is provided, updates the existing issue, otherwise creates a new one."
    category: Issues
    risk: medium
    business_impact: "Creates or updates an issue including assignee, state, priority, and relations; reassigns, reprioritizes, or closes tracked work and is reversible."
    compliance: [SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: linear.list_issues
    object: Issue
    action: list_issues
    description: "Lists issues in the user's Linear workspace filtered by team, cycle, project, assignee, or state."
    category: Issues
    risk: low
    business_impact: "Reads issue titles, descriptions, assignees, and states across the workspace; bodies may contain incidental personal data or internal context."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: linear.get_issue
    object: Issue
    action: get_issue
    description: "Retrieves a single issue by its LIN-123 identifier including attachments and git branch name."
    category: Issues
    risk: low
    business_impact: "Reads a single issue including description, attachments, and branch name; bodies may contain incidental personal data or internal context."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: linear.save_comment
    object: Comment
    action: save_comment
    description: "Creates or updates a comment on a Linear issue, project, initiative, document, or project milestone."
    category: Issues
    risk: medium
    business_impact: "Posts or edits a comment under the authenticated identity; an impersonation surface that is reversible."
    compliance: [SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: linear.list_comments
    object: Comment
    action: list_comments
    description: "Lists comment threads on Linear issues, projects, and other entities."
    category: Issues
    risk: low
    business_impact: "Reads comment threads whose free-text bodies may contain incidental personal data or confidential discussion."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: linear.delete_comment
    object: Comment
    action: delete_comment
    description: "Deletes a Linear comment by ID."
    category: Issues
    risk: high
    business_impact: "Permanently removes a comment containing user-generated content; destructive, not recoverable through the API, and erases discussion trail."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: linear.list_issue_labels
    object: IssueLabel
    action: list_issue_labels
    description: "Lists labels available for tagging issues."
    category: Issues
    risk: low
    business_impact: "Reads the issue label taxonomy; configuration metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: linear.create_issue_label
    object: IssueLabel
    action: create_issue_label
    description: "Creates a new Linear issue label, team-scoped or workspace-wide."
    category: Issues
    risk: low
    business_impact: "Adds a new label to the issue label set; low-impact configuration write."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: linear.list_issue_statuses
    object: IssueStatus
    action: list_issue_statuses
    description: "Lists the workflow states defined for a team."
    category: Issues
    risk: low
    business_impact: "Reads workflow state definitions for a team; configuration metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: linear.get_issue_status
    object: IssueStatus
    action: get_issue_status
    description: "Retrieves a single workflow state's details by name or id within a team."
    category: Issues
    risk: low
    business_impact: "Reads a specific workflow state's metadata; configuration data only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: linear.list_cycles
    object: Cycle
    action: list_cycles
    description: "Lists a team's cycles (current, previous, or next sprints)."
    category: Issues
    risk: low
    business_impact: "Reads team cycles (sprints); planning metadata only."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Attachments ----------
  - id: linear.delete_attachment
    object: Attachment
    action: delete_attachment
    description: "Deletes an attachment by ID."
    category: Issues
    risk: high
    business_impact: "Permanently removes an attachment that may contain personal data or evidentiary files; destructive and not recoverable through the API."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: linear.create_attachment
    object: Attachment
    action: create_attachment
    description: "Deprecated fallback that uploads tiny base64-encoded file content as an attachment on an existing issue."
    category: Issues
    risk: medium
    business_impact: "Uploads arbitrary file content as an attachment; the payload may contain personal data such as screenshots, logs, or customer information."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: linear.prepare_attachment_upload
    object: Attachment
    action: prepare_attachment_upload
    description: "Prepares a direct file upload for an existing issue by minting a short-lived signed upload URL."
    category: Issues
    risk: medium
    business_impact: "Mints a 60-second signed upload URL scoped to an issue; a credentialed upload grant, though no data is written yet."
    compliance: [SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: linear.create_attachment_from_upload
    object: Attachment
    action: create_attachment_from_upload
    description: "Links an already-uploaded asset URL to an existing issue as an attachment."
    category: Issues
    risk: medium
    business_impact: "Finalizes file injection into an issue by linking an uploaded asset; the file may contain personal data such as screenshots or logs."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: linear.get_attachment
    object: Attachment
    action: get_attachment
    description: "Retrieves an attachment's content by ID."
    category: Issues
    risk: medium
    business_impact: "Reads attachment content that may contain personal data or confidential files; a single-record data-exfiltration vector."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: linear.extract_images
    object: Attachment
    action: extract_images
    description: "Fetches images embedded in markdown bodies."
    category: Issues
    risk: medium
    business_impact: "Pulls image content embedded in markdown that may include screenshots or personal data; a data-exfiltration vector."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

