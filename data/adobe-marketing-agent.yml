    object: Organization
    action: core-switch_org
    category: Operations
    risk: medium
    business_impact: "Repoints the session at a different Adobe IMS organization, moving every subsequent query and action across a tenant boundary into another company's marketing data."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

