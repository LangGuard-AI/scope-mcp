actions:
  # ---------- Identity & Access ----------

  # source: https://help.felt.com/felt-ai/mcp
  - id: felt-maps.share_map
    object: Map
    action: share_map
    category: Identity & Access
    risk: high
    business_impact: "Sets a map's public access level up to view-comment-edit and returns a share link, potentially exposing its layers and data to anyone with the URL."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Data Access ----------

  # source: https://help.felt.com/felt-ai/mcp
  - id: felt-maps.get_tabular_data_from_data_source
    object: DataSource
    action: get_tabular_data_from_data_source
    category: Data Access
    risk: medium
    business_impact: "Runs an ad-hoc read-only SELECT against a connected production database (Postgres, Snowflake, BigQuery) and returns raw rows, a read path that can surface sensitive records."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://help.felt.com/felt-ai/mcp
  - id: felt-maps.get_tabular_data_from_felt_layers
    object: Layer
    action: get_tabular_data_from_felt_layers
    category: Data Access
    risk: medium
    business_impact: "Runs an ad-hoc read-only SELECT against existing Felt layers and returns raw tabular rows to the caller."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

