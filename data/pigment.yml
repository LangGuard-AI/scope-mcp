  # ---------- Data Access (default mode — read-only) ----------
  # source: https://kb.pigment.com/docs/supported-tools (query_data)
  - id: pigment.query_data
    object: Metric
    action: query_data
    description: "Retrieves data from a single Metric using a natural-language query; returns values and metadata."
    category: Data Access
    risk: medium
    business_impact: "Reads live financial-planning values (revenue, headcount, costs) from a Metric; planning data leaves the workspace and may include employee compensation figures."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # source: https://github.com/gopigment/ai-plugins (tool:search)
  - id: pigment.search
    object: Block
    action: search
    description: "Scans the entire Application logic, exposing all Block metadata (names, data types, Dimensions, formulas)."
    category: Data Access
    risk: medium
    business_impact: "Exposes all Block metadata across an Application — names, data types, Dimensions, and formulas — and is not subject to per-Block access rights, so it can surface business logic beyond a user's data permissions."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # source: https://kb.pigment.com/docs/supported-tools (get_ai_metrics)
  - id: pigment.get_ai_metrics
    object: Metric
    action: get_ai_metrics
    description: "Lists AI-enabled Metrics in an Application, returning Metric IDs and names."
    category: Data Access
    risk: low
    business_impact: "Enumerates AI-enabled Metric names and IDs in an Application; metadata only, no values returned."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # source: https://kb.pigment.com/docs/supported-tools (get_metric_description)
  - id: pigment.get_metric_description
    object: Metric
    action: get_metric_description
    description: "Returns a Metric's structure: name, data type, description, Dimensions with sample Items, and Scenarios."
    category: Data Access
    risk: low
    business_impact: "Exposes a Metric's structure and sample Dimension Items; sample Items may reveal entity names (departments, regions, employees) but not bulk values."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # source: https://kb.pigment.com/docs/supported-tools (get_applications)
  - id: pigment.get_applications
    object: Application
    action: get_applications
    description: "Lists all Pigment applications the user can access, with ID, name, and description."
    category: Data Access
    risk: low
    business_impact: "Enumerates the Applications the user can access; structural metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Operations (advanced mode — performance diagnostics) ----------
  # source: https://github.com/gopigment/ai-plugins (tool:get_top_blocks_by_performance)
  - id: pigment.get_top_blocks_by_performance
    object: Block
    action: get_top_blocks_by_performance
    description: "Ranks the most expensive Blocks in an Application over a time window by execution-cost criteria."
    category: Operations
    risk: low
    business_impact: "Ranks Blocks by execution cost over a time window for performance triage; diagnostic metadata, no business data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # source: https://github.com/gopigment/ai-plugins (tool:performance_profile_change)
  - id: pigment.performance_profile_change
    object: Block
    action: performance_profile_change
    description: "Profiles a slow change by replaying it from the audit trail to report effective and output scope."
    category: Operations
    risk: low
    business_impact: "Profiles a recorded change for performance diagnostics; reads execution scope from the audit trail, makes no model change."
