    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # source: https://github.com/gopigment/ai-plugins (tool:update_view_chart_config)
  - id: pigment.update_view_chart_config
    object: View
    action: update_view_chart_config
    description: "Updates the chart configuration of a View."
