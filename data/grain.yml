actions:
  # ---------- Data Access ----------

  # source: https://developers.grain.com/mcp
  - id: grain.search_meetings
    object: Transcript
    action: search_meetings
    description: "Semantic search across all meeting transcripts."
    category: Data Access
    risk: high
    business_impact: "Mines every recorded conversation in the workspace by meaning rather than by meeting, letting one principal pull customer and internal discussion content at scale without an export control."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developers.grain.com/mcp
  - id: grain.fetch_meeting_transcript
    object: Transcript
    action: fetch_meeting_transcript
    description: "Retrieve full meeting transcript."
    category: Data Access
    risk: medium
    business_impact: "Returns the verbatim transcript of a single meeting, which routinely contains named participants, customer statements, and material non-public commercial detail."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developers.grain.com/mcp
  - id: grain.fetch_meeting_notes
    object: Meeting
    action: fetch_meeting_notes
    description: "Get AI-generated meeting notes (more concise than transcripts)."
    category: Data Access
    risk: medium
    business_impact: "Exposes the AI summary of a private conversation, condensing participant statements and commitments into a form that is easy to redistribute."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developers.grain.com/mcp
  - id: grain.fetch_meeting
    object: Meeting
    action: fetch_meeting
    description: "Get detailed information about a specific meeting."
    category: Data Access
    risk: medium
    business_impact: "Reveals a meeting's detail record including its participants and context, identifying who met whom and when."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developers.grain.com/mcp
  - id: grain.search_persons
    object: Person
    action: search_persons
    description: "Search for meeting participants when filtering."
    category: Data Access
    risk: medium
    business_impact: "Resolves identifiable individuals who appear in recorded meetings, building a searchable index of customers and colleagues."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developers.grain.com/mcp
  - id: grain.list_meetings
    object: Meeting
    action: list_meetings
    description: "Get filtered list of all accessible meetings."
    category: Data Access
    risk: medium
    business_impact: "Enumerates every meeting the caller can reach, mapping the recorded-conversation surface that later transcript and note reads draw from."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developers.grain.com/mcp
  - id: grain.list_attended_meetings
    object: Meeting
    action: list_attended_meetings
    description: "Get filtered list of all accessible meetings."
    category: Data Access
    risk: low
    business_impact: "Lists the meetings the authenticated user attended; a narrow calendar-style read of their own recording history."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developers.grain.com/mcp
  - id: grain.search_companies
