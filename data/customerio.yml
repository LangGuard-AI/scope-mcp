  - id: customerio.cio_write_api
    object: "*"
    action: cio_write_api
    category: Data Access
    risk: high
    business_impact: "Creates or edits any Customer.io resource, letting the agent alter customer profiles, segments, and campaign configuration through arbitrary POST, PUT, and PATCH calls."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.customer.io/ai/mcp/get-started/
  - id: customerio.cio_delete_api
    object: "*"
    action: cio_delete_api
    category: Data Access
    risk: critical
    business_impact: "Permanently removes any Customer.io resource, irreversibly destroying customer profiles, segments, or campaigns through arbitrary DELETE calls."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

