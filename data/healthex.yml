actions:
  # ---------- Health Records ----------

  # source: https://docs.healthex.io/mcp-server/mcp-tools
  - id: healthex.search
    object: HealthRecord
    action: search
    category: Health Records
    risk: high
    business_impact: "Semantic natural-language search spanning every category of a patient's record — conditions, medications, labs, procedures, visits, and clinical notes — surfacing the entire health picture in one call."
    compliance: [HIPAA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.healthex.io/mcp-server/mcp-tools
  - id: healthex.get_health_summary
    object: HealthSummary
    action: get_health_summary
    category: Health Records
    risk: medium
    business_impact: "Returns a comprehensive PHI snapshot — date of birth, active conditions, current medications with dosages, allergies, and recent vitals — aggregating the patient's core health profile in a single read."
    compliance: [HIPAA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.healthex.io/mcp-server/mcp-tools
  - id: healthex.search_clinical_notes
    object: ClinicalNote
    action: search_clinical_notes
    category: Health Records
    risk: medium
    business_impact: "Full-text search across all of a patient's clinical notes exposes the most sensitive free-text documentation, including provider narratives that can contain mental-health and behavioral detail."
    compliance: [HIPAA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

