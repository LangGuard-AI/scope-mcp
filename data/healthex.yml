  # ---------- Operations ----------

  # source: https://docs.healthex.io/mcp-server/mcp-tools
  - id: healthex.update_records
    object: SyncJob
    action: update_records
    category: Operations
    risk: low
    business_impact: "Triggers a background refresh that re-pulls the patient's health records from all connected provider locations; reversible and returns no clinical data itself."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.healthex.io/mcp-server/mcp-tools
