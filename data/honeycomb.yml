schema_version: "1.1"
platform: honeycomb
display_name: Honeycomb
source: langguard-editorial
updated: "2026-06"
reference: https://docs.honeycomb.io/integrations/mcp/tools/
actions:
  # ---------- Monitoring Configuration (writes) ----------
  - id: honeycomb.create_board
    object: Board
    action: create_board
    description: "Creates a Board with query panels, Service Level Objective (SLO) panels, and text (Markdown) panels."
    category: Configuration
    risk: medium
    business_impact: "Adds a new monitoring Board to the environment; reversible and visible to the team."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.update_board
    object: Board
    action: update_board
    description: "Updates an existing Board by renaming, adding, removing, updating, and reordering panels."
    category: Configuration
    risk: medium
    business_impact: "Changes an existing monitoring Board's panels; reversible but may alter what the team observes."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.create_trigger
    object: Trigger
    action: create_trigger
    description: "Creates a Trigger that fires alerts when query results cross a threshold."
    category: Configuration
    risk: medium
    business_impact: "Adds a new alerting Trigger; affects on-call notification behaviour but is reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.update_trigger
    object: Trigger
    action: update_trigger
    description: "Updates an existing Trigger's configuration."
    category: Configuration
    risk: medium
    business_impact: "Changes an existing alerting Trigger; can silence or alter alerts and is reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.create_slo
    object: SLO
    action: create_slo
    description: "Creates an SLO with an auto-created Service Level Indicator (SLI) derived column."
    category: Configuration
    risk: medium
    business_impact: "Adds a new Service Level Objective and derived column; reversible monitoring-config change."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.update_slo
    object: SLO
    action: update_slo
    description: "Updates an existing SLO with partial-update semantics."
    category: Configuration
    risk: medium
    business_impact: "Changes an existing Service Level Objective's targets or scope; reversible but alters reliability reporting."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.canvas_agent_invoke
    object: CanvasInvestigation
    action: canvas_agent_invoke
    description: "Sends a message to the Canvas agent to drive an investigation."
    category: Operations
    risk: medium
    business_impact: "Triggers an automated Canvas investigation that queries production telemetry on the team's behalf."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Notification Recipients ----------
  - id: honeycomb.create_recipient
    object: Recipient
    action: create_recipient
    description: "Creates a notification recipient that can be attached to Triggers and SLO burn alerts."
    category: Configuration
    risk: medium
    business_impact: "Registers a new alert recipient (name/email/endpoint); stores contact PII and can redirect alerts."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.list_recipients
    object: Recipient
    action: list_recipients
    description: "Lists all pre-registered notification recipients for the team."
    category: Configuration
    risk: low
    business_impact: "Reads the team's registered alert recipients, which include contact PII such as names and email addresses."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Telemetry Query & Analysis (reads) ----------
  - id: honeycomb.run_query
    object: Query
    action: run_query
    description: "Runs a time-series aggregation query against a Honeycomb dataset and returns computed results."
    category: Data Access
    risk: medium
    business_impact: "Reads production telemetry; results may expose PII present in span attributes such as user IDs, IPs, or payloads."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: honeycomb.get_query_results
    object: Query
    action: get_query_results
    description: "Retrieves results and metadata from a previously executed query run."
    category: Data Access
    risk: medium
    business_impact: "Reads stored query results; may expose PII present in span attributes captured by the query."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: honeycomb.find_queries
    object: Query
    action: find_queries
    description: "Searches query history and saved queries by intent and returns matching queries."
    category: Data Access
    risk: low
    business_impact: "Reads saved and historical query definitions; query filters may reference identifying attributes."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: honeycomb.run_bubbleup
    object: Query
    action: run_bubbleup
    description: "Runs a BubbleUp analysis on a query result to identify what makes a selected subset of data different."
    category: Data Access
    risk: medium
    business_impact: "Surfaces the attribute values that distinguish a data subset; may expose PII present in span attributes."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: honeycomb.get_anomaly_service_profiles
    object: AnomalyProfile
    action: get_anomaly_service_profiles
    description: "Returns anomaly detection service profiles for the current team."
    category: Data Access
    risk: low
    business_impact: "Reads computed anomaly profiles over production telemetry; aggregated but derived from potentially PII-bearing spans."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Traces & Spans (reads) ----------
  - id: honeycomb.get_trace
    object: Trace
    action: get_trace
    description: "Retrieves all spans for a specific trace ID and renders them as a waterfall."
    category: Data Access
    risk: medium
    business_impact: "Reads the full span detail of a single production trace; may expose PII present in span attributes."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: honeycomb.list_spans
    object: Span
    action: list_spans
    description: "Lists span names in trace data, ranked by count."
    category: Data Access
    risk: low
    business_impact: "Reads span-name frequency metadata; span names are schema-level and rarely contain personal data."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: honeycomb.get_span_details
    object: Span
    action: get_span_details
    description: "Returns a summary of attributes and their common values observed on spans with a specific name."
    category: Data Access
    risk: medium
    business_impact: "Reads common attribute values for a span type; may expose PII present in span attributes such as user IDs or IPs."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- AI Conversation Analysis (reads) ----------
  - id: honeycomb.list_aiconversations
    object: AIConversation
    action: list_aiconversations
    description: "Lists recent AI agent conversations in an environment, ordered by total event count."
    category: Data Access
    risk: medium
    business_impact: "Reads metadata for captured AI agent conversations; may reference prompts or user content carrying PII."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: honeycomb.get_aiconversation
    object: AIConversation
    action: get_aiconversation
    description: "Returns the full event timeline for a single AI conversation by its gen_ai.conversation.id value."
    category: Data Access
    risk: medium
    business_impact: "Reads the full event timeline of a captured AI conversation, which can include prompts and responses containing PII."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: honeycomb.canvas_agent_poll_response
    object: CanvasInvestigation
    action: canvas_agent_poll_response
    description: "Polls for the result of a previously-issued canvas_agent_invoke call."
    category: Data Access
    risk: low
    business_impact: "Reads the result of a Canvas investigation; output summarizes telemetry that may reference PII."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Monitoring Configuration (reads) ----------
  - id: honeycomb.list_boards
    object: Board
    action: list_boards
    description: "Lists Boards in an environment, or returns the full contents of a single Board by ID."
    category: Configuration
    risk: low
    business_impact: "Reads monitoring Board definitions; configuration metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.get_triggers
    object: Trigger
    action: get_triggers
    description: "Lists Triggers for the team, or returns detailed configuration for a single Trigger."
    category: Configuration
    risk: low
    business_impact: "Reads alerting Trigger configuration; monitoring metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.get_slos
    object: SLO
    action: get_slos
    description: "Lists SLOs for the team, or returns detailed status and graphs for a single SLO."
    category: Configuration
    risk: low
    business_impact: "Reads Service Level Objective configuration and status; monitoring metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Workspace & Schema Discovery (reads) ----------
  - id: honeycomb.get_workspace_context
    object: Workspace
    action: get_workspace_context
    description: "Returns the team name, current time, and a list of environments."
    category: Data Access
    risk: low
    business_impact: "Reads top-level workspace context; team and environment metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.get_environment
    object: Environment
    action: get_environment
    description: "Returns details for a single environment, including datasets and calculated fields."
    category: Data Access
    risk: low
    business_impact: "Reads environment metadata, datasets, and calculated-field definitions; schema-level only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.get_dataset
    object: Dataset
    action: get_dataset
    description: "Provides metadata and full column schema for a single dataset."
    category: Data Access
    risk: low
    business_impact: "Reads dataset metadata and column schema; schema-level only, no row data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.get_dataset_columns
    object: Dataset
    action: get_dataset_columns
    description: "Returns the full column schema with optional sample values for specific columns."
    category: Data Access
    risk: low
    business_impact: "Reads column schema with optional sample values; sample values may surface PII held in those columns."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: honeycomb.find_columns
    object: Column
    action: find_columns
    description: "Locates columns and calculated fields by intent across datasets in an environment."
    category: Data Access
    risk: low
    business_impact: "Searches column and calculated-field definitions by intent; schema-level metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.get_service_map
    object: ServiceMap
    action: get_service_map
    description: "Returns a snapshot of service-to-service call dependencies for a specified time range."
    category: Data Access
    risk: low
    business_impact: "Reads aggregated service-to-service dependency topology; infrastructure metadata, no personal data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Semantic Conventions (reads) ----------
  - id: honeycomb.search_semconv
    object: SemanticConvention
    action: search_semconv
    description: "Searches the semantic convention registry for attributes matching a query."
    category: Data Access
    risk: low
    business_impact: "Searches the OpenTelemetry semantic-convention registry; reference metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.get_semconv_attribute
    object: SemanticConvention
    action: get_semconv_attribute
    description: "Returns full definitions of one or more semantic convention attributes by their exact names."
    category: Data Access
    risk: low
    business_impact: "Reads semantic-convention attribute definitions; reference metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.list_semconv_namespaces
    object: SemanticConvention
    action: list_semconv_namespaces
    description: "Lists the top-level semantic convention namespaces available in the team's registry."
    category: Data Access
    risk: low
    business_impact: "Reads the list of semantic-convention namespaces; reference metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Documentation & Feedback ----------
  - id: honeycomb.refinery_docs
    object: Documentation
    action: refinery_docs
    description: "Reads from Honeycomb Refinery documentation."
    category: Data Access
    risk: low
    business_impact: "Reads public Honeycomb Refinery documentation; no customer data involved."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: honeycomb.feedback
    object: Feedback
    action: feedback
    description: "Submits feedback about the Honeycomb MCP server experience to the Honeycomb team."
    category: Operations
    risk: low
    business_impact: "Sends free-text feedback to Honeycomb; could include whatever text the agent supplies."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
