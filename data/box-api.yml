  # ---------- Identity & Access ----------

  # source: https://developer.box.com/guides/box-mcp/tools/
  - id: box-api.create_collaboration
    object: Collaboration
    action: create_collaboration
    category: Identity & Access
    risk: high
    business_impact: "Grants a user or group access to a file, folder, or hub, widening who can read Box content that may hold confidential or personal data — bypasses access-review controls."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developer.box.com/guides/box-mcp/tools/
