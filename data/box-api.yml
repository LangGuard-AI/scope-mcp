    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developer.box.com/guides/box-mcp/tools/
  - id: box-api.add_file_shared_link
    object: SharedLink
    action: add_file_shared_link
    category: Identity & Access
    risk: high
    business_impact: "Creates or updates a shared link for a file, potentially exposing its contents to anyone with the URL outside the organization's access controls."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developer.box.com/guides/box-mcp/tools/
