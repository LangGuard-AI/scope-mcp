  - id: microsoft-sharepoint.setSensitivityLabelOnFile
    object: DriveItem
    action: setSensitivityLabelOnFile
    description: "Sets the sensitivity label of a file from the specified document library (drive)."
    category: Identity & Access
    risk: high
    business_impact: "Changes a file's sensitivity label, which can downgrade its data classification and relax the encryption and DLP controls that protect it."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

