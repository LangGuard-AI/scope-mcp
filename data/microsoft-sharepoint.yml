  # source: https://learn.microsoft.com/en-us/microsoft-copilot-studio/mcp-sharepoint-work-iq
  - id: microsoft-sharepoint.shareFileOrFolder
    object: DriveItem
    action: shareFileOrFolder
    description: "Sends a sharing invitation to grant read or write permissions on a file or folder (DriveItem) within a specified document library (drive)."
    category: Identity & Access
    risk: high
    business_impact: "Grants read or write access on a file or folder to additional principals, widening who can reach potentially confidential documents."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://learn.microsoft.com/en-us/microsoft-copilot-studio/mcp-sharepoint-work-iq
  - id: microsoft-sharepoint.sendInviteForList
    object: List
    action: sendInviteForList
    description: "Sends a sharing invitation to grant permissions on a SharePoint list."
    category: Identity & Access
    risk: high
    business_impact: "Grants another principal permissions on a SharePoint list, exposing its records to a newly invited user."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

