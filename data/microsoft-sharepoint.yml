  - id: microsoft-sharepoint.deleteList
    object: List
    action: deleteList
    description: "Deletes a SharePoint list from a site. Deletes the entire list container and all items within it. Cannot be undone."
    category: Operations
    risk: critical
    business_impact: "Permanently deletes an entire SharePoint list and every record it contains with no undo, destroying potentially business-critical data in one call."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

