  # ---------- Taxonomy & Data Governance ----------
  - id: amplitude.update_event
    object: Event
    action: update_event
    description: "Update an event's description, status, or category, or rename the event."
    category: Operations
    risk: medium
    business_impact: "Mutates the tracking-plan taxonomy; renaming an event can silently break downstream charts and integrations, but the change is reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: amplitude.update_properties
    object: Property
    action: update_properties
    description: "Update property metadata or rename properties."
    category: Operations
    risk: medium
    business_impact: "Mutates the property taxonomy; renames affect downstream analysis and can silently alter metric semantics, but the change is reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: amplitude.update_custom_or_labeled_events
    object: Event
    action: update_custom_or_labeled_events
    description: "Update or rename custom or labeled events; the definition is replaced in full."
    category: Operations
    risk: medium
    business_impact: "Replaces a custom or labeled event definition in full; can silently alter metric semantics downstream but is reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
