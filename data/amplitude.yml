partial_coverage_acknowledged: true
actions:
  # ---------- Experiments & Flags ----------
  - id: amplitude.create_experiment
    object: Experiment
    action: create_experiment
    description: "Create an A/B test experiment across projects with custom variants and metrics."
    category: Operations
    risk: medium
    business_impact: "Provisions a live A/B experiment that shifts user-facing behavior across one or more projects; reviewable and reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: amplitude.update_experiment
    object: Experiment
    action: update_experiment
    description: "Set or replace the metrics on an existing experiment."
    category: Operations
    risk: medium
    business_impact: "Alters how a live experiment is evaluated by changing its metrics; can shift rollout decisions for a whole segment but is reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: amplitude.create_flags
    object: FeatureFlag
    action: create_flags
    description: "Batch-create one or more feature flags."
    category: Operations
    risk: high
    business_impact: "Creates feature flags that gate production behavior and change what end users see; reversible but a direct change-management event on a live surface."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: amplitude.update_flag
    object: FeatureFlag
    action: update_flag
    description: "Update a feature flag or experiment's metadata, variants, testers, and deployments."
    category: Operations
    risk: high
    business_impact: "Directly changes which users receive a feature or variant in production; a single change can flip behavior for an entire segment."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: amplitude.create_metric
    object: Metric
    action: create_metric
    description: "Create a reusable KPI or metric used by experiments and dashboards."
    category: Operations
    risk: medium
    business_impact: "Defines a reusable metric that downstream experiments and dashboards rely on for decisions; reversible change-management write."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: amplitude.get_experiments
    object: Experiment
    action: get_experiments
    description: "Get detailed experiment state, variants, and decisions."
    category: Operations
    risk: low
    business_impact: "Returns experiment configuration and decisions; read-only metadata that can reveal unreleased feature strategy."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: amplitude.query_experiment
    object: Experiment
    action: query_experiment
    description: "Analyze experiment results, variant performance, and statistical significance."
    category: Operations
    risk: low
    business_impact: "Returns experiment results and statistical significance; read-only and used to inform rollout decisions."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: amplitude.get_flags
    object: FeatureFlag
    action: get_flags
    description: "Retrieve feature-flag definitions, variants, and configuration."
    category: Operations
    risk: low
    business_impact: "Returns feature-flag definitions and configuration; read-only metadata that can reveal rollout strategy."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: amplitude.get_deployments
    object: Deployment
    action: get_deployments
    description: "Retrieve all deployments, including the API keys for flags and experiments."
    category: Identity & Access
    risk: high
    business_impact: "Returns live deployment API keys for flags and experiments; exposed credentials can be replayed to read or mutate flag state."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

