schema_version: "1.1"
platform: contentsquare
display_name: Contentsquare
source: langguard-editorial
updated: "2026-06"
reference: https://support.contentsquare.com/hc/en-us/articles/41563169756945-How-to-set-up-and-use-Model-Context-Protocol-MCP
# NOTE: Contentsquare's MCP server (https://api.contentsquare.com/mcp) is OAuth2-gated
# with a per-tenant scope, so live tools/list was not reachable anonymously. The 21
# tool names below are verbatim from a published connector catalog and were
# cross-corroborated against the vendor's own support doc, which attests the same
# camelCase convention and tools (e.g. computeJourney, computeFunnel,
# getTopErrorsByImpactOnGoal, submitMcpFeedback, and the recommend*/search* config
# family, plus the quota note that configuration-retrieval calls don't count). The
# kebab-case `list-projects` outlier and a few catalog-only ids are marked
# confidence: medium since they were not individually attested by the vendor doc.
# This is an analytics/insights surface: every tool reads or computes over
# aggregated behavioral experience data; there is no raw-data export, deletion, or
# admin/identity mutation on the MCP surface. `submitMcpFeedback` is the only write.
actions:
  # ---------- Analytics ----------
  - id: contentsquare.computeJourney
    object: Journey
    action: computeJourney
    description: "Surfaces the most common paths users take through the site (journey analysis)."
    category: Analytics
    risk: medium
    business_impact: "Computes aggregated visitor journey paths over behavioral session data; reveals how users move through the product but returns aggregates, not raw PII records."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: contentsquare.computeFunnel
    object: Funnel
    action: computeFunnel
    description: "Identifies drop-off points across key steps such as product page, cart, checkout, and purchase (funnel analysis)."
    category: Analytics
    risk: medium
    business_impact: "Computes conversion-funnel drop-off over aggregated behavioral data; returns aggregates rather than identifiable individual records."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: contentsquare.computeImpact
    object: Impact
    action: computeImpact
    description: "Estimates the business impact of a behavior, error, or page on conversions and goals."
    category: Analytics
    risk: low
    business_impact: "Returns an aggregated impact estimate over experience data; read-only and non-identifying."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: contentsquare.computeSiteMetrics
    object: Metric
    action: computeSiteMetrics
    description: "Computes aggregated site-level experience metrics for a time range."
    category: Analytics
    risk: low
    business_impact: "Returns aggregated site-level experience metrics; read-only and non-identifying."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: contentsquare.computePageGroupMetrics
    object: Metric
    action: computePageGroupMetrics
    description: "Computes aggregated metrics for a page group."
    category: Analytics
    risk: low
    business_impact: "Returns aggregated page-group experience metrics; read-only and non-identifying."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: contentsquare.computePageComparison
    object: Metric
    action: computePageComparison
    description: "Compares experience metrics across pages or page groups."
    category: Analytics
    risk: low
    business_impact: "Returns an aggregated comparison of page-level metrics; read-only and non-identifying."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Error Analysis ----------
  - id: contentsquare.getTopErrorsBySessionsWithErrors
