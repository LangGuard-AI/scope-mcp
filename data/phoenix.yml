reference: https://phoenix.hginsights.com/docs/mcp-tools/overview
actions:
  # ---------- Identity & Access (admin) ----------
  - id: phoenix.admin_remove_user
    object: User
    action: admin_remove_user
    description: "Removes a user from the calling org and revokes all of their API keys and OAuth tokens for that org."
    reference: https://phoenix.hginsights.com/docs/mcp-tools/admin-remove-user
    category: Identity & Access
    risk: critical
    business_impact: "Hard-deletes the user's org membership and revokes every API key and OAuth token they hold; the vendor labels this irreversible, requiring a fresh invitation to restore access."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: phoenix.admin_invite_user
    object: User
    action: admin_invite_user
    description: "Invites a user to the calling org with a member or admin role and emails the invitation."
    reference: https://phoenix.hginsights.com/docs/mcp-tools/admin-invite-user
    category: Identity & Access
    risk: critical
    business_impact: "Provisions org access and can grant the admin role, a privilege-escalation path that unlocks every other admin-only tool; sends an email and writes an audit row."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: phoenix.admin_list_users
    object: User
    action: admin_list_users
    description: "Lists the users who are members of the calling org."
    reference: https://phoenix.hginsights.com/docs/mcp-tools/admin-list-users
    category: Identity & Access
    risk: high
    business_impact: "Returns the full roster of org members including their identities; a bulk read of employee personal data subject to data-subject rights."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: phoenix.admin_list_api_keys
    object: ApiKey
    action: admin_list_api_keys
    description: "Lists the API keys issued for the calling org with attribution metadata."
    reference: https://phoenix.hginsights.com/docs/mcp-tools/admin-list-api-keys
    category: Identity & Access
    risk: medium
    business_impact: "Enumerates the org's API-key inventory and the users they are attributed to; surfaces the access-control surface but returns metadata, not the secret key values."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Secrets & Integrations (admin) ----------
  - id: phoenix.admin_set_integration_credentials
    object: IntegrationCredential
    action: admin_set_integration_credentials
    description: "Sets or rotates the secret credential for an org integration."
    reference: https://phoenix.hginsights.com/docs/mcp-tools/admin-set-integration-credentials
    category: Secrets & Workflows
    risk: critical
    business_impact: "Writes or rotates an integration's secret credential org-wide; controls downstream data-source access and can repoint or break integrations."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: phoenix.admin_remove_integration_credentials
    object: IntegrationCredential
    action: admin_remove_integration_credentials
    description: "Deactivates an integration by removing its stored credential; idempotent."
    reference: https://phoenix.hginsights.com/docs/mcp-tools/admin-remove-integration-credentials
    category: Secrets & Workflows
    risk: medium
    business_impact: "Removes an integration's credential and deactivates it org-wide; reversible by setting the credential again and audited on every call."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: phoenix.admin_list_integrations
    object: Integration
    action: admin_list_integrations
    description: "Lists the integrations configured for the calling org and their status."
    reference: https://phoenix.hginsights.com/docs/mcp-tools/admin-list-integrations
    category: Secrets & Workflows
    risk: low
    business_impact: "Returns the org's integration inventory and configuration status; metadata only, no credential values are exposed."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

