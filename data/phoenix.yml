    object: Artifact
    action: phoenix_get_artifact
    description: "Get Artifact"
    category: Operations
    risk: medium
    business_impact: "Retrieves a stored artifact from a prior agent run, which may contain contact or account data another operator in the workspace already enriched."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: low
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.phoenix_list_artifacts
    object: Artifact
    action: phoenix_list_artifacts
    description: "List Artifacts"
    category: Operations
    risk: low
    business_impact: "Lists stored artifacts from prior agent runs, revealing which accounts and topics other operators in the workspace have researched."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.phoenix_get_run_status
