    action: phoenix_get_run_status
    description: "Get Run Status"
    category: Operations
    risk: low
    business_impact: "Returns execution state and progress for an agent run; no market or contact data is disclosed."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.phoenix_list_agents
    object: Agent
    action: phoenix_list_agents
    description: "List Agents"
    category: Operations
    risk: low
