actions:
  # ---------- Data Access ----------

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.contact_enrich
    object: Contact
    action: contact_enrich
    description: "Enrich a known person: email, profiles, employment history"
    category: Data Access
    risk: high
    business_impact: "Reveals a named individual's work email, social profiles and employment history from broker data, with phone reveal on by default in v2 — personal data obtained without the subject's direct consent."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.contact_search
    object: Contact
    action: contact_search
    description: "Discover people by title/seniority/location — no email or phone"
    category: Data Access
    risk: high
    business_impact: "Returns lists of identifiable individuals filtered by title, seniority and location — bulk discovery of people who never interacted with the caller's organisation."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.hg_data_query
    object: DataWarehouse
    action: hg_data_query
    description: "HG Data Query"
    category: Data Access
    risk: high
    business_impact: "Runs caller-shaped queries against HG's data warehouse billed per row returned, so one broad query can extract large volumes of licensed market data and burn unbounded credits."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.hg_catalog
    object: Schema
    action: hg_catalog
    description: "Data-warehouse schema — tables, columns, and join keys"
    category: Data Access
    risk: low
    business_impact: "Exposes the warehouse schema — tables, columns and join keys — mapping out every dataset reachable through the query tools."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.customer_data_query
    object: CustomerDataset
    action: customer_data_query
    description: "Customer Data Query"
    category: Data Access
    risk: medium
    business_impact: "Queries the customer's own datasets uploaded into Phoenix, which commonly carry account and contact records from the caller's CRM."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: low
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.customer_data_explore
    object: CustomerDataset
    action: customer_data_explore
    description: "Customer Data Explore"
    category: Data Access
    risk: low
    business_impact: "Lists the customer-uploaded datasets and fields available in the workspace, showing what internal data has been loaded into Phoenix."
    compliance: []
    sod_concern: false
    confidence: low
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.web_search
    object: WebSearch
    action: web_search
    description: "Web Search"
    category: Data Access
    risk: low
    business_impact: "Issues outbound web searches billed per query, sending the agent's search terms to an external provider outside Phoenix's data boundary."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.sec_full_text_search
    object: Filing
    action: sec_full_text_search
    description: "SEC Full Text Search"
    category: Data Access
    risk: low
    business_impact: "Full-text searches SEC filings for a company; the text is public record but each call consumes credits."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Operations ----------

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.phoenix_invoke_agent
    object: AgentRun
    action: phoenix_invoke_agent
    description: "Invoke Agent"
    category: Operations
    risk: medium
    business_impact: "Starts a server-side Phoenix agent run that pulls data and writes artifacts on its own; the agent's intermediate data access is not itemised to the caller."
    compliance: [ISO_42001, NIST_AI_RMF]
    sod_concern: false
    confidence: low
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
  - id: phoenix.market_data_agent
    object: AgentRun
    action: market_data_agent
    description: "Market Data Agent"
    category: Operations
    risk: medium
    business_impact: "Runs the market-data agent, metered separately and billed at cost through the underlying run — an unbounded-cost path with no per-call credit ceiling."
    compliance: [ISO_42001, NIST_AI_RMF]
    sod_concern: false
    confidence: low
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://phoenix.hginsights.com/docs/mcp-tools/overview
