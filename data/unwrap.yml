actions:
  # ---------- Data Access ----------

  # source: https://docs.unwrap.ai/articles/6412771011-unwrap-mcp
  - id: unwrap.query_feedback_tool
    object: FeedbackEntry
    action: query_feedback_tool
    description: "Queries feedback data using Unwrap's query syntax."
    category: Data Access
    risk: medium
    business_impact: "Runs arbitrary queries across the org's aggregated customer feedback corpus, returning verbatims that routinely carry reviewer names, emails and other end-user identifiers pulled in from support and review integrations."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/unwrap
  - id: unwrap.query_feedback_data
    object: FeedbackEntry
    action: query_feedback_data
    description: "Queries feedback data exposed through the Unwrap connector."
    category: Data Access
    risk: medium
    business_impact: "Reads customer feedback records across connected sources; result sets can surface personal data submitted by end users in reviews, tickets and survey responses."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: low
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://docs.unwrap.ai/articles/6412771011-unwrap-mcp
  - id: unwrap.sample_feedback_entries
    object: FeedbackEntry
    action: sample_feedback_entries
    description: "Creates feedback samples from a view, either random or semantic."
    category: Data Access
    risk: high
    business_impact: "Pulls raw customer verbatims out of a view into an agent-readable sample, exposing free-text that frequently contains reviewer identities, account details and unredacted personal information."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://docs.unwrap.ai/articles/6412771011-unwrap-mcp
  - id: unwrap.analyze_entry_text
    object: FeedbackSample
    action: analyze_entry_text
    description: "Runs custom instructions across saved feedback samples."
    category: Data Access
    risk: medium
    business_impact: "Applies caller-supplied instructions to the text of a saved sample, so personal data inside customer verbatims is processed for a purpose the data subject never consented to."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://docs.unwrap.ai/articles/6412771011-unwrap-mcp
  - id: unwrap.classify_feedback_entries
    object: FeedbackEntry
    action: classify_feedback_entries
    description: "Classifies feedback entries into predefined labels."
    category: Data Access
    risk: medium
    business_impact: "Attaches labels to customer feedback entries, changing how those records are counted in downstream reporting and creating derived attributes about identifiable reviewers."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://docs.unwrap.ai/articles/6412771011-unwrap-mcp
  - id: unwrap.plot_chart
    object: Chart
    action: plot_chart
    description: "Generates charts and tables for feedback trends and comparisons."
    category: Data Access
    risk: low
    business_impact: "Renders aggregate trend charts and tables over feedback volumes; output is summarized counts rather than individual records."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://docs.unwrap.ai/articles/6412771011-unwrap-mcp
  - id: unwrap.search_groups
    object: Group
    action: search_groups
    description: "Semantically searches taxonomy groups with optional filtering."
    category: Data Access
    risk: low
    business_impact: "Reads the feedback taxonomy to find themes matching a query; returns aggregated group metadata, not the underlying verbatims."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://docs.unwrap.ai/articles/6412771011-unwrap-mcp
  - id: unwrap.search_actionable_groups
    object: Group
    action: search_actionable_groups
    description: "Returns the most actionable feedback groups with filtering and sorting."
    category: Data Access
    risk: low
    business_impact: "Surfaces the themes Unwrap ranks as most actionable, which can steer roadmap prioritization if the agent reports them without the underlying volume context."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/unwrap
  - id: unwrap.get_group_insights_playbook
    object: Playbook
    action: get_group_insights_playbook
    description: "Returns the guided playbook for analyzing insights on a feedback group."
    category: Data Access
    risk: low
    business_impact: "Retrieves Unwrap's guidance for interpreting group insights; read-only instructional content with no customer records attached."
    compliance: []
    sod_concern: false
    confidence: low
    access_methods: [MCP]
    source: langguard-editorial

