schema_version: "1.1"
platform: monte-carlo
display_name: Monte Carlo
source: langguard-editorial
updated: "2026-06"
reference: https://docs.getmontecarlo.com/docs/mcp-server
actions:
  # ---------- Alerts ----------
  - id: monte-carlo.update_alert
    object: Alert
    action: update_alert
    description: "Modify an alert's status, severity, or metadata."
    category: Operations
    risk: medium
    business_impact: "Changes an alert's status or severity, which can resolve, reopen, or suppress a data-quality incident; reviewable and reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: monte-carlo.set_alert_owner
    object: Alert
    action: set_alert_owner
    description: "Assign or remove alert ownership; an empty owner clears it."
    category: Operations
    risk: low
    business_impact: "Reassigns or clears responsibility for an alert; affects workflow routing and accountability only and is fully reversible."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: monte-carlo.create_or_update_alert_comment
    object: Alert
    action: create_or_update_alert_comment
    description: "Add or edit a triage comment on an alert for collaboration."
    category: Operations
    risk: low
    business_impact: "Adds or edits collaborative commentary on an alert; reversible and low-impact."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: monte-carlo.get_alerts
    object: Alert
    action: get_alerts
    description: "Retrieve alerts and incidents with filtering options."
    category: Operations
    risk: low
    business_impact: "Reads data-quality alerts and incident history; exposes operational metadata including table and asset names, not source data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

