  # ---------- Reports & Artifacts ----------
  - id: orion.delete_artifact
    object: Artifact
    action: delete_artifact
    description: "Delete a slide deck, dashboard, or report artifact. This is a destructive action."
    reference: https://docs.runorion.com/mcp/tools
    category: Reports & Artifacts
    risk: medium
    business_impact: "Deletes a single slide deck, dashboard, or report; destructive, with recovery not documented."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: orion.list_artifacts
    object: Artifact
    action: list_artifacts
    description: "List slide decks, dashboards, or reports for a project."
    reference: https://docs.runorion.com/mcp/tools
    category: Reports & Artifacts
    risk: low
    business_impact: "Lists report and dashboard artifacts for a project; non-sensitive metadata read."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: orion.get_artifact
