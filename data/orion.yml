  - id: orion.execute_metric
    object: Metric
    action: execute_metric
    description: "Trigger execution of a metric to refresh its current value."
    reference: https://docs.runorion.com/mcp/tools
    category: Operations
    risk: low
    business_impact: "Recomputes a business KPI's current value; reversible computation with no financial-statement impact."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: orion.run_workflow
    object: Workflow
    action: run_workflow
    description: "Trigger execution of a workflow (insight maker)."
    reference: https://docs.runorion.com/mcp/tools
    category: Operations
    risk: low
    business_impact: "Runs an analysis workflow and produces results; reversible compute with no irreversible side effects."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: orion.list_metrics
    object: Metric
    action: list_metrics
    description: "List metrics (KPIs) for a project."
    reference: https://docs.runorion.com/mcp/tools
