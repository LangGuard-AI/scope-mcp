actions:
  # ---------- Identity & Access ----------

  # source: https://docs.runorion.com/mcp/tools.md
  - id: orion.list_users
    object: User
    action: list_users
    category: Identity & Access
    risk: medium
    business_impact: "Enumerates every member of the Orion organization together with their assigned roles, exposing the workforce roster and the platform's access-control layout in a single call."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # ---------- Operations ----------

  # source: https://docs.runorion.com/mcp/tools.md
  - id: orion.delete_artifact
    object: Artifact
    action: delete_artifact
    category: Operations
    risk: high
    business_impact: "Permanently removes a dashboard, report, or slide deck that stakeholders may depend on, with no documented recovery path once the agent issues the call."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://docs.runorion.com/mcp/tools.md
  - id: orion.execute_metric
    object: Metric
    action: execute_metric
    category: Operations
    risk: medium
    business_impact: "Recomputes a KPI against the connected warehouse, overwriting the value that dashboards and downstream readers treat as current business truth."
    compliance: [SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://docs.runorion.com/mcp/tools.md
  - id: orion.run_workflow
    object: Workflow
    action: run_workflow
    category: Operations
    risk: medium
    business_impact: "Fires an insight-maker workflow, consuming warehouse compute and publishing a fresh set of analysis outputs that colleagues will read as authoritative."
    compliance: [SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

