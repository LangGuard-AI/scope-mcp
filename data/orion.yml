  - id: orion.get_metric_results
    object: Metric
    action: get_metric_results
    description: "Get historical execution results for a metric."
    reference: https://docs.runorion.com/mcp/tools
    category: Operations
    risk: low
    business_impact: "Reads historical KPI result values for a metric; aggregate business data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: orion.get_metric_insights
    object: Metric
    action: get_metric_insights
    description: "Get auto-detected metric insights showing significant changes and anomalies for a project."
    reference: https://docs.runorion.com/mcp/tools
    category: Operations
    risk: low
    business_impact: "Reads auto-detected anomaly and change insights for project KPIs; aggregate analytics output."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: orion.list_workflows
    object: Workflow
    action: list_workflows
    description: "List workflows (insight makers) for a project."
    reference: https://docs.runorion.com/mcp/tools
    category: Operations
    risk: low
    business_impact: "Lists the analysis workflows configured for a project; non-sensitive metadata read."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: orion.get_workflow
    object: Workflow
    action: get_workflow
    description: "Get workflow detail including notebook data, sources, and metric references."
    reference: https://docs.runorion.com/mcp/tools
    category: Operations
    risk: low
    business_impact: "Reads a workflow's notebook contents, data sources, and metric references; exposes internal analytics configuration."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: orion.get_workflow_results
    object: Workflow
    action: get_workflow_results
    description: "Get execution results for a workflow."
    reference: https://docs.runorion.com/mcp/tools
    category: Operations
    risk: low
    business_impact: "Reads workflow execution output; aggregate analytics results."
    compliance: []
    sod_concern: false
    confidence: high
