server_website: https://docs.runorion.com/
maintainer: hello@bygravity.com
reference: https://docs.runorion.com/mcp/tools
actions:
  # ---------- Data Access ----------
  - id: orion.ask_orion
    object: Conversation
    action: ask_orion
    description: "Send a natural language question to Orion and get an AI-powered data analysis response."
    reference: https://docs.runorion.com/mcp/tools
    category: Data Access
    risk: low
    business_impact: "Triggers an AI data-analysis run over connected business data; reversible and individually logged as a conversation."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: orion.create_conversation
    object: Conversation
    action: create_conversation
    description: "Start a new Orion conversation."
    reference: https://docs.runorion.com/mcp/tools
    category: Data Access
    risk: low
    business_impact: "Creates an empty conversation thread; benign and reversible."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: orion.get_conversation_history
    object: Conversation
    action: get_conversation_history
    description: "Read messages from an existing Orion conversation."
    reference: https://docs.runorion.com/mcp/tools
    category: Data Access
    risk: medium
    business_impact: "Reads prior conversation messages, which may contain personal data surfaced during analysis."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: orion.list_conversations
    object: Conversation
    action: list_conversations
    description: "List chat conversations for a user."
    reference: https://docs.runorion.com/mcp/tools
    category: Data Access
    risk: low
    business_impact: "Lists a user's conversation threads by title and metadata; low-sensitivity index read."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: orion.search_wiki
    object: WikiPage
    action: search_wiki
    description: "Search the Orion wiki/knowledge base."
    reference: https://docs.runorion.com/mcp/tools
    category: Data Access
    risk: medium
    business_impact: "Searches the organization knowledge base, which may surface personal data embedded in wiki content."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: orion.list_recommendations
    object: Recommendation
    action: list_recommendations
    description: "Get AI-generated recommendations for a project with suggested analysis prompts."
    reference: https://docs.runorion.com/mcp/tools
    category: Data Access
    risk: low
    business_impact: "Returns suggested analysis prompts for a project; no business-state change."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

