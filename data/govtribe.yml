schema_version: "1.1"
platform: govtribe
display_name: GovTribe
logo: https://govtribe.com/favicon.ico
source: langguard-editorial
updated: "2026-07"
# The GovTribe "for agents" MCP server is OAuth-gated and does not expose a
# token-less `tools/list`. GovTribe's agent docs publish the tool surface only
# as plain-language capability labels in a docs table — verbatim tool
# identifiers are not publicly available. Per the rubric's capability-form
# escape hatch, every entry below uses `id_form: capability` with the label
# carried verbatim in `description`. The manifest enumerates 100 tools; this
# file curates the 25 highest-value action surfaces (see report for the
# omitted set). When a real `tools/list` capture becomes available, refresh
# this file to `id_form: verbatim` with the actual identifier strings.
reference: https://govtribe.com/docs/govtribe-for-agents/tools
actions:
  # ---------- Identity & Access ----------

  # source: https://govtribe.com/docs/govtribe-for-agents/tools
  - id: govtribe.search_users
    object: User
    action: search_users
    id_form: capability
    description: "Search users"
    category: Identity & Access
    risk: medium
    business_impact: "Returns the workspace user directory including names and email addresses of the customer's own team members."
    compliance: [CCPA, GDPR, SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # ---------- Customer ----------

  # source: https://govtribe.com/docs/govtribe-for-agents/tools
  - id: govtribe.search_contacts
    object: Contact
    action: search_contacts
    id_form: capability
    description: "Search contacts"
    category: Customer
    risk: high
    business_impact: "Bulk-reads contact records with names, communication details, and linked organizations, exposing points-of-contact PII at scale."
    compliance: [CCPA, GDPR, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://govtribe.com/docs/govtribe-for-agents/tools
  - id: govtribe.search_vendors
