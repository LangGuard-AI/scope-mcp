# GovTribe's hosted MCP server (https://govtribe.com/mcp) is OAuth-gated: an
# anonymous tools/list returns 401, so the running server cannot be introspected.
# The vendor, however, publishes a complete, per-tool MCP catalog at
# https://govtribe.com/docs/govtribe-for-agents/tools/ where each tool has its
# own doc page. The verbatim tool identifiers are rendered in each tool page body
# in the server's native convention: Title_Case_With_Underscores
# (e.g. Create_Tag, Delete_Saved_Search, Add_To_Vector_Store, Test_Run_Automation).
# Acronym casing is NOT uniform and was verified per page: FCV, GAO, GSA, BLS,
# IDV/IDVs and GovTribe stay upper-case, while NAICS/NIGP/PSC/UNSPSC render as
# Naics/Nigp/Psc/Unspsc; the refresh tool renders verbatim as Refresh_Show_Document.
# Because these are exact identifier-level strings (not paraphrased labels), this
# file uses id_form: verbatim. The catalog exposes 85 tools; per the spec's
# write-surface-first trim (>25 tools), this file keeps EVERY state-changing /
# destructive write (full CRUD for pipelines, stages, pursuits, tasks, saved
# searches, tags, AI automations, durable memories, plus Test_Run_Automation,
# Add_To_Container, Add_To_Vector_Store) and ALL PII/file-bearing reads, then a
# representative slice of workspace + procurement reads. The ~45 routine
# public-record procurement search getters (NAICS/PSC/agency/award/IDV/grant/
# state-local/news/category lookups) and the read-only interactive display
# renderers (Show_*) were trimmed — they are read-only, public/non-sensitive, and
# near-duplicate; see report. Refresh to a live tools/list if GovTribe ever opens
# anonymous introspection.
reference: https://govtribe.com/docs/govtribe-for-agents/tools/
