    action: search_vendors
    id_form: capability
    description: "Search vendors"
    category: Customer
    risk: low
    business_impact: "Surfaces vendor profiles, identifiers, and certifications drawn from public procurement records."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

