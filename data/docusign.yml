schema_version: "1.1"
platform: docusign
display_name: DocuSign
source: langguard-editorial
updated: "2026-06"
partial_coverage_acknowledged: true
reference: https://developers.docusign.com/platform/mcp-server/
actions:
  # ---------- Identity & Access ----------
  - id: docusign.generateAccessToken
    object: AccessToken
    action: generateAccessToken
    description: "Interactive OAuth guided access-token generation flow that helps create Integration Keys, configure OAuth settings, and obtain access tokens."
    category: Identity & Access
    risk: critical
    business_impact: "Mints OAuth access tokens and Integration Keys that grant ongoing programmatic access to the DocuSign account; a credential-issuance and privilege-escalation event."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.getUsers
    object: User
    action: getUsers
    description: "Bulk-reads the account user directory, returning names, emails, and roles."
    reference: https://developers.docusign.com/docs/esign-rest-api/reference/users/users/list/
    category: Identity & Access
    risk: critical
    business_impact: "Bulk-reads the account user directory, returning names, emails, and roles for every user in one call; an enumerable-PII exfiltration surface."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.getUser
    object: User
    action: getUser
    description: "Reads one user's profile and permission settings."
    reference: https://developers.docusign.com/docs/esign-rest-api/reference/users/users/get/
    category: Identity & Access
    risk: medium
    business_impact: "Reads a single account user's profile and permission settings, exposing employee PII."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.getUserInfo
    object: User
    action: getUserInfo
    description: "Reads the authenticated user's profile, including name, email, and account/organization identifiers."
    reference: https://developers.docusign.com/platform/auth/reference/user-info/
    category: Identity & Access
    risk: medium
    business_impact: "Reads the authenticated user's full profile including name, email, and account/organization identifiers."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Agreements & Envelopes ----------
  - id: docusign.createEnvelope
    object: Envelope
    action: createEnvelope
    description: "Creates and sends a new envelope from a template or supplied documents."
    reference: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/create/
    category: Agreements
    risk: medium
    business_impact: "Creates and sends a legally binding e-signature agreement to named recipients; reversible only by voiding before completion."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.updateEnvelope
    object: Envelope
    action: updateEnvelope
    description: "Supports sending draft envelopes, voiding envelopes, modifying email content, purge operations, and workflow management."
    reference: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/update/
    category: Agreements
    risk: critical
    business_impact: "Multi-mode envelope mutation that includes voiding an in-flight agreement and purging its documents; purge irreversibly destroys signed-agreement data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.updateEnvelopeRecipients
    object: Recipient
    action: updateEnvelopeRecipients
    description: "Adds, updates, or removes recipients on an existing envelope."
    reference: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/enveloperecipients/update/
    category: Agreements
    risk: medium
    business_impact: "Adds, updates, or removes signers on a binding agreement; unilateral recipient removal or change bypasses the intended approval chain."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.sendReminder
    object: Envelope
    action: sendReminder
    description: "Sends reminder notifications to an envelope's pending recipients."
    reference: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/update/
    category: Agreements
    risk: low
    business_impact: "Emails signing reminders to an envelope's pending recipients; exposes recipient email addresses but makes no state change to the agreement."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.getEnvelopes
    object: Envelope
    action: getEnvelopes
    description: "Bulk-reads agreements account-wide using filters such as date, ID, or status."
    reference: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/liststatuschanges/
    category: Agreements
    risk: critical
    business_impact: "Bulk-reads agreements across the account; a single call can surface signer PII and contract metadata at scale, enabling mass contract exfiltration."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.getEnvelope
    object: Envelope
    action: getEnvelope
    description: "Reads the status and metadata of a single envelope, including signer identities."
    reference: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/get/
    category: Agreements
    risk: medium
    business_impact: "Reads a single agreement's status and metadata, which can include signer identities and contract context."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.listRecipients
    object: Recipient
    action: listRecipients
    description: "Reads recipient status and entered field (tab) values for a specific envelope."
    reference: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/enveloperecipients/list/
    category: Agreements
    risk: medium
    business_impact: "Reads recipient identities and entered field (tab) values for an envelope, exposing signer PII."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.getAllAgreements
    object: Agreement
    action: getAllAgreements
    description: "Bulk-reads every agreement in the account (Navigator / Agreement Manager)."
    reference: https://developers.docusign.com/docs/agreement-manager-api/reference/agreementmanager/agreements/getagreementslist/
    category: Agreements
    risk: critical
    business_impact: "Bulk-reads every agreement in the account; a single call can return contract content and party PII across the entire organization, a large-scale exfiltration surface."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.getAgreementDetails
    object: Agreement
    action: getAgreementDetails
    description: "Reads the full content and extracted terms of one agreement (Navigator)."
    reference: https://developers.docusign.com/docs/agreement-manager-api/reference/agreementmanager/agreements/getagreement/
    category: Agreements
    risk: medium
    business_impact: "Reads the full content and extracted terms of one agreement, which routinely includes party PII and confidential contract data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

