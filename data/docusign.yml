    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.getWorkflowTriggerRequirements
    object: Workflow
    action: getWorkflowTriggerRequirements
    description: "Reads the inputs needed to start a workflow; call before triggerWorkflow."
    reference: https://developers.docusign.com/docs/workflow-builder-api/reference/workflowbuilder/workflows/getworkflowtriggerrequirements/
