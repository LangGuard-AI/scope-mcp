    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.cloneDVEnabledTemplates
    object: Template
    action: cloneDVEnabledTemplates
    description: "Clones existing templates into Data Verification-enabled copies while preserving the originals."
    category: Templates
    risk: medium
    business_impact: "Creates Data Verification-enabled copies of templates; additive change that preserves the originals."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Workflows ----------
  - id: docusign.triggerWorkflow
    object: Workflow
    action: triggerWorkflow
    description: "Starts a new Workflow Builder (Maestro) workflow instance."
    reference: https://developers.docusign.com/docs/workflow-builder-api/reference/workflowbuilder/workflows/triggerworkflow/
    category: Workflows
    risk: medium
    business_impact: "Launches an automated agreement workflow that can generate and dispatch binding documents to recipients without further review."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.cancelWorkflowInstance
    object: Workflow
    action: cancelWorkflowInstance
    description: "Cancels a running workflow instance."
    reference: https://developers.docusign.com/docs/workflow-builder-api/reference/workflowbuilder/workflowinstancemanagement/cancelworkflowinstance/
    category: Workflows
    risk: medium
    business_impact: "Hard-stops a running agreement workflow, terminating pending automated signature or routing steps; the instance is not resumable."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.pauseNewWorkflowInstances
    object: Workflow
    action: pauseNewWorkflowInstances
    description: "Pauses new instances from being created for a workflow."
    reference: https://developers.docusign.com/docs/workflow-builder-api/reference/workflowbuilder/workflows/pausenewworkflowinstances/
    category: Workflows
    risk: medium
    business_impact: "Blocks a workflow from spawning new instances; reversible operational change that can stall automated agreement processing."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.resumeWorkflow
    object: Workflow
    action: resumeWorkflow
    description: "Resumes a paused workflow to allow new instances."
    reference: https://developers.docusign.com/docs/workflow-builder-api/reference/workflowbuilder/workflows/resumepausedworkflow/
    category: Workflows
    risk: low
    business_impact: "Re-enables a paused workflow so it can resume creating instances; reversible operational change."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.getWorkflowInstance
    object: Workflow
    action: getWorkflowInstance
    description: "Reads the state and step history of one workflow instance."
    reference: https://developers.docusign.com/docs/workflow-builder-api/reference/workflowbuilder/workflowinstancemanagement/getworkflowinstance/
    category: Workflows
    risk: low
    business_impact: "Reads the state and step history of one workflow instance; may surface routing and recipient context."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.getWorkflowInstancesList
    object: Workflow
    action: getWorkflowInstancesList
    description: "Lists all instances of a workflow with their states."
    reference: https://developers.docusign.com/docs/workflow-builder-api/reference/workflowbuilder/workflowinstancemanagement/getworkflowinstanceslist/
    category: Workflows
    risk: low
    business_impact: "Lists all instances of a workflow with their states; may surface recipient and routing context across many agreements."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: docusign.getWorkflowsList
    object: Workflow
    action: getWorkflowsList
    description: "Reads the account's configured Maestro workflow definitions."
