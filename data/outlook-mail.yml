  # source: https://learn.microsoft.com/en-us/microsoft-copilot-studio/mcp-mail-work-iq
  - id: outlook-mail.mcp_MailTools_graph_mail_searchMessages
    object: Message
    action: mcp_MailTools_graph_mail_searchMessages
    category: Messaging
    risk: high
    business_impact: "Runs KQL-style search across the mailbox, surfacing PII, credentials, contracts, and material non-public information from any correspondence into agent context."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

