    category: Issues
    risk: low
    business_impact: "Adds a new comment to an issue or overwrites an existing one when a comment ID is supplied; reversible and visible to all issue watchers."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
