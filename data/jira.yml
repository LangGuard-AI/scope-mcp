actions:
  # ---------- Identity & Access ----------

  # source: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/supported-tools/
  - id: jira.lookupJiraAccountId
    object: User
    action: lookupJiraAccountId
    description: "Find Jira user account IDs by name or email."
    category: Identity & Access
    risk: medium
    business_impact: "Resolves user names or email addresses to Jira account IDs, exposing directory-level personal data and enabling enumeration of individuals in the workspace."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Data Access ----------

  # source: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/supported-tools/
  - id: jira.searchJiraIssuesUsingJql
    object: Issue
    action: searchJiraIssuesUsingJql
    description: "Search Jira issues using a JQL query"
    category: Data Access
    risk: medium
    business_impact: "Runs an arbitrary JQL query across every issue the caller can see, potentially returning large result sets containing reporter, assignee, and comment personal data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Issues ----------

  # source: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/supported-tools/
  - id: jira.createJiraIssue
    object: Issue
    action: createJiraIssue
    description: "Create a link between two Jira issues."
    category: Issues
    risk: low
    business_impact: "Creates a new Jira issue or issue link, adding a tracked work item visible to the project's members."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/supported-tools/
  - id: jira.editJiraIssue
    object: Issue
    action: editJiraIssue
    description: "Update fields on an existing Jira issue."
    category: Issues
    risk: medium
    business_impact: "Updates fields on an existing issue, changing tracked work-item state that other users and automation rules depend on."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/supported-tools/
  - id: jira.transitionJiraIssue
    object: Issue
    action: transitionJiraIssue
    description: "Perform a workflow transition on a Jira issue."
    category: Issues
    risk: medium
    business_impact: "Advances an issue through a workflow transition, changing its status and potentially triggering notifications, SLAs, or automation rules."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/supported-tools/
  - id: jira.addCommentToJiraIssue
