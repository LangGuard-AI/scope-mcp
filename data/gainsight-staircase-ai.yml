# CAPABILITY-FORM file. Staircase AI's MCP server (https://mcp.staircase.ai/mcp)
# is fully OAuth-gated: live introspection on 2026-06 returned HTTP 401
# `invalid_token` on `initialize`/`tools/list`, the OAuth metadata advertises only
# generic scopes (openid/email/profile/offline_access) with no tool-level scopes,
# and every anonymous catalog probe (/tools, /mcp/tools, /.well-known/mcp,
# /openapi.json) 404s. The vendor publishes NO verbatim tool identifiers anywhere
# reachable — the MCP docs, the Security & Compliance page, and the use-case posts
# describe the surface only in plain-language prose. Per the curator spec's Step 3
# capability-form fallback, the entries below are NOT a vendor-enumerated tool
# list: each is a distinct read surface carved from Staircase AI's published
# capability / use-case / example-query descriptions, with ids slugified from those
# descriptions and id_form `capability`. Matching is intent-level, not
# identifier-level, so confidence is capped at medium; surfaces whose exact label
# could not be confirmed verbatim are marked low. The Anthropic connector page
# classifies this connector as "Read" (read-only), corroborated by every vendor
# source — all entries are read/query surfaces, no writes.
#
# REGIME TAGGING (repaired 2026-06): privacy regimes are applied ONLY to the
# surfaces that genuinely return identifiable-individual personal data — the named
# stakeholder directory, the content of customer communications/feedback, and the
# cross-conversation engagement aggregation. Account- and company-level aggregate
# intelligence (health, risk, sentiment, expansion, competitor mentions, portfolio
# prioritization) is left untagged for privacy, mirroring how the apollo comparator
# leaves company-level and analytics surfaces at []. This drops the uniform
# 8-regimes-on-100%-of-actions pattern to 33% privacy coverage, under the project's
# 60% ceiling. Vendor-stated compliance posture: SOC 2 Type II, GDPR, CCPA;
# per-user RBAC, queries scoped to the authenticated user's organization.
reference: https://support.gainsight.com/Staircase_AI/Staircase_AI_Features/Connect_Staircase_AI_to_LLMs_Using_MCP
