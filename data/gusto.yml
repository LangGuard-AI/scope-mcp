    business_impact: "Reads compensation history for a job; exposes identifiable-employee pay PII and financial data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: gusto.get_compensation
