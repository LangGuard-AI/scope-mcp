schema_version: "1.1"
platform: gusto
display_name: Gusto
source: langguard-editorial
updated: "2026-06"
reference: https://docs.gusto.com/app-integrations/docs/mcp
# Tool ids are verbatim from the Gusto MCP docs (https://docs.gusto.com/app-integrations/docs/mcp).
# The Gusto MCP server (https://mcp.api.gusto.com) is READ-ONLY: 36 list_*/get_* tools.
# The vendor docs state explicitly that the server "can retrieve and analyze your data but
# cannot: Execute payroll runs, Transfer money, Create, modify, or delete employees, Change
# compensation or benefits, Modify company settings."
# NOTE: `run_payroll` is NOT an MCP tool. It appears only in the changelog as a "Widgetized
# run_payroll tool" — a UI widget surfaced via the /anthropic endpoint, never registered in
# tools/list. It is deliberately EXCLUDED here; do not re-add it as an action.
# The server is OAuth-gated, so live tools/list introspection returned 401; the 36 tool names
# below are taken verbatim from the authoritative vendor MCP documentation (confirmed against
# the raw docs HTML).
actions:
  # ---------- Payroll & Compensation (bulk financial PII) ----------
  - id: gusto.list_company_payrolls
    object: Payroll
    action: list_company_payrolls
    description: "List all payroll runs with filtering (filters by pay period dates, not check dates)."
    category: Financial
    risk: high
    business_impact: "Reads the company's full payroll-run history including per-employee wage amounts; bulk extraction of compensation PII and financial data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: gusto.get_payroll
    object: Payroll
    action: get_payroll
    description: "Get detailed information about a specific payroll."
    category: Financial
    risk: medium
    business_impact: "Reads a single payroll run's per-employee wage detail; exposes compensation PII and financial data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: gusto.list_job_compensations
    object: Compensation
    action: list_job_compensations
    description: "Get compensation history for a job."
    category: Financial
