# Read AI's remote MCP server (https://api.read.ai/mcp) is OAuth 2.1-gated, so
# `tools/list` could not be captured without a tenant token. The vendor support
# docs publish the tool surface as two capability labels, so every entry below
# uses `id_form: capability`. Refresh to `id_form: verbatim` when a real
# `tools/list` capture becomes available.
actions:
  # ---------- Data Access ----------

  # source: https://support.read.ai/hc/en-us/articles/49381158409491-MCP-Server
  - id: read-ai.get_meeting_by_id
    object: Meeting
    action: get_meeting_by_id
    id_form: capability
    description: "Get Meeting by ID"
    category: Data Access
    risk: medium
    business_impact: "Returns one meeting's full transcript with speaker identification, participant attendance, summaries, action items, engagement metrics, and an MP4 recording download URL — everything said in a private conversation becomes agent-readable."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://support.read.ai/hc/en-us/articles/49381158409491-MCP-Server
  - id: read-ai.list_meetings
    object: Meeting
    action: list_meetings
    id_form: capability
    description: "List Meetings"
    category: Data Access
    risk: medium
    business_impact: "Pages through the account's entire meeting history with date filtering, returning transcripts, participants, and recording links for every meeting — a paginated route to bulk conversation data, not just a directory listing."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial
