    access_methods: [REST, MCP]

  - id: pagerduty.list_status_page_severities
    object: StatusPage
    action: list_status_page_severities
    description: "List Severities for a Status Page by Status Page ID."
    category: Operations
    risk: low
    business_impact: "Reads the configured severity levels for a status page; no state change."
    compliance: []
