    risk: low
    business_impact: "Reads change events scoped to one service; no state change."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: pagerduty.list_incident_change_events
    object: ChangeEvent
    action: list_incident_change_events
    description: "List change events related to a specific incident."
    category: Operations
    risk: low
    business_impact: "Reads change events correlated with an incident; no state change."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Status Pages ----------
  - id: pagerduty.create_status_page_post
    object: StatusPagePost
    action: create_status_page_post
    description: "Create a Post for a Status Page by Status Page ID."
    category: Operations
    risk: high
    business_impact: "Publishes a customer-facing status post; externally visible to end users and can signal an outage to the public regardless of intent."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: pagerduty.create_status_page_post_update
    object: StatusPagePost
    action: create_status_page_post_update
    description: "Create a Post Update for a Post by Post ID."
    category: Operations
    risk: medium
