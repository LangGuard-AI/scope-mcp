schema_version: "1.1"
platform: bitly
display_name: Bitly
source: langguard-editorial
updated: "2026-06"
reference: https://dev.bitly.com/bitly-mcp/using-the-bitly-mcp-server/mcp-tools-reference/
actions:
  # ---------- Link Management ----------
  - id: bitly.delete_short_link
    object: ShortLink
    action: delete_short_link
    description: "Permanently delete a short link (unedited links only)."
    category: Link Management
    risk: critical
    business_impact: "Permanently destroys a short link; any QR code, campaign, or printed material pointing at it breaks with no recovery."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: bitly.create_short_link
    object: ShortLink
    action: create_short_link
    description: "Create a compact, shareable link with advanced customization options (custom domains, tags, title, keyword)."
    category: Link Management
    risk: medium
    business_impact: "Creates a publicly resolvable redirect; an attacker-controlled destination could be used for phishing under a trusted branded domain."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: bitly.create_short_link_with_qr
    object: ShortLink
    action: create_short_link_with_qr
    description: "Create a short link and QR Code in a single step."
    category: Link Management
    risk: medium
    business_impact: "Creates a publicly resolvable redirect plus a scannable QR code in one call; same phishing-surface concern as a standalone short link."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: bitly.update_short_link
    object: ShortLink
    action: update_short_link
    description: "Update destination URL, title, archive state, tags, or deeplinks for a short link."
    category: Link Management
    risk: medium
    business_impact: "Re-points an already-distributed short link to a new destination; live traffic on the existing link is silently redirected."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: bitly.expand
    object: ShortLink
    action: expand
    description: "Retrieve the original long URL and basic metadata for a short link."
    category: Link Management
    risk: low
    business_impact: "Resolves a short link to its destination URL; read-only and non-sensitive."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: bitly.get_short_link_details
    object: ShortLink
    action: get_short_link_details
    description: "Get complete short link details (title, destination, created, creator, tags, custom domains)."
    category: Link Management
    risk: low
    business_impact: "Reads metadata for a single short link, including the creating user; minimal personal data exposure."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Bulk Operations ----------
  - id: bitly.bulk_upload_validate
    object: BulkUpload
    action: bulk_upload_validate
    description: "Validate a bulk upload request and obtain a signed URL for uploading a link file."
    category: Link Management
    risk: medium
    business_impact: "Initiates a mass link-creation job and issues a signed upload URL; precursor to bulk modification of the link inventory."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: bitly.bulk_upload_file
    object: BulkUpload
    action: bulk_upload_file
    description: "Upload a file to the signed URL returned by bulk_upload_validate."
    category: Link Management
    risk: medium
    business_impact: "Commits a bulk batch of short links in one operation; mass write to the link inventory that is not individually reviewed."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

