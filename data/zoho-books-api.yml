  # source: https://claude.com/connectors/zoho-books
  - id: zoho-books-api.create_customer_payment
    object: CustomerPayment
    action: create_customer_payment
    description: "Records a payment received from a customer against one or more invoices."
    category: Financial
    risk: critical
    business_impact: "Posts cash receipt to the ledger and settles the referenced invoices, moving revenue out of accounts receivable without a second approver."
    compliance: [SOX, COSO, PCI]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/zoho-books
  - id: zoho-books-api.update_customer_payment
    object: CustomerPayment
    action: update_customer_payment
    description: "Modifies an existing customer payment record."
    category: Financial
    risk: high
    business_impact: "Alters a recorded cash receipt — amount, date, or invoice allocation — so bank reconciliation and AR aging no longer match what was originally booked."
    compliance: [SOX, COSO, PCI]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/zoho-books
  - id: zoho-books-api.delete_customer_payment
    object: CustomerPayment
    action: delete_customer_payment
    description: "Permanently deletes a customer payment record."
    category: Financial
    risk: critical
    business_impact: "Erases a cash receipt from the books, reopening settled invoices and destroying the audit trail that ties bank deposits to customer accounts."
    compliance: [SOX, COSO, PCI, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

