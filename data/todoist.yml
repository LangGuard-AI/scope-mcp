reference: https://github.com/Doist/todoist-mcp
actions:
  # ---------- Data Access ----------
  - id: todoist.delete-object
    object: "*"
    action: delete-object
    description: "Deletes an entity (project, section, task, comment, label, filter, goal, reminder, or location_reminder) by its ID."
    category: Data Access
    risk: high
    business_impact: "Single-actor destruction of any entity type with no documented soft-delete or recovery window; the highest-blast-radius tool in the connector."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: todoist.fetch-object
    object: "*"
    action: fetch-object
    description: "Fetches a single object by its type and ID."
    category: Data Access
    risk: low
    business_impact: "Reads one object by ID; may surface personal data if the object is a comment, collaborator, or assignment."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: todoist.fetch
    object: Object
    action: fetch
    description: "OpenAI-compatibility tool that fetches a record by ID."
    category: Data Access
    risk: low
    business_impact: "Reads a single record by ID; may surface personal data depending on the record type."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: todoist.search
    object: Object
    action: search
    description: "OpenAI-compatibility tool that searches across the account for matching records."
    category: Data Access
    risk: low
    business_impact: "Searches account-wide content; may return personal data contained in tasks, comments, or collaborator records."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

