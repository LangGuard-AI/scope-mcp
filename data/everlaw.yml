  - id: everlaw.GetProjectSearchResult
    object: Document
    action: GetProjectSearchResult
    category: Data Access
    risk: high
    business_impact: "Pages through litigation documents matched by a search, returning Bates numbers, review URLs, document text, download links, and AI-extracted values across the matched set — bulk access to potentially privileged, PII-laden discovery material."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

