actions:
  # ---------- Code & Release ----------

  # source: https://mcp.mermaid.ai/mcp
  - id: mermaid-chart.push_file
    object: File
    action: push_file
    description: "Create or update a single file on a given branch in a GitHub repository."
    category: Code & Release
    risk: high
    business_impact: "Writes arbitrary file content straight onto a named branch — including the default branch — so a single agent call lands code in the repository with no pull request or reviewer in the loop."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.mermaid.ai/mcp
  - id: mermaid-chart.create_pr
    object: PullRequest
    action: create_pr
    description: "Create a new branch and commit, then open a pull request in the same repository."
    category: Code & Release
    risk: medium
    business_impact: "Creates a branch, commits file changes, and opens a pull request; the change stays gated behind review but consumes reviewer attention and can be used to smuggle edits into a busy repo."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.mermaid.ai/mcp
  - id: mermaid-chart.get_pull_comments
    object: PullRequestComment
    action: get_pull_comments
    description: "Get all pull request comments: issue/PR thread comments and inline review comments."
    category: Code & Release
    risk: low
    business_impact: "Returns every thread and inline review comment on a pull request, exposing internal review discussion from private repositories to the agent context."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.mermaid.ai/mcp
  - id: mermaid-chart.list_pulls
    object: PullRequest
    action: list_pulls
    description: "List pull requests for a GitHub repository."
    category: Code & Release
    risk: low
    business_impact: "Enumerates open and closed pull requests for a repository, revealing in-flight work and branch naming across private projects."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

