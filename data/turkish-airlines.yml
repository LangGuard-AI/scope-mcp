schema_version: "1.2"
platform: turkish-airlines
display_name: Turkish Airlines
source: langguard-editorial
updated: "2026-06"
server_version: "2026-06"
server_website: https://mcp.turkishtechlab.com/
maintainer: digitallab@thy.com
reference: https://mcp.turkishtechlab.com/
# NOTE: The official Turkish Airlines connector's MCP server
# (https://mcp.turkishtechlab.com/mcp) is OAuth-gated — an anonymous tools/list
# returns HTTP 401 with `WWW-Authenticate: Bearer realm="OAuth"`, live
# introspection fails with exit 2 (auth), and the /tools path is Cloudflare-403
# blocked, so no verbatim MCP identifiers are anonymously reachable. The vendor
# publishes only plain-language capability labels on mcp.turkishtechlab.com
# (e.g. "Search Flights", "Get Booking Details", "Get Current User Details").
# These are recorded via the capability-form fallback (id_form: capability):
# ids are intent-level snake_case slugs, NOT verbatim MCP identifiers, so every
# entry is capped at confidence: medium. The `description` field carries the
# vendor's verbatim label. The vendor page and blog enumerate exactly 13 labels;
# remote-mcp and some search summaries cite "14 tools", so one tool may exist
# behind the OAuth gate that is not represented here — the captured surface may
# be incomplete by one tool.
actions:
  # ---------- Customer (member & booking PII) ----------
  - id: turkish-airlines.get_booking_details
    object: Booking
    action: get_booking_details
    id_form: capability
    description: "Get Booking Details"
    reference: https://mcp.turkishtechlab.com/
    category: Customer
    risk: medium
    business_impact: "Retrieves a passenger's full booking and itinerary from a PNR plus surname; exposes traveler personal data for a single reservation."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: turkish-airlines.get_check_in_booking_details
    object: Booking
    action: get_check_in_booking_details
    id_form: capability
    description: "Get Check-in Booking Details"
    reference: https://mcp.turkishtechlab.com/
    category: Customer
    risk: medium
    business_impact: "Returns check-in details for a check-in-eligible booking; exposes traveler personal data including flight and passenger identity for a single reservation."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: turkish-airlines.get_booking_baggage_allowance
    object: Booking
    action: get_booking_baggage_allowance
    id_form: capability
    description: "Get Booking Baggage Allowance"
    reference: https://mcp.turkishtechlab.com/
    category: Customer
    risk: medium
    business_impact: "Reads baggage allowance tied to a specific booking; the underlying booking lookup exposes single-reservation traveler personal data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: low
    access_methods: [REST, MCP]

  - id: turkish-airlines.get_current_user_details
    object: Member
    action: get_current_user_details
    id_form: capability
    description: "Get Current User Details"
    reference: https://mcp.turkishtechlab.com/
    category: Customer
    risk: medium
    business_impact: "Fetches the authenticated Miles&Smiles member's profile, miles balance, and identity information; exposes account-holder personal data (potentially passport/national-ID for international travel)."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: turkish-airlines.get_member_flights
    object: Member
    action: get_member_flights
    id_form: capability
    description: "Get Member Flights"
    reference: https://mcp.turkishtechlab.com/
    category: Customer
    risk: medium
    business_impact: "Returns the member's upcoming and past flight history; exposes travel-history personal data for the authenticated account holder."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: turkish-airlines.get_expiring_miles
    object: Member
    action: get_expiring_miles
    id_form: capability
    description: "Get Expiring Miles"
    reference: https://mcp.turkishtechlab.com/
    category: Customer
    risk: medium
    business_impact: "Calculates and returns the member's expiring loyalty miles; exposes loyalty-balance data tied to the authenticated account holder."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

