  - id: windsor-ai.execute_action
    object: "*"
    action: execute_action
    description: "Execute a write action against a specific connector account (e.g. pause/enable a campaign, set a budget)."
    category: Operations
    risk: critical
    business_impact: "Writes directly into a connected ad or marketing account, so one call can pause live campaigns or raise a budget and commit real media spend that cannot be clawed back."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

