actions:
  # ---------- Service ----------

  # source: https://claude.com/connectors/unthread
  - id: unthread.list_conversations
    object: Conversation
    action: list_conversations
    description: "Lists support conversations (tickets) in the connected Unthread workspace."
    category: Service
    risk: medium
    business_impact: "Enumerates customer support tickets across the workspace, surfacing requester identities and message content in bulk to the calling agent."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/unthread
  - id: unthread.get_conversation_by_id
    object: Conversation
    action: get_conversation_by_id
    description: "Retrieves a single support conversation and its thread content by id."
    category: Service
    risk: medium
    business_impact: "Returns the full message thread of one support ticket, including customer-authored content that routinely carries contact details and account identifiers."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.unthread.io/docs/unthread-mcp
  - id: unthread.update_conversation
    object: Conversation
    action: update_conversation
    description: "Write-capable MCP tool for updating a conversation."
    category: Service
    risk: medium
    business_impact: "Mutates a live support ticket — status, assignment, and field values — changing what the support team and the customer see as the current state of the case."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.unthread.io/docs/unthread-mcp
  - id: unthread.create_conversation_comment
    object: Conversation
    action: create_conversation_comment
    description: "Write-capable MCP tool for creating a conversation comment; supports Slack block format."
    category: Service
    risk: medium
    business_impact: "Posts a comment into a live support thread where customers and agents read it, so an agent-authored reply can commit the company to a position on an open case."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

