updated: "2026-07"
# The Insider One MCP server publishes only plain-language capability labels
# ("Get Email Campaign Analytics (v2)", "List WhatsApp Campaigns") in its vendor
# docs — not verbatim `tools/list` identifiers — so every entry uses
# `id_form: capability` with the label verbatim in `description` and a slugged id.
# Per the vendor docs the entire surface is read-only: "MCP does not allow
# campaigns to be launched, configurations to be changed, or customer data to be
# modified." All actions are aggregate campaign/channel performance analytics,
# so no action exposes identifiable individuals and `compliance` stays empty.
# When Insider publishes a real `tools/list`, refresh to `id_form: verbatim`.
reference: https://academy.insiderone.com/docs/insider-one-mcp-functions
actions:
