    object: EmailCampaign
    action: get_email_campaign_list_v2
    id_form: capability
    description: "Get Email Campaign List (v2)"
    category: Data Access
    risk: low
    business_impact: "Lists the partner account's email campaigns; read-only enumeration of campaign metadata."
