    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.update_segment
    object: Segment
    action: update_segment
    description: "Update segment name."
    category: Customer
    risk: low
    business_impact: "Renames a segment; metadata change with no PII impact."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.delete_segment
    object: Segment
    action: delete_segment
    description: "Delete a segment."
    category: Customer
    risk: low
    business_impact: "Deletes a segment definition; subscribers are unaffected and only the saved filter is removed."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.list_segments
    object: Segment
    action: list_segments
    description: "List all segments."
    category: Customer
