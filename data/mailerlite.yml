    access_methods: [REST, MCP]

  # ---------- Campaign Management ----------
  - id: mailerlite.create_campaign
    object: Campaign
    action: create_campaign
    description: "Create a new email campaign (regular, ab, resend types)."
    category: Messaging
    risk: medium
    business_impact: "Drafts an email campaign (name, subject, sender, content) with no recipient list attached; reversible content staging that is the precursor to a send carrying consent obligations (CAN-SPAM, TCPA, GDPR direct-marketing rules)."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: mailerlite.schedule_campaign
    object: Campaign
    action: schedule_campaign
    description: "Schedule a campaign to be sent."
    category: Messaging
    risk: high
    business_impact: "Commits a campaign to be delivered to subscribers at a set time; triggers outbound mass marketing email subject to consent and unsubscribe obligations (CAN-SPAM, TCPA, GDPR direct-marketing rules)."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: mailerlite.cancel_campaign
    object: Campaign
    action: cancel_campaign
    description: "Cancel a scheduled campaign."
    category: Messaging
    risk: low
    business_impact: "Cancels a campaign before it sends; prevents an outbound send and removes no subscriber data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.update_campaign
    object: Campaign
    action: update_campaign
    description: "Update campaign details (name, subject, from, content)."
    category: Messaging
    risk: medium
    business_impact: "Edits the subject, sender, or body of a draft campaign; changes what subscribers will receive when it sends."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.delete_campaign
    object: Campaign
    action: delete_campaign
    description: "Delete a campaign."
    category: Messaging
    risk: medium
    business_impact: "Deletes a campaign and its associated reporting; removes send history and analytics for that campaign."
    compliance: [SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: mailerlite.get_campaign_subscribers
    object: Campaign
    action: get_campaign_subscribers
    description: "Get subscribers who received a campaign with filters."
    category: Messaging
    risk: high
    business_impact: "Bulk read of the recipient list for a campaign; enumerates identifiable subscribers and their delivery status at scale."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.get_campaign
    object: Campaign
    action: get_campaign
    description: "Get specific campaign details."
    category: Messaging
    risk: low
    business_impact: "Returns one campaign's configuration and aggregate stats; content and metadata with no individual-level PII."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.list_campaigns
    object: Campaign
    action: list_campaigns
    description: "List all campaigns with filtering by status and type."
    category: Messaging
    risk: low
    business_impact: "Lists campaigns with status and type; names and aggregate metadata with no individual-level PII."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

