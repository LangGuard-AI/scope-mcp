schema_version: "1.2"
platform: mailerlite
display_name: MailerLite
source: langguard-editorial
updated: "2026-06"
server_version: "2026-06"
server_website: https://developers.mailerlite.com/mcp/
maintainer: https://www.mailerlite.com/support
reference: https://developers.mailerlite.com/mcp/
actions:
  # ---------- Subscriber Management ----------
  - id: mailerlite.add_subscriber
    object: Subscriber
    action: add_subscriber
    description: "Add a new subscriber or update existing (supports email, name, fields, groups)."
    category: Customer
    risk: medium
    business_impact: "Writes a subscriber's email, name, and custom fields into the account; reversible but creates an identifiable marketing record."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.update_subscriber
    object: Subscriber
    action: update_subscriber
    description: "Update subscriber information (non-destructive)."
    category: Customer
    risk: medium
    business_impact: "Modifies a single subscriber's profile fields and attributes; non-destructive and reversible."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.delete_subscriber
    object: Subscriber
    action: delete_subscriber
    description: "Delete a subscriber (keeps info for re-subscription)."
    category: Customer
    risk: medium
    business_impact: "Removes a subscriber from the active list but retains their record for re-subscription; reversible."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.forget_subscriber
    object: Subscriber
    action: forget_subscriber
    description: "GDPR-compliant complete removal of subscriber data."
    category: Customer
    risk: high
    business_impact: "Irreversibly erases all stored data for a subscriber to satisfy a right-to-be-forgotten request; cannot be undone for that record."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: mailerlite.list_subscribers
    object: Subscriber
    action: list_subscribers
    description: "List all subscribers with filtering by status (active, unsubscribed, unconfirmed, bounced, junk)."
    category: Customer
    risk: high
    business_impact: "Bulk read of the entire subscriber directory; enumerates identifiable contacts by email and status at scale."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.get_subscriber
    object: Subscriber
    action: get_subscriber
    description: "Get subscriber info by ID or email."
    category: Customer
    risk: medium
    business_impact: "Returns one subscriber's full profile, including email and custom field values."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.get_subscriber_activity
    object: Subscriber
    action: get_subscriber_activity
    description: "Get activity history for a subscriber."
    category: Customer
    risk: medium
    business_impact: "Returns one subscriber's engagement history (opens, clicks, sends); behavioral PII tied to an identifiable person."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.get_subscriber_count
    object: Subscriber
    action: get_subscriber_count
    description: "Get total count of subscribers."
    category: Customer
    risk: low
    business_impact: "Returns an aggregate subscriber count; a single number with no individual-level PII."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.get_single_import
    object: Import
    action: get_single_import
    description: "Get details of a single import."
    category: Customer
    risk: low
    business_impact: "Returns status and metadata for one import job; counts and outcomes rather than the imported records themselves."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Group Management ----------
  - id: mailerlite.import_subscribers_to_group
    object: Group
    action: import_subscribers_to_group
    description: "Bulk import subscribers to a group."
    category: Customer
    risk: high
    business_impact: "Bulk write of subscriber PII into the account in a single call; ingests an identifiable contact list at scale."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.get_group_subscribers
    object: Group
    action: get_group_subscribers
    description: "Get subscribers in a group."
    category: Customer
    risk: high
    business_impact: "Bulk read of every member of a group; enumerates identifiable subscribers by email at scale."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.assign_subscriber_to_group
    object: Group
    action: assign_subscriber_to_group
    description: "Add a subscriber to a group."
    category: Customer
    risk: low
    business_impact: "Adds one existing subscriber to a group; reversible segmentation change with no new PII created."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.unassign_subscriber_from_group
    object: Group
    action: unassign_subscriber_from_group
    description: "Remove a subscriber from a group."
    category: Customer
    risk: low
    business_impact: "Removes one subscriber from a group; reversible segmentation change."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.create_group
    object: Group
    action: create_group
    description: "Create a new subscriber group."
    category: Customer
    risk: low
    business_impact: "Creates an empty subscriber group; organizational container with no PII."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.update_group
    object: Group
    action: update_group
    description: "Update group name."
    category: Customer
    risk: low
    business_impact: "Renames a subscriber group; metadata change with no PII impact."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.delete_group
    object: Group
    action: delete_group
    description: "Delete a group."
    category: Customer
    risk: medium
    business_impact: "Deletes a subscriber group, dropping its segmentation; subscribers themselves are retained but list organization is lost."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: mailerlite.list_groups
    object: Group
    action: list_groups
    description: "List all subscriber groups."
    category: Customer
    risk: low
    business_impact: "Lists subscriber groups; names and counts with no individual-level PII."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Segment Management ----------
  - id: mailerlite.get_subscribers_in_segment
    object: Segment
    action: get_subscribers_in_segment
    description: "Get subscribers in a segment with status filtering."
    category: Customer
    risk: high
    business_impact: "Bulk read of every subscriber matching a segment; enumerates identifiable contacts by email at scale."
