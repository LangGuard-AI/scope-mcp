  - id: mailerlite.create_automation
    object: Automation
    action: create_automation
    description: "Create a draft automation."
    category: Operations
    risk: medium
    business_impact: "Creates a draft automation workflow; reversible while drafted, but defines logic that will send mail to subscribers when activated."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: mailerlite.delete_automation
    object: Automation
    action: delete_automation
    description: "Delete an automation."
    category: Operations
    risk: medium
    business_impact: "Deletes an automation workflow and its run history; reporting for that automation is lost."
    compliance: [SOC2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: mailerlite.get_automation_activity
    object: Automation
    action: get_automation_activity
    description: "Get subscriber activity for an automation with status filtering."
    category: Operations
    risk: high
    business_impact: "Bulk read of which subscribers have moved through an automation; enumerates identifiable contacts and their workflow status at scale."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mailerlite.get_automation
    object: Automation
    action: get_automation
    description: "Get single automation details."
    category: Operations
    risk: low
    business_impact: "Returns one automation's configuration and aggregate stats; workflow definition with no individual-level PII."
    compliance: []
    sod_concern: false
    confidence: high
