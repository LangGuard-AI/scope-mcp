  # ---------- Webhook & Integration ----------
  - id: mailerlite.create_webhook
    object: Webhook
    action: create_webhook
    description: "Create a new webhook with name, URL, and events."
    category: Platform & DevOps
    risk: high
    business_impact: "Registers an external URL to receive subscriber-event payloads; establishes an ongoing egress channel that can stream subscriber PII off-platform."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: mailerlite.update_webhook
    object: Webhook
    action: update_webhook
    description: "Update webhook details including enabling/disabling."
    category: Platform & DevOps
    risk: high
    business_impact: "Changes a webhook's destination URL or event scope; can redirect subscriber-event payloads to a different external endpoint."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: mailerlite.delete_webhook
    object: Webhook
    action: delete_webhook
    description: "Delete a webhook."
    category: Platform & DevOps
    risk: medium
    business_impact: "Removes a webhook; downstream integrations stop receiving subscriber events but no subscriber data is destroyed."
    compliance: [SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

