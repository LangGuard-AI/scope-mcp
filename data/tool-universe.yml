    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [MCP]
    source: langguard-editorial

  # source: uvx --refresh tooluniverse
  - id: tool-universe.find_tools
    object: Tool
    action: find_tools
    description: "Finds relevant ToolUniverse tools using AI-powered search over the registry."
    category: Data Access
    risk: low
    business_impact: "Ranks registry entries by relevance to a natural-language query; selection of a tool still requires a separate invocation."
