  # source: https://jam.dev/docs/debug-a-jam/mcp
  - id: jam.createRecordingLink
    object: RecordingLink
    action: createRecordingLink
    category: Identity & Access
    risk: medium
    business_impact: "Creates a reusable link that silently collects browser-session recordings into the workspace, widening the session-capture surface."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://jam.dev/docs/debug-a-jam/mcp
  - id: jam.updateRecordingLink
    object: RecordingLink
    action: updateRecordingLink
    category: Identity & Access
    risk: medium
    business_impact: "Alters a recording link's folder, expiration, or metadata, changing where and how long captured sessions are collected."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://jam.dev/docs/debug-a-jam/mcp
  - id: jam.revokeRecordingLink
    object: RecordingLink
    action: revokeRecordingLink
    category: Identity & Access
    risk: medium
    business_impact: "Revokes a recording link, cutting off future capture through it while leaving already-collected Jams intact."
