schema_version: "1.1"
platform: mixpanel
display_name: Mixpanel
source: langguard-editorial
updated: "2026-06"
reference: https://docs.mixpanel.com/docs/mcp
actions:
  # ---------- Feature Flags ----------
  - id: mixpanel.Create-Feature-Flag
    object: FeatureFlag
    action: Create-Feature-Flag
    description: "Creates a new feature flag with targeting rules in the project."
    category: Operations
    risk: medium
    business_impact: "Provisions a feature flag that gates production functionality for end users; reversible by disabling the flag."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mixpanel.Update-Feature-Flag
    object: FeatureFlag
    action: Update-Feature-Flag
    description: "Modifies a feature flag's targeting, rollout percentage, or enabled state."
    category: Operations
    risk: medium
    business_impact: "Changes live feature-flag targeting or kill-switch state, directly altering production behavior for targeted users; reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mixpanel.List-Feature-Flags
    object: FeatureFlag
    action: List-Feature-Flags
    description: "Searches and lists feature flags in the project."
    category: Operations
    risk: low
    business_impact: "Returns the inventory of feature flags and their states; read-only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mixpanel.Get-Feature-Flag
    object: FeatureFlag
    action: Get-Feature-Flag
    description: "Retrieves a single feature flag's configuration and targeting rules."
    category: Operations
    risk: low
    business_impact: "Returns one feature flag's configuration; read-only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mixpanel.Get-Feature-Flag-Setup-Guidance
    object: FeatureFlag
    action: Get-Feature-Flag-Setup-Guidance
    description: "Returns best-practice guidance for configuring a feature flag."
    category: Operations
    risk: low
    business_impact: "Returns static configuration best-practice text; no project state is read or changed."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mixpanel.Get-Feature-Flag-Lifecycle-Guidance
    object: FeatureFlag
    action: Get-Feature-Flag-Lifecycle-Guidance
    description: "Returns best-practice guidance for feature-flag rollout and cleanup."
    category: Operations
    risk: low
    business_impact: "Returns static rollout/cleanup best-practice text; no project state is read or changed."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

