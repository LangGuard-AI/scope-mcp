  # ---------- Data Management ----------
  - id: mixpanel.Bulk-Edit-Events
    object: Event
    action: Bulk-Edit-Events
    description: "Updates up to 50 events uniformly in Lexicon (rename, hide, tag, annotate)."
    category: Data Management
    risk: medium
    business_impact: "Mutates the event taxonomy for up to 50 events at once; downstream queries, dashboards, and reports depend on this taxonomy; reversible but high-blast-radius."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mixpanel.Bulk-Edit-Properties
    object: Property
    action: Bulk-Edit-Properties
    description: "Updates up to 50 properties uniformly in Lexicon (rename, hide, reclassify, annotate)."
    category: Data Management
    risk: medium
    business_impact: "Mutates property metadata for up to 50 properties at once, including data-classification flags that govern PII handling; reversible but high-blast-radius."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: mixpanel.Edit-Event
    object: Event
    action: Edit-Event
    description: "Updates a single event's metadata in Lexicon (rename, hide, tag, annotate)."
    category: Data Management
    risk: medium
    business_impact: "Renames, hides, or annotates one event in the taxonomy; downstream queries depend on this metadata; reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mixpanel.Edit-Property
    object: Property
    action: Edit-Property
    description: "Updates a single property's metadata and data classification."
    category: Data Management
    risk: medium
    business_impact: "Renames, hides, or reclassifies one property, including PII data-classification flags; affects analytic accuracy and PII handling; reversible."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: mixpanel.Update-Business-Context
