    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: mixpanel.Delete-Tag
    object: Tag
    action: Delete-Tag
    description: "Removes a Lexicon tag; tagged items become untagged."
    category: Data Management
    risk: low
    business_impact: "Removes a Lexicon tag, untagging associated items; organizational metadata only, reversible."
