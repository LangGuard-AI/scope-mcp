    risk: low
    business_impact: "Returns a project-wide snapshot inventory and metadata; exposes no snapshot contents."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  # ---------- Reservations & Commitments (read) ----------
  - id: google-compute-engine.list_reservations
