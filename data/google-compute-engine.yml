    risk: low
    business_impact: "Returns a disk inventory and metadata; exposes no disk contents."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.get_disk_basic_info
    object: Disk
    action: get_disk_basic_info
    description: "Get basic information about a Compute Engine disk, including name, ID, description, creation timestamp, size, type, status, and attach/detach timestamps."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: low
    business_impact: "Returns metadata for a single disk; exposes no disk contents."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.get_disk_performance_config
    object: Disk
    action: get_disk_performance_config
    description: "Get performance configuration of a disk, including type, size, provisioned IOPS/throughput, physical block size, storage pool, and access mode."
