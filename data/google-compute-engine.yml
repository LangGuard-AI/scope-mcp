schema_version: "1.1"
platform: google-compute-engine
display_name: Google Compute Engine
source: langguard-editorial
updated: "2026-06"
reference: https://docs.cloud.google.com/compute/docs/use-compute-engine-mcp
actions:
  # ---------- Instance Lifecycle ----------
  - id: google-compute-engine.delete_instance
    object: Instance
    action: delete_instance
    description: "Delete a Google Compute Engine virtual machine (VM) instance."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: critical
    business_impact: "Destroys a VM and, by default (boot-disk autoDelete=true), its boot disk and all on-disk data with no soft-delete or trash to recover from."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.create_instance
    object: Instance
    action: create_instance
    description: "Create a new Google Compute Engine virtual machine (VM) instance."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: medium
    business_impact: "Provisions a new compute resource that incurs billing and expands the attack surface; reversible by deletion."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.start_instance
    object: Instance
    action: start_instance
    description: "Starts a Google Compute Engine virtual machine (VM) instance."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: medium
    business_impact: "Brings a stopped VM back online, resuming billing and exposing its services; reversible by stopping."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.stop_instance
    object: Instance
    action: stop_instance
    description: "Stops a Google Compute Engine virtual machine (VM) instance."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: medium
    business_impact: "Takes a running VM offline, causing an availability outage for any service it hosts; reversible by starting."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.reset_instance
    object: Instance
    action: reset_instance
    description: "Resets a Google Compute Engine virtual machine (VM) instance."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: medium
    business_impact: "Hard-reboots a VM, interrupting in-flight workloads and dropping in-memory state; data on persistent disks survives."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.set_instance_machine_type
    object: Instance
    action: set_instance_machine_type
    description: "Sets the machine type for a stopped Google Compute Engine instance to the specified machine type."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: medium
    business_impact: "Re-sizes a stopped VM's CPU/memory profile, changing performance and billing; reversible by setting another type."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  # ---------- Instance Inventory (read) ----------
  - id: google-compute-engine.list_instances
    object: Instance
    action: list_instances
    description: "Lists Compute Engine VM instances with name, ID, status, machine type, creation timestamp, and attached guest accelerators."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: low
    business_impact: "Returns an inventory of VMs and their basic configuration metadata; no row-level or in-VM data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.get_instance_basic_info
    object: Instance
    action: get_instance_basic_info
    description: "Get basic information about a Compute Engine VM instance, including name, ID, status, machine type, creation timestamp, and attached accelerators."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: low
    business_impact: "Returns configuration metadata for a single VM; no in-VM data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.list_instance_attached_disks
    object: Disk
    action: list_instance_attached_disks
    description: "Lists the disks attached to a Compute Engine VM instance with kind, type, mode, source, encryption key, size, and other disk metadata."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: low
    business_impact: "Returns disk attachment metadata for a VM, including encryption-key references; exposes no disk contents."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  # ---------- Managed Instance Groups (read) ----------
  - id: google-compute-engine.list_instance_group_managers
    object: InstanceGroupManager
    action: list_instance_group_managers
    description: "Lists Compute Engine managed instance groups (MIGs) with name, ID, instance template, base name, target sizes, status, and creation timestamp."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: low
    business_impact: "Returns MIG inventory and scaling metadata; no in-VM data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.get_instance_group_manager_basic_info
    object: InstanceGroupManager
    action: get_instance_group_manager_basic_info
    description: "Get basic information about a Compute Engine managed instance group (MIG), including instance template, base name, target sizes, status, and creation timestamp."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: low
    business_impact: "Returns scaling and template metadata for a single MIG; no in-VM data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.list_managed_instances
    object: Instance
    action: list_managed_instances
    description: "Lists managed instances for a given MIG, including instance ID, URL, status, and current action."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: low
    business_impact: "Returns the membership and lifecycle state of instances in a MIG; no in-VM data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  # ---------- Instance Templates (read) ----------
  - id: google-compute-engine.get_instance_template_properties
    object: InstanceTemplate
    action: get_instance_template_properties
    description: "Get instance properties of an instance template — including network interfaces, metadata, service accounts, and shielded/confidential instance configurations."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: medium
    business_impact: "Exposes a template's security-relevant configuration — service accounts, network interfaces, instance metadata, and shielded/confidential settings — that informs lateral-movement and privilege paths."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.list_instance_templates
    object: InstanceTemplate
    action: list_instance_templates
    description: "Lists Compute Engine instance templates with name, ID, description, machine type, region, and creation timestamp."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: low
    business_impact: "Returns an inventory of instance templates and their basic metadata; no service-account or in-VM data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.get_instance_template_basic_info
    object: InstanceTemplate
    action: get_instance_template_basic_info
    description: "Get basic information about an instance template, including name, ID, description, machine type, region, and creation timestamp."
    reference: https://docs.cloud.google.com/compute/docs/reference/mcp
    category: Platform & DevOps
    risk: low
    business_impact: "Returns top-level metadata for a single instance template; no security-config detail."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  # ---------- Disks & Snapshots (read) ----------
  - id: google-compute-engine.list_disks
