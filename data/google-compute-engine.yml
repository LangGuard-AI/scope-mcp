actions:
  # ---------- Platform & DevOps ----------

  # source: https://compute.googleapis.com/mcp
  - id: google-compute-engine.delete_instance
    object: Instance
    action: delete_instance
    category: Platform & DevOps
    risk: critical
    business_impact: "Permanently destroys a Compute Engine VM instance along with its local SSD data and running workload — irreversible once the operation completes."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://compute.googleapis.com/mcp
  - id: google-compute-engine.create_instance
    object: Instance
    action: create_instance
    category: Platform & DevOps
    risk: medium
    business_impact: "Provisions a new Compute Engine VM instance in a project and zone, spinning up billable compute that runs until explicitly stopped or deleted."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://compute.googleapis.com/mcp
  - id: google-compute-engine.stop_instance
    object: Instance
    action: stop_instance
    category: Platform & DevOps
    risk: medium
    business_impact: "Halts a running Compute Engine VM instance, taking its workload offline and interrupting any service it hosts."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://compute.googleapis.com/mcp
  - id: google-compute-engine.start_instance
    object: Instance
    action: start_instance
    category: Platform & DevOps
    risk: medium
    business_impact: "Boots a stopped Compute Engine VM instance back into a running state, resuming its workload and incurring compute charges."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://compute.googleapis.com/mcp
  - id: google-compute-engine.reset_instance
    object: Instance
    action: reset_instance
    category: Platform & DevOps
    risk: medium
    business_impact: "Forces a hard reset of a running Compute Engine VM instance, rebooting it abruptly and risking loss of any in-flight, unsynced work."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://compute.googleapis.com/mcp
  - id: google-compute-engine.set_instance_machine_type
