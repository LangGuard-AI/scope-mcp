    risk: low
    business_impact: "Returns performance-tuning metadata for a single disk; exposes no disk contents."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: google-compute-engine.list_snapshots
    object: Snapshot
    action: list_snapshots
    description: "Lists snapshots in a project with name, ID, status, creation time, disk size, storage bytes, source disk, and source disk ID."
