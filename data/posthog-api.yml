  - id: posthog-api.data-warehouse-stored-credentials-list
    object: Credential
    action: data-warehouse-stored-credentials-list
    category: Secrets & Workflows
    risk: high
    business_impact: "Enumerates stored data-source credentials awaiting setup, exposing which external systems the workspace can connect to and their pending secret material."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://posthog.com/docs/model-context-protocol/tools
  - id: posthog-api.external-data-sources-create
    object: ExternalDataSource
    action: external-data-sources-create
    category: Secrets & Workflows
    risk: high
    business_impact: "Registers a new data-warehouse source with connection credentials, opening an ongoing sync path between an external database and the analytics workspace."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://posthog.com/docs/model-context-protocol/tools
  - id: posthog-api.external-data-sources-update-webhook-inputs-create
    object: ExternalDataSource
    action: external-data-sources-update-webhook-inputs-create
    category: Secrets & Workflows
    risk: high
    business_impact: "Rewrites a source's webhook inputs including the signing secret, which can silently redirect or forge inbound data-ingestion traffic."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://posthog.com/docs/model-context-protocol/tools
  - id: posthog-api.external-data-sources-destroy
    object: ExternalDataSource
    action: external-data-sources-destroy
    category: Secrets & Workflows
    risk: high
    business_impact: "Deletes a data-warehouse source connection, severing an integration and halting every sync that depends on it."
