actions:
  # ---------- Identity & Access ----------

  # source: https://posthog.com/docs/model-context-protocol/tools
  - id: posthog-api.organization-enforce-2fa-execute
    object: Organization
    action: organization-enforce-2fa-execute
    category: Identity & Access
    risk: high
    business_impact: "Enforces two-factor authentication org-wide, changing the authentication policy for every member and locking out accounts that have not enrolled."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Secrets & Workflows ----------

