    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://posthog.com/docs/model-context-protocol/tools
  - id: posthog-api.external-data-schemas-delete-data
    object: ExternalDataSchema
    action: external-data-schemas-delete-data
    category: Secrets & Workflows
    risk: critical
    business_impact: "Purges the synced data of a warehouse table irreversibly, destroying materialized records with no recovery path."
