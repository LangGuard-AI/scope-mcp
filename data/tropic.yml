  - id: tropic.query_contract_documents
    object: ContractDocument
    action: query_contract_documents
    description: "Queries the contents of stored supplier contract documents."
    category: Data Access
    risk: medium
    business_impact: "Surfaces the text of executed supplier agreements, exposing negotiated rates, termination terms and confidentiality clauses to whoever drives the agent."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

