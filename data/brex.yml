schema_version: "1.1"
platform: brex
display_name: Brex
source: langguard-editorial
updated: "2026-06"
reference: https://developer.brex.com/docs/mcp
# Tool surface verified against the vendor's authoritative MCP docs (single
# "Available tools" table, 43 tools, no hidden/additional/insiders section).
# Live tools/list introspection was OAuth-gated (401), so regime tags that hinge
# on a field's exact data type (PCI/PAN on cards, PII breadth of user reads) are
# inferences and carry medium confidence. The vendor states "Actions like
# approvals and card management are not yet available via MCP" — there is no
# money-movement, approval, privilege-grant, ledger-write, or audit-log surface,
# so the write surface is 6 metadata tools and sod_concern is false throughout.
actions:
  # ---------- Data Access (bulk export — egress surface) ----------
  - id: brex.start_expense_download
    object: Expense
    action: start_expense_download
    description: "Start an asynchronous expense download job."
    category: Data Access
    risk: high
    business_impact: "Initiates a bulk export of company expense records; financial data plus employee PII leaving the platform as a single download."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: brex.get_expense_download_result
    object: Expense
    action: get_expense_download_result
    description: "Check the status of an expense download job and get the download URL when ready."
    category: Data Access
    risk: high
    business_impact: "Returns the signed URL for a completed bulk expense export; the actual egress point for financial and PII data at scale."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: brex.query_expense_analytics
    object: Expense
    action: query_expense_analytics
    description: "Ask high-level company spend questions."
    category: Data Access
    risk: medium
    business_impact: "Returns company-wide aggregate spend figures; admin-only read of sensitive financial posture."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

