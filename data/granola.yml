schema_version: "1.1"
platform: granola
display_name: Granola
source: langguard-editorial
updated: "2026-06"
reference: https://docs.granola.ai/help-center/sharing/integrations/mcp
actions:
  # ---------- Data Access ----------
  - id: granola.get_meeting_transcript
    object: Transcript
    action: get_meeting_transcript
    description: "Paid plans only — returns the raw transcript for a meeting by meeting ID."
    category: Data Access
    risk: high
    business_impact: "Returns the verbatim transcript of a private meeting; exposes word-for-word personal communications of every attendee and may include PII or PHI."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: granola.get_meetings
    object: Meeting
    action: get_meetings
    description: "Searches through meeting content including meeting ID, title, date, attendees, private notes, and enhanced notes."
    category: Data Access
    risk: high
    business_impact: "Returns verbatim private and enhanced meeting notes for matching meetings; exposes confidential internal discussion and attendee PII."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: granola.query_granola_meetings
    object: Meeting
    action: query_granola_meetings
    description: "Chat with Granola — answers natural-language questions by searching across the user's meeting history."
    category: Data Access
    risk: high
    business_impact: "Synthesizes answers across the entire meeting corpus; can surface confidential discussion, attendee PII, or material non-public information from many meetings in one call."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: granola.list_meetings
    object: Meeting
    action: list_meetings
    description: "Scans the list of meetings, including meeting ID, title, date, and attendees; on paid plans includes shared notes and folder filtering."
    category: Data Access
    risk: medium
    business_impact: "Enumerates the user's meetings with titles and attendee names; bulk read of attendee PII, and titles alone can reveal sensitive context."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: granola.list_meeting_folders
    object: Folder
    action: list_meeting_folders
    description: "Paid plans only — lists folders the user is a member of, including folder ID, title, description, and note count."
    category: Data Access
    risk: low
    business_impact: "Returns folder organization metadata only; no meeting content or attendee data is exposed."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Identity & Admin ----------
  - id: granola.get_account_info
    object: Account
    action: get_account_info
    description: "Returns the email address and active workspace for the Granola account connected to the current MCP session."
    category: Identity & Admin
    risk: low
    business_impact: "Returns the connected account's email and workspace; discloses a single identifiable user's email address."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
