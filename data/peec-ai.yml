  # ---------- Data Access ----------
  # Reads over AI-engine response content, source content, and aggregated bot
  # access-log counts. Brand-monitoring data, not third-party personal comms.
  - id: peec-ai.get_chat
    object: Chat
    action: get_chat
    description: "Gets the full content of a single chat: user prompt, AI response, retrieved source URLs, mentioned brands, search queries, and extracted products."
    category: Data Access
    risk: medium
    business_impact: "Returns full AI-engine response text for a monitored prompt, which could incidentally surface personal data when a prompt concerns an individual."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: peec-ai.list_chats
    object: Chat
    action: list_chats
    description: "Lists individual AI responses (chats) for a project over a date range; each chat is one prompt run against one AI engine on a date."
    category: Data Access
    risk: low
    business_impact: "Returns chat metadata (ids, dates, model, feature flags) over a date range; no response content and no personal data in the listing itself."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: peec-ai.get_url_content
    object: SourceUrl
    action: get_url_content
    description: "Returns the scraped markdown content of an indexed source URL."
    category: Data Access
    risk: medium
    business_impact: "Returns scraped page content of an external source URL, which could incidentally include personal data published on that page."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: peec-ai.get_agent_visits
    object: AgentVisit
    action: get_agent_visits
    description: "Aggregates AI bot visit counts from connected access logs over a date range, optionally grouped by bot, status, host, or path."
    category: Data Access
    risk: low
    business_impact: "Returns aggregated AI-bot visit counts from access logs; bot-level traffic aggregates, not human personal data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: peec-ai.list_search_queries
    object: SearchQuery
    action: list_search_queries
