actions:
  # ---------- Configuration ----------
  # Brand-visibility analytics config: brands, prompts, tags, topics. Every write
  # tool is readOnlyHint:false; every delete_* is destructiveHint:true (soft-delete,
  # reversible). Objects are companies/competitors and tracking config, not personal
  # data of identifiable individuals — compliance defaults to [].
  - id: peec-ai.create_brand
    object: Brand
    action: create_brand
    description: "Creates a new tracked brand (own brand or competitor) in a project."
    category: Configuration
    risk: low
    business_impact: "Adds a tracked brand to a project; reversible via soft-delete and individually confirmed by the client."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: peec-ai.create_brands
    object: Brand
    action: create_brands
    description: "Bulk-creates up to 50 brands in a single call; duplicates are skipped, not failed."
    category: Configuration
    risk: low
    business_impact: "Adds up to 50 tracked brands at once; reversible and non-sensitive tracking config."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: peec-ai.update_brand
    object: Brand
    action: update_brand
    description: "Updates a brand's name, regex, aliases, domains, or color; name/regex/alias edits trigger a background metric recalculation."
    category: Configuration
    risk: medium
    business_impact: "Changes brand matching config and may trigger a full metric recalculation, altering reported visibility figures until it completes."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: peec-ai.delete_brand
    object: Brand
    action: delete_brand
    description: "Soft-deletes a brand (destructiveHint:true)."
    category: Configuration
    risk: medium
    business_impact: "Removes a tracked brand and its dashboards from view; reversible from soft-delete but interrupts ongoing tracking."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: peec-ai.delete_brands
    object: Brand
    action: delete_brands
    description: "Bulk soft-deletes up to 50 brands in a single call (destructiveHint:true)."
    category: Configuration
    risk: medium
    business_impact: "Removes up to 50 tracked brands at once; reversible from soft-delete but unilaterally disrupts a project's tracking surface."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: peec-ai.create_prompt
