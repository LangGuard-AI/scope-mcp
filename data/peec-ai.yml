    description: "Defines a custom domain classification entity that extends the built-in taxonomy."
    category: Configuration
    risk: low
    business_impact: "Adds a custom source-classification category; reversible and non-sensitive."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: peec-ai.delete_domain_classification
    object: DomainClassification
    action: delete_domain_classification
    description: "Deletes a custom domain classification entity (destructiveHint:true)."
    category: Configuration
    risk: medium
    business_impact: "Removes a custom source-classification category, cascading to clear any domain assignments referencing it."
    compliance: []
    sod_concern: false
    confidence: high
