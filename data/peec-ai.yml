    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: peec-ai.get_project_profile
    object: ProjectProfile
    action: get_project_profile
    description: "Reads the project's brand profile: description, industry, brand-identity adjectives, target markets, audience distribution, and product list."
    category: Data Access
    risk: low
    business_impact: "Returns the project's own brand profile config; non-sensitive business metadata about the customer's own brand."
