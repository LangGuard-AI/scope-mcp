  - id: microsoft-users.mcp_graph_listUsers
    object: User
    action: mcp_graph_listUsers
    category: Identity & Access
    risk: medium
    business_impact: "Enumerates the entire tenant directory with filter and select options, pulling every employee's name, UPN, job title, and contact fields into agent context in one call."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

