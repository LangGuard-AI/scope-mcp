  # source: https://help.digits.com/business-connections/digits-mcp.md
  - id: digits.query_transactions
    object: Transaction
    action: query_transactions
    category: Financial
    risk: medium
    business_impact: "Searches and returns individual transaction records by date, amount, party, and category, exposing ledger and counterparty data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://help.digits.com/business-connections/digits-mcp.md
  - id: digits.financial_statement
    object: FinancialStatement
    action: financial_statement
    category: Financial
    risk: medium
    business_impact: "Generates complete P&L, balance sheet, cash flow, and AR/AP aging statements, exposing the business's confidential financial position."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://help.digits.com/business-connections/digits-mcp.md
  - id: digits.dimensional_summarize_transactions
    object: Transaction
    action: dimensional_summarize_transactions
    category: Financial
    risk: medium
    business_impact: "Aggregates transactions into multi-dimensional summaries such as spend by category or revenue by customer over time, revealing financial performance detail."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://help.digits.com/business-connections/digits-mcp.md
  - id: digits.search_term
    object: Term
    action: search_term
    category: Financial
    risk: medium
    business_impact: "Resolves customer, vendor, category, department, or location names via fuzzy matching, exposing counterparty identities present in the ledger."
