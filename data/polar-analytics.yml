actions:
  # ---------- Data Access ----------

  # source: https://intercom.help/polar-app/en/articles/12960325-using-mcp-tools-as-an-api
  - id: polar-analytics.generate_report
    object: Report
    action: generate_report
    description: "Generate a custom analytics report with rows, a totals row, and a deep link."
    category: Data Access
    risk: high
    business_impact: "Runs a caller-shaped query across the workspace's unified commerce, ad-spend and customer-cohort data, so one call can pull the merchant's full revenue and margin picture into the agent's context."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/polar-analytics
  - id: polar-analytics.get_metrics
    object: Metric
    action: get_metrics
    category: Data Access
    risk: medium
    business_impact: "Returns the workspace's metric definitions and figures, exposing revenue, spend and retention numbers that the merchant treats as confidential trading data."
    compliance: []
    sod_concern: false
    confidence: low
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/polar-analytics
  - id: polar-analytics.get_dimension_values
    object: Dimension
    action: get_dimension_values
    category: Data Access
    risk: medium
    business_impact: "Enumerates the distinct values behind a breakdown dimension, which in a DTC dataset includes customer segment, product, campaign and geography labels."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://intercom.help/polar-app/en/articles/12960325-using-mcp-tools-as-an-api
  - id: polar-analytics.list_dimensions
    object: Dimension
    action: list_dimensions
    description: "Returns compatible breakdowns, filters, views, and attribution settings for given metrics."
    category: Data Access
    risk: low
    business_impact: "Lists the breakdowns, filters and attribution settings available for a metric — schema metadata only, no figures returned."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/polar-analytics
