    object: CustomDimension
    action: get_custom_dimension_details
    category: Data Access
    risk: low
    business_impact: "Reads the definition of a customer-built dimension, revealing how the merchant segments its own data but returning no underlying records."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://intercom.help/polar-app/en/articles/12960325-using-mcp-tools-as-an-api
  - id: polar-analytics.get_context
    object: Workspace
    action: get_context
    description: "Retrieves workspace metadata including currency, timezone, and available metrics/dimensions."
    category: Data Access
    risk: low
    business_impact: "Returns workspace currency, timezone and the catalogue of available metrics and dimensions — orientation metadata with no business figures attached."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

