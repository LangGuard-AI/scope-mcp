    object: BoardItem
    action: canvas_update_from_svg
    category: Content
    risk: medium
    business_impact: "Edits existing board items via find-and-replace on their serialized form, overwriting collaborative work in place."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://developers.miro.com/docs/miro-mcp-tools
  - id: miro.doc_update
    object: Document
    action: doc_update
    category: Content
    risk: medium
