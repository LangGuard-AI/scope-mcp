  # source: https://github.com/local-falcon/mcp
  - id: local-falcon.removeFalconGuardProtection
    object: GuardLocation
    action: removeFalconGuardProtection
    description: "Removes locations from Falcon Guard entirely."
    category: Operations
    risk: high
    business_impact: "Strips listing-change monitoring from one or more business locations and discards their Guard configuration, leaving unauthorized Google Business Profile edits undetected with no undo."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://github.com/local-falcon/mcp
  - id: local-falcon.pauseFalconGuardProtection
    object: GuardLocation
    action: pauseFalconGuardProtection
    description: "Pauses protection for specified locations."
    category: Operations
    risk: medium
    business_impact: "Suspends Falcon Guard monitoring on selected locations, creating a detection gap during which listing hijacks or profile edits go unreported."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

