  - id: lovable.set_project_visibility
    object: Project
    action: set_project_visibility
    category: Identity & Access
    risk: high
    business_impact: "Changes who can access a project's editor, potentially exposing an unpublished build to the whole workspace or locking collaborators out."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

