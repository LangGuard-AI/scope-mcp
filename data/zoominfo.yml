schema_version: "1.1"
platform: zoominfo
display_name: ZoomInfo
source: langguard-editorial
updated: "2026-06"
reference: https://docs.zoominfo.com/docs/zi-api-mcp-overview
# Official ZoomInfo connector. The hosted MCP server (https://mcp.zoominfo.com/mcp)
# is OAuth-gated: POST tools/list returns 401 (ZI0001 "Authorization token is
# required"), GET /tools returns 404, and the server advertises
# /.well-known/oauth-protected-resource (scopes include zi_mcp, api:data:mcp).
# Verbatim tool identifiers are therefore not reachable without a user token, and
# none was available. The vendor's llms.txt indexes only the REST API Reference
# (controller method names like accountsummaryinterface_getaccountsummary), which
# the curator spec forbids using as MCP tool ids. The MCP overview page publishes
# a clean 14-tool "Tools at a Glance" capability table (Finding x7, Enriching x5,
# Researching x2) as plain-language labels only — no code identifiers anywhere.
# Every action below therefore uses id_form: capability with the verbatim doc
# label in `description` and a slugified id; confidence is capped at medium
# (intent-level, not identifier-level matching). ZoomInfo's core function is
# revealing verified contact PII (work email, direct-dial/mobile phone, employment
# history) for named individuals, so contact-touching tools carry the full privacy
# stack; tools that return lists of individuals (search/find/recommend/batch-enrich
# contacts) additionally carry SOC2 + ISO_27001 as bulk-PII-read data-exfil events.
# Company-only firmographics carry none. The connector exposes no
# delete/write/export-list/destructive operations in its published surface; none
# are invented here. (Supersedes a prior 1.0 seed that included an unverified
# `zoominfo.lookup` action absent from the vendor's published tool surface.)
actions:
  # ---------- Enriching ----------
  - id: zoominfo.enrich_contacts
    object: Contact
    action: enrich_contacts
    id_form: capability
    description: "Enrich Contacts"
    category: Customer
    risk: high
    business_impact: "Returns complete contact PII for one or more named individuals — verified email, phone, employment history, education, and social profiles; plural 'Enrich Contacts' tool plausibly accepts a batch."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: zoominfo.enrich_companies
    object: Company
    action: enrich_companies
    id_form: capability
    description: "Enrich Companies"
    category: Customer
    risk: low
    business_impact: "Returns firmographics for a company — revenue, headcount, funding, tech stack, leadership, subsidiaries; company data, not personal data."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

