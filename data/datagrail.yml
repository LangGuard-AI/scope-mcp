schema_version: "1.0"
platform: datagrail
display_name: DataGrail (Vera)
logo: https://www.datagrail.io/safari-pinned-tab.svg
source: langguard-editorial
updated: "2026-07"
reference: https://docs.datagrail.io/docs/vera/vera-mcp/tool-reference/
actions:
  # ---------- Privacy Requests ----------

  # source: https://docs.datagrail.io/docs/vera/vera-mcp/tool-reference/
  - id: datagrail.search_tickets
    object: PrivacyRequestTicket
    action: search_tickets
    category: Privacy Requests
    risk: medium
    business_impact: "Returns privacy request (DSAR) tickets containing requester personal data such as names and emails; a broad filter can surface many data-subjects at once."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datagrail.io/docs/vera/vera-mcp/tool-reference/
  - id: datagrail.get_ticket_activity_log
    object: PrivacyRequestTicket
    action: get_ticket_activity_log
    category: Privacy Requests
    risk: medium
    business_impact: "Exposes a privacy request's full activity trail including state changes and emails sent to the data-subject, revealing that individual's personal data and handling history."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datagrail.io/docs/vera/vera-mcp/tool-reference/
  - id: datagrail.search_opt_outs
    object: OptOutRequest
    action: search_opt_outs
    category: Privacy Requests
    risk: medium
    business_impact: "Returns opt-out (do-not-sell/share) requests keyed to requester identifiers such as email; a broad filter exposes many consumers' opt-out choices at once."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datagrail.io/docs/vera/vera-mcp/tool-reference/
  - id: datagrail.get_request_policies
    object: RequestPolicy
    action: get_request_policies
    category: Privacy Requests
    risk: low
    business_impact: "Reads the configured privacy request policies, including legal frameworks, verification methods, and supported rights; configuration metadata with no individual personal data."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Risk & Assessments ----------

  # source: https://docs.datagrail.io/docs/vera/vera-mcp/tool-reference/
  - id: datagrail.create_assessment
    object: Assessment
    action: create_assessment
    category: Risk & Assessments
    risk: medium
    business_impact: "Creates a new privacy/risk assessment (PIA, DPIA, or vendor review) record from a template, establishing a governance artifact in the compliance program."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datagrail.io/docs/vera/vera-mcp/tool-reference/
  - id: datagrail.update_assessment
    object: Assessment
    action: update_assessment
    category: Risk & Assessments
    risk: medium
    business_impact: "Changes an assessment's name, due date, or status; altering status can prematurely mark a DPIA or vendor review complete and distort compliance tracking."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datagrail.io/docs/vera/vera-mcp/tool-reference/
  - id: datagrail.answer_assessment_question
    object: Assessment
    action: answer_assessment_question
    category: Risk & Assessments
    risk: medium
    business_impact: "Records an answer to a question within a risk assessment, directly populating the compliance documentation that DPIA and vendor-review conclusions rest on."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datagrail.io/docs/vera/vera-mcp/tool-reference/
  - id: datagrail.search_risks
    object: Risk
    action: search_risks
    category: Risk & Assessments
    risk: low
    business_impact: "Reads the risk register listing identified risks and their mitigation status; internal governance data with no individual personal data."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datagrail.io/docs/vera/vera-mcp/tool-reference/
  - id: datagrail.search_assessments
    object: Assessment
    action: search_assessments
    category: Risk & Assessments
    risk: low
    business_impact: "Reads completed and in-progress assessments with deadlines and contributors; internal governance metadata, read-only."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datagrail.io/docs/vera/vera-mcp/tool-reference/
  - id: datagrail.search_assessment_templates
    object: AssessmentTemplate
    action: search_assessment_templates
    category: Risk & Assessments
    risk: low
    business_impact: "Lists prebuilt and custom assessment templates and their IDs; template metadata with no sensitive data."
