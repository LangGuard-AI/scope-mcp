    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datagrail.io/docs/vera/vera-mcp/tool-reference/
  - id: datagrail.associate_processing_activity
    object: InventorySystem
    action: associate_processing_activity
    category: Data Inventory
    risk: medium
