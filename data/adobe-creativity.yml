reference: https://developer.adobe.com/adobe-for-creativity/
# Tool ids verified verbatim from Adobe-authored skill "Tool Reference" tables in
# github.com/adobe/skills (plugins/creative-cloud/adobe-for-creativity/skills/*/SKILL.md).
# The hosted MCP endpoint (https://adobe-creativity.adobe.io/mcp) is OAuth-gated (403/401
# to anonymous tools/list), so live introspection of the full advertised "50+ tool" surface
# was not possible; the 33 actions below are the subset referenced by the published skills.
# This is a creative-asset connector: most tools are pure pixel/clip transforms with no PII
# concern. The compliance surface lives at ingestion, storage, search, and board-sharing,
# where user-supplied images (often portraits/headshots of identifiable people) are handled.
actions:
  # ---------- Asset Management ----------
  - id: adobe-creativity.asset_add_file
    object: Asset
    action: asset_add_file
    description: "Opens an interactive file picker to ingest a local file or select an asset from Creative Cloud storage."
    category: Data Access
    risk: low
    business_impact: "Ingests a user-supplied file (often photos of identifiable people) into the editing session; content may contain personal data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: adobe-creativity.asset_search
    object: Asset
    action: asset_search
    description: "Searches the user's Creative Cloud storage for an asset by name, type, or media filter."
    category: Data Access
    risk: medium
    business_impact: "Reads across the user's Creative Cloud library; surfaces stored assets that may contain personal data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: adobe-creativity.asset_initialize_file_upload
    object: Asset
    action: asset_initialize_file_upload
    description: "First call of the two-step egress upload that moves a chat-supplied file into Adobe cloud storage."
    category: Data Access
    risk: medium
    business_impact: "Transfers user-supplied content into Adobe's cloud; the egress of personal-data-bearing files is the compliance event."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: adobe-creativity.asset_finalize_file_upload
    object: Asset
    action: asset_finalize_file_upload
    description: "Second call of the two-step egress upload; commits the uploaded file and returns a presigned Creative Cloud URL."
    category: Data Access
    risk: medium
    business_impact: "Commits user-supplied content into Adobe cloud storage; finalizes egress of files that may contain personal data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: adobe-creativity.asset_inline_preview
    object: Asset
    action: asset_inline_preview
    description: "Inspects a source image inline to determine a crop focus strategy before processing."
    category: Data Access
    risk: low
    business_impact: "Reads and renders a single source image for inspection; the image may depict identifiable individuals."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: adobe-creativity.asset_preview_file
    object: Asset
    action: asset_preview_file
    description: "Renders one or more assets as an in-chat preview grid for review or selection."
    category: Data Access
    risk: low
    business_impact: "Displays processed or source assets in chat; reversible, non-destructive, and scoped to the current session."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: adobe-creativity.create_firefly_board
    object: Board
    action: create_firefly_board
    description: "Creates a Firefly Board and imports the supplied Adobe-storage assets onto it."
    category: Data Access
    risk: medium
    business_impact: "Aggregates processed assets onto a shareable Firefly Board; collects user content (potentially personal data) into a persistent surface."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

