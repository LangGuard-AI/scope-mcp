  - id: clinical-trials.search_investigators
    object: Investigator
    action: search_investigators
    description: "Finds principal investigators and research sites conducting trials in a given therapeutic area."
    category: Data Access
    risk: medium
    business_impact: "Aggregates identifiable investigator data — names, roles, institutional affiliations, and facility locations — across many sites, enabling profiling of individuals for site selection or recruitment."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://claude.com/resources/tutorials/using-the-clinicaltrials-gov-connector-in-claude
  - id: clinical-trials.search_trials
    object: Trial
    action: search_trials
    description: "Finds trials by condition, intervention, location, sponsor, recruitment status, and development phase."
    category: Data Access
    risk: low
    business_impact: "Queries the public trial registry for matching studies; read-only discovery against already-published government data."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

