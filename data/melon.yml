actions:
  # ---------- Data Access ----------

  # source: https://mcp.melon.com/mcp
  - id: melon.get_recently_played_music_contents
    object: ListeningHistory
    action: get_recently_played_music_contents
    description: "Retrieves users' recently played songs or recently viewed playlists on Melon."
    category: Data Access
    risk: medium
    business_impact: "Exposes up to 100 items of the account holder's recent listening and browsing history, revealing personal habits and activity timing to the calling agent."
    compliance: [GDPR, CCPA]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://mcp.melon.com/mcp
  - id: melon.get_my_most_listened_songs
    object: ListeningHistory
    action: get_my_most_listened_songs
    description: "Retrieves the ranking of the user's most played songs over a specified period on Melon."
    category: Data Access
    risk: medium
    business_impact: "Returns a ranked play-count profile spanning weeks or months, a durable behavioural fingerprint of one identified subscriber."
    compliance: [GDPR, CCPA]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://mcp.melon.com/mcp
  - id: melon.get_my_liked_music_contents
    object: LikedContent
    action: get_my_liked_music_contents
    description: "Retrieves a list of all types of content the user has 'liked' on Melon."
    category: Data Access
    risk: medium
    business_impact: "Surfaces every song, album, artist, video and playlist the account holder has favourited, which can reveal taste, affiliation and personal preference."
    compliance: [GDPR, CCPA]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://mcp.melon.com/mcp
  - id: melon.get_my_created_playlists
    object: Playlist
    action: get_my_created_playlists
    description: "Retrieves a list of playlists 'created by me' on Melon."
    category: Data Access
    risk: medium
    business_impact: "Lists the playlists the account owner created, including unlisted ones, exposing personally curated collections and their titles."
    compliance: [GDPR, CCPA]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://mcp.melon.com/mcp
  - id: melon.get_song_streaming_report
    object: StreamingReport
    action: get_song_streaming_report
    description: "Provides streaming statistics or personal listening history for a specific song on Melon."
    category: Data Access
    risk: medium
    business_impact: "Reports a track's public streaming totals or, in 'my' mode, the caller's own play count and the date they first listened to it."
    compliance: [GDPR, CCPA]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://mcp.melon.com/mcp
  - id: melon.recommend_personalized_songs_by_dj_mallang
    object: Recommendation
    action: recommend_personalized_songs_by_dj_mallang
    description: "Provides personalized song recommendations based on the user's music preference on Melon."
    category: Data Access
    risk: medium
    business_impact: "Runs Melon's recommendation engine across the user's listening history, likes and playlists, profiling one identified subscriber to generate suggestions."
    compliance: [GDPR, CCPA]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

