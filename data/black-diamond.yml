  - id: black-diamond.blackdiamond_ask_data_warehouse
    object: DataWarehouse
    action: blackdiamond_ask_data_warehouse
    description: "Runs natural-language queries that are translated to SQL against the Black Diamond reporting data warehouse."
    category: Data Access
    risk: critical
    business_impact: "Answers free-form questions by querying the firm's entire reporting warehouse, so one call can pull holdings, balances, fees, and transaction history for every client under management."
