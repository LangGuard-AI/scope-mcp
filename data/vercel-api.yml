actions:
  # ---------- Identity & Access ----------

  # source: https://mcp.vercel.com
  - id: vercel-api.update_project_deployment_protection
    object: Project
    action: update_project_deployment_protection
    description: "Partially updates password protection, Vercel Authentication, and Trusted IP settings for a Vercel project."
    category: Identity & Access
    risk: critical
    business_impact: "Rewrites the access controls guarding a project's deployments, so a single call can strip password protection or widen the trusted-IP allowlist and expose a private environment to the internet."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.vercel.com
  - id: vercel-api.get_access_to_vercel_url
    object: Deployment
    action: get_access_to_vercel_url
    description: "Creates a temporary shareable link that bypasses authentication for protected Vercel deployments."
    category: Identity & Access
    risk: critical
    business_impact: "Mints a bypass link that lets anyone holding the URL reach an authentication-protected deployment without credentials, defeating the project's access control for the link's lifetime."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.vercel.com
  - id: vercel-api.web_fetch_vercel_url
    object: Deployment
    action: web_fetch_vercel_url
    description: "Fetches a Vercel deployment URL and returns the response, including deployments protected by Vercel Authentication."
    category: Identity & Access
    risk: high
    business_impact: "Pulls the rendered content of an authentication-gated deployment into the agent's context, surfacing unreleased pages and internal previews that the protection setting was meant to keep private."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.vercel.com
  - id: vercel-api.get_project_deployment_protection
    object: Project
    action: get_project_deployment_protection
    description: "Gets the effective password protection, Vercel Authentication, and Trusted IP settings for a project; password values are never returned."
    category: Identity & Access
    risk: low
    business_impact: "Reveals a project's deployment-protection posture including the trusted-IP allowlist, which maps exactly where the perimeter is weakest."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.vercel.com
  - id: vercel-api.list_teams
    object: Team
    action: list_teams
    description: "Lists the Vercel teams the authenticated user belongs to."
    category: Identity & Access
    risk: low
    business_impact: "Enumerates the teams the caller can act against, establishing the blast radius available to every other tool in the session."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # ---------- Financial ----------

  # source: https://mcp.vercel.com
  - id: vercel-api.buy_pro
    object: Subscription
    action: buy_pro
    description: "Executes a Vercel Pro upgrade previously quoted by get_purchase_quote, starting recurring Pro billing immediately."
    category: Financial
    risk: critical
    business_impact: "Starts a recurring monthly Pro subscription charged to the card on file, committing the organization to ongoing spend the moment the call succeeds."
    compliance: [SOX, COSO, PCI]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.vercel.com
  - id: vercel-api.buy_credits
    object: Purchase
    action: buy_credits
    description: "Executes a prepaid credits purchase for v0, AI Gateway, or Vercel Agent against a prior quote."
    category: Financial
    risk: critical
    business_impact: "Charges up to $1000 of prepaid credits to the default card immediately and non-refundably, with the credits expiring after one year whether used or not."
    compliance: [SOX, COSO, PCI]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.vercel.com
  - id: vercel-api.buy_domain
    object: Domain
    action: buy_domain
    description: "Executes a single-domain registration against a prior quote, supplying the full registrant contact details."
    category: Financial
    risk: critical
    business_impact: "Registers a domain with a non-refundable charge and transmits the registrant's name, address, email, and phone to the registrar, where auto-renew keeps billing each term."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOX, COSO, PCI]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://mcp.vercel.com
  - id: vercel-api.buy_addon
    object: Purchase
    action: buy_addon
    description: "Executes a Vercel add-on purchase (currently SIEM) by integer quantity against a prior quote."
    category: Financial
    risk: critical
    business_impact: "Adds a non-refundable, quantity-priced add-on to the team's next invoice with no API price shown at quote time, so the committed amount is unknown until billing."
    compliance: [SOX, COSO, PCI]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.vercel.com
  - id: vercel-api.get_purchase_quote
    object: Purchase
    action: get_purchase_quote
    description: "Returns a read-only price quote and the idempotencyKey required before any buy_* tool will execute."
    category: Financial
    risk: low
    business_impact: "Prices a purchase without charging anything, but mints the five-minute idempotencyKey that is the only thing standing between the agent and an executed charge."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://mcp.vercel.com
  - id: vercel-api.get_domain_order
    object: Domain
    action: get_domain_order
    description: "Gets the status of a domain purchase order returned by buy_domain."
    category: Financial
    risk: low
    business_impact: "Confirms whether a domain registration completed, exposing order state for purchases made in the same session."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Code & Release ----------

  # source: https://mcp.vercel.com
  - id: vercel-api.deploy_to_vercel
    object: Deployment
    action: deploy_to_vercel
    description: "Deploys a small project to Vercel from inline file contents supplied in the tool arguments."
    category: Code & Release
    risk: high
    business_impact: "Ships agent-authored code straight to a live Vercel deployment without passing through a git repository, so no pull request, reviewer, or CI gate ever sees the source."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://mcp.vercel.com
  - id: vercel-api.pause_project
    object: Project
    action: pause_project
    description: "Pauses a Vercel project so its production deployment stops serving traffic and returns 503."
    category: Code & Release
    risk: high
    business_impact: "Takes a project's production deployment offline for every visitor until someone unpauses it, converting one tool call into a full customer-facing outage."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://mcp.vercel.com
  - id: vercel-api.unpause_project
    object: Project
    action: unpause_project
    description: "Unpauses a Vercel project so its production deployment resumes serving traffic."
    category: Code & Release
    risk: medium
    business_impact: "Restores production traffic to a paused project and restarts consumption of metered compute and bandwidth, reviving whatever cost or incident prompted the pause."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://mcp.vercel.com
  - id: vercel-api.import-claude-design-from-url
    object: Design
    action: import-claude-design-from-url
    description: "Imports a design into Vercel from a publicly fetchable URL containing a self-contained HTML bundle."
    category: Code & Release
    risk: medium
    business_impact: "Pulls an externally hosted HTML bundle into the Vercel account as project content, making a third-party URL the source of code that can later be deployed."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
