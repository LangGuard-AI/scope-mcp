    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: postman.putCollection
    object: Collection
    action: putCollection
    description: "Replaces the entire contents of a collection."
    category: Collections
    risk: high
    business_impact: "Overwrites a collection wholesale including all requests, auth config, and embedded credentials; can clobber shared team definitions."
