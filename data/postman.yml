schema_version: "1.2"
platform: postman
display_name: Postman
source: langguard-editorial
updated: "2026-06"
server_version: "2026-06"
reference: https://github.com/postmanlabs/postman-mcp-server
# Tool ids are verbatim from the Postman MCP server's "full" toolset
# (https://mcp.postman.com/mcp), enumerated from the vendor's open-source
# registrations in src/enabledResources.ts (const full) and the per-tool
# `export const method` / `annotations.destructiveHint` declarations.
# Full surface is 125 tools (70 writes, 55 reads). Every write/destructive tool
# is retained; 44 routine single-entity reads, AI-context markdown views, and
# async task-status getters were trimmed (see provenance note in the PR).
actions:
  # ---------- Secrets & Variables ----------
  # Postman environments and global variables are the canonical place teams
  # store API credentials (bearer tokens, API keys, client secrets). Reads and
  # writes here are secret-management operations.
  - id: postman.updateWorkspaceGlobalVariables
    object: GlobalVariable
    action: updateWorkspaceGlobalVariables
    description: "Replaces all of a workspace's global variables with the supplied set."
    category: Secrets & Workflows
    risk: high
    business_impact: "Replaces every workspace-wide global variable in one call; can overwrite or leak stored API credentials shared across all collections."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: postman.getWorkspaceGlobalVariables
    object: GlobalVariable
    action: getWorkspaceGlobalVariables
    description: "Reads a workspace's global variables, which commonly hold API credentials."
    category: Secrets & Workflows
    risk: high
    business_impact: "Reads workspace global variables that frequently contain API keys and bearer tokens; a credential-disclosure surface."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: postman.createEnvironment
    object: Environment
    action: createEnvironment
    description: "Creates an environment (a named set of variables, often secrets)."
    category: Secrets & Workflows
    risk: medium
    business_impact: "Creates an environment that may store API credentials and connection settings used at request time; reversible."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: postman.putEnvironment
    object: Environment
    action: putEnvironment
    description: "Replaces all contents of an environment with the supplied data."
    category: Secrets & Workflows
    risk: high
    business_impact: "Overwrites an entire environment including any stored credentials; can leak or clobber secrets used by every request that references it."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: postman.patchEnvironment
    object: Environment
    action: patchEnvironment
    description: "Updates specific environment properties such as its name and variables."
    category: Secrets & Workflows
    risk: medium
    business_impact: "Modifies environment variables that may hold API credentials; reversible per-key change."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Identity & Access (Private API Network governance) ----------
  - id: postman.respondPrivateNetworkAddRequest
    object: PrivateNetworkRequest
    action: respondPrivateNetworkAddRequest
    description: "Approves or denies a request to add a workspace to the team's Private API Network (managers only)."
    category: Identity & Access
    risk: high
    business_impact: "Single-actor approval that adds a workspace to the org-wide internal API catalog; bypasses two-person review of what internal APIs become discoverable."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: postman.addWorkspaceToPrivateNetwork
    object: PrivateNetworkWorkspace
    action: addWorkspaceToPrivateNetwork
    description: "Publishes a workspace to the team's Private API Network."
    category: Identity & Access
    risk: medium
    business_impact: "Exposes a workspace's APIs to the entire team's Private API Network catalog; reversible by removal."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: postman.removeWorkspaceFromPrivateNetwork
    object: PrivateNetworkWorkspace
    action: removeWorkspaceFromPrivateNetwork
    description: "Removes a workspace from the team's Private API Network."
    category: Identity & Access
    risk: medium
    business_impact: "Withdraws a workspace from the internal API catalog; reversible but disrupts discoverability for the whole team."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: postman.listPrivateNetworkWorkspaces
    object: PrivateNetworkWorkspace
    action: listPrivateNetworkWorkspaces
    description: "Lists workspaces added to the team's Private API Network."
    category: Identity & Access
    risk: low
    business_impact: "Enumerates the org's internal API catalog; informational read of access-controlled inventory."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: postman.listPrivateNetworkAddRequests
    object: PrivateNetworkRequest
    action: listPrivateNetworkAddRequests
    description: "Lists pending requests to add workspaces to the Private API Network."
    category: Identity & Access
    risk: low
    business_impact: "Reads the queue of pending internal-API-catalog access requests; informational."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Data Exposure (public publishing & visibility) ----------
  - id: postman.publishMock
    object: Mock
    action: publishMock
    description: "Publishes a mock server, setting its access control to public."
    category: Data Access
