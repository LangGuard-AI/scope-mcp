    description: "Publishes a collection's documentation, making it publicly available to anyone with the link."
    category: Data Access
    risk: high
    business_impact: "Makes a collection's documentation publicly available, potentially exposing internal API structure, endpoints, and example payloads to the open internet."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: postman.unpublishMock
    object: Mock
    action: unpublishMock
    description: "Unpublishes a mock server, setting its access control to private."
    category: Data Access
    risk: medium
    business_impact: "Reverts a mock server to private; removes public access and breaks any consumer relying on the published URL."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: postman.unpublishDocumentation
    object: Documentation
    action: unpublishDocumentation
    description: "Unpublishes a collection's documentation."
    category: Data Access
    risk: medium
    business_impact: "Removes public documentation; reversible but breaks external links relying on it."
