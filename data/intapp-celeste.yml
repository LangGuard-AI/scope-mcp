  - id: intapp-celeste.dc_find_records
    object: "*"
    action: dc_find_records
    category: Data Access
    risk: high
    business_impact: "Queries DealCloud with an all-records mode that can return large sets of Deal, Company, and Contact data including personal information."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

