  - id: intapp-celeste.dc_query
    object: "*"
    action: dc_query
    category: Data Access
    risk: high
    business_impact: "Turns a plain-English question into a SQL query that can retrieve any DealCloud data, including contact and deal PII, across the entire dataset."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

