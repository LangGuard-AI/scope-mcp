schema_version: "1.1"
platform: hex
display_name: Hex
source: langguard-editorial
updated: "2026-06"
reference: https://learn.hex.tech/docs/administration/mcp-server
actions:
  # ---------- Data Access ----------
  - id: hex.create_thread
    object: Thread
    action: create_thread
    description: "Start a new Thread conversation"
    category: Data Access
    risk: medium
    business_impact: "Starts a Hex Agent conversation that can execute arbitrary SQL/analytic code over connected warehouses; a single prompt can trigger a bulk read of PII or financial data depending on the warehouse."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: hex.get_thread
    object: Thread
    action: get_thread
    description: "Retrieve messages and results from a Thread"
    category: Data Access
    risk: medium
    business_impact: "Returns the messages and query results of a Thread; this is the data-egress surface that exposes warehouse output and may include bulk PII or financial data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: hex.continue_thread
    object: Thread
    action: continue_thread
    description: "Add follow-up questions to an existing Thread"
    category: Data Access
    risk: medium
    business_impact: "Adds a follow-up prompt to a Thread, potentially executing additional arbitrary warehouse queries whose results may include bulk PII or financial data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Operations ----------
  - id: hex.search_projects
    object: Project
    action: search_projects
    description: "Find projects in your Hex workspace"
    category: Operations
    risk: low
    business_impact: "Returns project metadata (titles, descriptions, links) matching a query; reads catalog information, not warehouse rows."
    compliance: [SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
