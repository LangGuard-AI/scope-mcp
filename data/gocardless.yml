    id_form: capability
    description: "Subscriptions"
    category: Financial
    risk: high
    business_impact: "Creates recurring billing schedules that draw funds from a payer on every interval, committing future revenue without further review."
    compliance: [SOX, COSO, PSD2]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://support.gocardless.com/hc/en-gb/articles/26830050176028-Ask-AI-about-your-account
