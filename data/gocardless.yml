    id_form: capability
    description: "Look up refunds"
    reference: https://developer.gocardless.com/developer-tools/mcp/#query_your_account_data
    category: Financial
    risk: medium
    business_impact: "Reads refund records and their related payments, bulk-capable; financial-transaction data with customer PII masked."
    compliance: [GLBA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: low
    access_methods: [REST, MCP]

