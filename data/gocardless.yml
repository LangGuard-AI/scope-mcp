    category: Customer
    risk: medium
    business_impact: "Reads the account's customer directory, bulk-capable; customer PII, mitigated by automatic masking of email, phone, and bank details."
    compliance: [GLBA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
