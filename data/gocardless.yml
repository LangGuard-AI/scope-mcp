  # source: https://support.gocardless.com/hc/en-gb/articles/26830050176028-Ask-AI-about-your-account
  - id: gocardless.payments
    object: Payment
    action: payments
    id_form: capability
    description: "Payments"
    category: Financial
    risk: critical
    business_impact: "Creates, retries, and cancels bank debits against live customer mandates — money moves out of a payer's account and the collection lands in the merchant's revenue ledger."
    compliance: [SOX, COSO, PSD2, GLBA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://support.gocardless.com/hc/en-gb/articles/26830050176028-Ask-AI-about-your-account
  - id: gocardless.refunds
    object: Refund
    action: refunds
    id_form: capability
    description: "Refunds"
    category: Financial
    risk: critical
    business_impact: "Issues refunds that return collected funds to a payer, reversing recognised revenue and disbursing money with a single actor and no second approver."
    compliance: [SOX, COSO, PSD2, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://support.gocardless.com/hc/en-gb/articles/26830050176028-Ask-AI-about-your-account
  - id: gocardless.mandates
    object: Mandate
    action: mandates
    id_form: capability
    description: "Mandates"
    category: Financial
    risk: high
    business_impact: "Cancels a customer's Direct Debit authorisation, permanently ending the merchant's right to collect from that payer until a new mandate is signed."
    compliance: [SOX, COSO, PSD2, GDPR, UK_GDPR]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://support.gocardless.com/hc/en-gb/articles/26830050176028-Ask-AI-about-your-account
