    action: ask_incident
    description: "AI agent for incident investigation and management actions"
    category: AI Agents
    risk: medium
    business_impact: "Runs the incident AI agent that investigates and takes management actions on incidents, so a single prompt can mutate live incident state."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
