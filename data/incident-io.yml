actions:
  # ---------- Data Access ----------

  # source: https://docs.incident.io/ai/remote-mcp
  - id: incident-io.investigation_sync
    object: Investigation
    action: investigation_sync
    description: "Download a full investigation as an archive for LLM analysis"
    category: Data Access
    risk: high
    business_impact: "Downloads a complete incident investigation as an archive of timeline, telemetry, and communications, creating an offline copy of potentially sensitive operational and personal data outside incident.io's controls."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- AI Agents ----------

  # source: https://docs.incident.io/ai/remote-mcp
  - id: incident-io.ask
    object: "*"
    action: ask
    description: "AI agent for on-call queries, schedule management, and general questions"
    category: AI Agents
    risk: medium
    business_impact: "Runs the on-call AI agent that answers queries and takes schedule-management actions, giving broad natural-language reach across on-call state in a single call."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.incident.io/ai/remote-mcp
  - id: incident-io.ask_incident
