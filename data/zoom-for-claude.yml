schema_version: "1.1"
platform: zoom-for-claude
display_name: Zoom for Claude
source: langguard-editorial
updated: "2026-06"
reference: https://developers.zoom.us/docs/mcp/zoom/
actions:
  # ---------- Meeting Intelligence ----------
  - id: zoom-for-claude.search_meetings
    object: Meeting
    action: search_meetings
    description: "AI Companion-powered semantic search across meeting content with date filtering and pagination."
    category: Meeting Intelligence
    risk: high
    business_impact: "Surfaces meeting summaries and linked content via semantic search; results may expose private business conversations, customer PII, PHI, or material non-public information."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: zoom-for-claude.search_zoom
    object: SearchResult
    action: search_zoom
    description: "Cross-Zoom knowledge discovery over Team Chat messages, Zoom Docs, and My Notes with entity-type filtering."
    category: Meeting Intelligence
    risk: high
    business_impact: "Reads across Team Chat private messages and Zoom Docs; query results can surface confidential discussions, customer PII, or material non-public information."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: zoom-for-claude.get_meeting_assets
    object: Meeting
    action: get_meeting_assets
    description: "Retrieves documents, recordings, and related resources linked to a specific meeting."
    category: Meeting Intelligence
    risk: high
    business_impact: "Returns documents and recordings linked to a meeting; assets may contain verbatim private discussions, PII, or PHI."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: zoom-for-claude.get_recording_resource
    object: Recording
    action: get_recording_resource
    description: "Accesses recording playback resources, transcripts, and clips with timestamp and encoding parameters."
    category: Meeting Intelligence
    risk: high
    business_impact: "Returns recording playback, transcripts, and clips of a meeting; raw recording of private conversations may include PII or PHI."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, HIPAA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: zoom-for-claude.get_file_content
    object: Document
    action: get_file_content
    description: "Exports Markdown content from a returned Zoom Docs or My Notes file for inspection."
    category: Meeting Intelligence
    risk: high
    business_impact: "Returns the full Markdown body of a Zoom Doc or My Notes file; content may include confidential notes, customer PII, or material non-public information."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: zoom-for-claude.recordings_list
    object: Recording
    action: recordings_list
    description: "Lists the user's cloud recordings within a date range with trash and pagination filters."
    category: Meeting Intelligence
    risk: medium
    business_impact: "Lists cloud recordings with titles, dates, and meeting identifiers; recording titles alone can reveal sensitive context (M&A, layoffs, customer names)."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Documents ----------
  - id: zoom-for-claude.create_new_file_with_markdown
    object: Document
    action: create_new_file_with_markdown
    description: "Generates a new Zoom Doc from Markdown content with a customizable name and parent directory."
    category: Documents
    risk: low
    business_impact: "Creates a new Zoom Doc from agent-supplied Markdown; reversible and scoped to the user's own document space."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
