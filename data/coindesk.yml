  # ---------- Spot & Index Market Data ----------
  - id: coindesk.fetch_spot_instruments
    object: SpotInstrument
    action: fetch_spot_instruments
    description: "Lists the spot-market trading instruments available across exchanges."
    category: Data Access
    risk: low
    business_impact: "Returns a read-only catalog of spot instruments; aggregate market metadata, no personal data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

