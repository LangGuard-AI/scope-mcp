schema_version: "1.2"
platform: clickup
display_name: ClickUp
source: langguard-editorial
updated: "2026-06"
server_version: "2026-06"
reference: https://developer.clickup.com/docs/mcp-tools
# NOTE: ClickUp's hosted MCP server (https://mcp.clickup.com/mcp) gates tools/list
# behind OAuth, and the vendor publishes only plain-language capability labels in its
# supported-tools docs (no verbatim tool identifiers anywhere reachable). All actions
# below use id_form: capability per the curator spec's documented fallback — ids are
# intent-level slugs derived from the verbatim labels (preserved in `description`),
# not server tools/list identifiers. Confidence is capped at medium accordingly.
actions:
  # ---------- Members and assignees ----------
  - id: clickup.get_workspace_members
    object: Member
    action: get_workspace_members
    id_form: capability
    description: "Get Workspace Members"
    category: Identity & Access
    risk: high
    business_impact: "Returns the full directory of members and guests, including names and emails for every person in the Workspace."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: clickup.find_member_by_name
    object: Member
    action: find_member_by_name
    id_form: capability
    description: "Find Member by Name"
    category: Identity & Access
    risk: medium
    business_impact: "Resolves a single member from a name or email, returning that person's user record."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: clickup.resolve_assignees
    object: Member
    action: resolve_assignees
    id_form: capability
    description: "Resolve Assignees"
    category: Identity & Access
    risk: medium
    business_impact: "Confirms and returns user objects for a list of potential assignees, exposing personal identifiers."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

