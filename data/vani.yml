  # source: https://help.vanihq.com/portal/en/kb/vani/integrations-and-add-ons/vani-mcp/articles/vani-mcp-basics
  - id: vani.tables
    object: Table
    action: tables
    id_form: capability
    description: "Tables"
    category: Content
    risk: medium
    business_impact: "Rewrites cell text and inserts or deletes rows and columns, so table data an operating team relies on can be altered or removed without review."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://help.vanihq.com/portal/en/kb/vani/integrations-and-add-ons/vani-mcp/articles/vani-mcp-basics
