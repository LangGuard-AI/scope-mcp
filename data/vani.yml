reference: https://help.vanihq.com/portal/en/kb/vani/integrations-and-add-ons/vani-mcp/articles/vani-mcp-basics
# The Vani MCP server is OAuth-gated (sign-in required) and does not expose
# `tools/list` publicly; Zoho's MCP knowledge-base article documents the tool
# surface only as plain-language capability groupings. Every entry below is
# therefore `id_form: capability` with the vendor's label preserved verbatim in
# `description`. Refresh to `id_form: verbatim` when a real tools/list capture
# becomes available.
actions:
  # ---------- Identity & Access ----------

  # source: https://help.vanihq.com/portal/en/kb/vani/integrations-and-add-ons/vani-mcp/articles/vani-mcp-basics
  - id: vani.teams
    object: Team
    action: teams
    id_form: capability
    description: "Teams"
    category: Identity & Access
    risk: high
    business_impact: "Adds members to a team, changes member roles, and resolves access requests, so a single agent call can widen who reads and edits workspace content."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://help.vanihq.com/portal/en/kb/vani/integrations-and-add-ons/vani-mcp/articles/vani-mcp-basics
  - id: vani.sharing_and_access
    object: Share
    action: sharing_and_access
    id_form: capability
    description: "Sharing and access"
    category: Identity & Access
    risk: high
    business_impact: "Creates or updates external shares and lists published Space details, exposing internal boards and their contents to recipients outside the organization."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # ---------- Org & Access ----------

  # source: https://help.vanihq.com/portal/en/kb/vani/integrations-and-add-ons/vani-mcp/articles/vani-mcp-basics
  - id: vani.spaces
    object: Space
    action: spaces
    id_form: capability
    description: "Spaces"
    category: Org & Access
    risk: high
    business_impact: "Creates, renames, moves and duplicates Spaces while managing Spacemates and approving Space access requests, combining workspace restructuring with membership control."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

  # source: https://help.vanihq.com/portal/en/kb/vani/integrations-and-add-ons/vani-mcp/articles/vani-mcp-basics
  - id: vani.zones
    object: Zone
    action: zones
    id_form: capability
    description: "Zones"
    category: Org & Access
    risk: high
    business_impact: "Manages Zone-level access alongside Zone creation, renaming, moving and version history, so permissions on a canvas can be altered in the same call that reads its contents."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

