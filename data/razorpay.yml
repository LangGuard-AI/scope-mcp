schema_version: "1.1"
platform: razorpay
display_name: Razorpay
source: langguard-editorial
updated: "2026-06"
reference: https://razorpay.com/docs/mcp-server/tools-reference/
actions:
  # ---------- Financial ----------
  - id: razorpay.capture_payment
    object: Payment
    action: capture_payment
    description: "Change the payment status from authorized to captured."
    category: Financial
    risk: critical
    business_impact: "Captures previously authorized funds and settles the charge; an irreversible general-ledger and revenue-recognition event."
    compliance: [SOX, COSO, PCI, PSD2, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: razorpay.create_refund
    object: Refund
    action: create_refund
    description: "Creates a refund for a captured payment."
    category: Financial
    risk: critical
    business_impact: "Moves money back out of the merchant account to the payer; effectively irreversible once processed and a direct general-ledger event."
    compliance: [SOX, COSO, PCI, PSD2, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: razorpay.create_instant_settlement
    object: Settlement
    action: create_instant_settlement
    description: "Create an instant settlement that transfers held funds to the merchant bank account immediately."
    category: Financial
    risk: critical
    business_impact: "Triggers an immediate transfer of held balance to the merchant bank account, bypassing the standard settlement cycle; a direct cash-movement and GL event."
    compliance: [SOX, COSO, PCI, PSD2, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: razorpay.initiate_payment
    object: Payment
    action: initiate_payment
    description: "Initiate a payment using a saved payment method with order and customer details."
    category: Financial
    risk: high
    business_impact: "Initiates a charge against a customer's saved payment instrument; collects money and is revenue-recognition relevant."
    compliance: [SOX, COSO, PCI, PSD2, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: razorpay.submit_otp
    object: Payment
    action: submit_otp
    description: "Verify and submit OTP to complete payment authentication."
    category: Financial
    risk: high
    business_impact: "Completes strong-customer-authentication and finalizes collection of a payment; the step that commits the charge."
    compliance: [SOX, COSO, PCI, PSD2, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: razorpay.resend_otp
    object: Payment
    action: resend_otp
    description: "Resend OTP if the previous one was not received or expired."
    category: Financial
    risk: medium
    business_impact: "Re-sends a one-time passcode to the payer's phone or email as part of payment authentication; advances an in-flight collection."
    compliance: [PCI, PSD2, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: razorpay.update_payment
    object: Payment
    action: update_payment
    description: "Update the notes field of a payment."
    category: Financial
    risk: medium
    business_impact: "Edits the notes metadata on a payment record that is in scope for financial reconciliation; reversible but alters an audited transaction record."
    compliance: [SOX, COSO, PCI, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: razorpay.fetch_payment_card_details
    object: Payment
    action: fetch_payment_card_details
    description: "Fetch card details used for a payment."
    category: Financial
    risk: high
    business_impact: "Reads cardholder card data associated with a payment; cardholder-data access in PCI scope."
    compliance: [PCI, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: razorpay.fetch_all_payments
    object: Payment
    action: fetch_all_payments
    description: "Fetch all payments with filtering and pagination."
    category: Financial
    risk: high
    business_impact: "Bulk read of transaction records including payer identifiers and amounts; a data-exfiltration surface for financial and personal data."
    compliance: [PCI, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: razorpay.fetch_payment
    object: Payment
    action: fetch_payment
    description: "Fetch payment details with ID."
    category: Financial
    risk: low
    business_impact: "Reads a single payment record including payer details and amount; non-destructive but exposes transaction and personal data."
    compliance: [PCI, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: razorpay.fetch_order_payments
    object: Payment
    action: fetch_order_payments
    description: "Fetch all payments for an order."
    category: Financial
    risk: low
    business_impact: "Reads the payment records attached to an order; exposes transaction and payer data for that order."
    compliance: [PCI, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

