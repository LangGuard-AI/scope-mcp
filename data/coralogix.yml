actions:
  # ---------- Identity & Access ----------

  # source: https://coralogix.com/docs/user-guides/mcp-server/tools/overview/
  - id: coralogix.manage_custom_roles
    object: CustomRole
    action: manage_custom_roles
    category: Identity & Access
    risk: high
    business_impact: "Creates, updates, or deletes custom roles, changing what permissions principals hold across the account — a single call can broaden privileges past access-review controls."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Platform & DevOps ----------

  # source: https://coralogix.com/docs/user-guides/mcp-server/tools/overview/
  - id: coralogix.manage_integrations
    object: Integration
    action: manage_integrations
    category: Platform & DevOps
    risk: high
    business_impact: "Adds, edits, or removes integrations that connect Coralogix to external systems and may store their credentials, altering the account's outbound data and trust surface."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://coralogix.com/docs/user-guides/mcp-server/tools/overview/
  - id: coralogix.manage_connectors
    object: Connector
    action: manage_connectors
    category: Platform & DevOps
    risk: medium
    business_impact: "Configures Notification Center connectors that deliver alerts to external destinations, controlling where account signals and their payloads are routed off-platform."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://coralogix.com/docs/user-guides/mcp-server/tools/overview/
  - id: coralogix.manage_webhooks
    object: Webhook
    action: manage_webhooks
    category: Platform & DevOps
    risk: medium
    business_impact: "Creates or edits outbound webhooks that push Coralogix data to arbitrary external URLs, opening an egress path for observability content."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Operations ----------

  # source: https://coralogix.com/docs/user-guides/mcp-server/tools/overview/
  - id: coralogix.manage_tco_log_policies
    object: TCOPolicy
    action: manage_tco_log_policies
    category: Operations
    risk: high
    business_impact: "Sets TCO Optimizer policies that determine which logs are retained, downgraded, or dropped at ingest — a block policy can create gaps in the auditable log record."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://coralogix.com/docs/user-guides/mcp-server/tools/overview/
