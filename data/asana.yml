schema_version: "1.1"
platform: asana
display_name: Asana
source: langguard-editorial
updated: "2026-06"
reference: https://developers.asana.com/docs/mcp-tools-reference
# ---------------------------------------------------------------------------
# PROVENANCE
# Verbatim V2 tool ids transcribed from Asana's authoritative MCP tools
# reference (https://developers.asana.com/docs/mcp-tools-reference). The page
# documents exactly 25 V2 tools across three sections: 16 read, 6 write, and
# 3 interactive. Ids verified by direct raw-HTML grep of the reference page
# (each id appears in <code> tags); the hosted V2 server
# (https://mcp.asana.com/v2/mcp) is OAuth-gated so live tools/list returns 401,
# but the published reference is itself a primary, verbatim source.
#
# Naming notes confirmed against the source:
#   * create_tasks / update_tasks are PLURAL (batch up to 50).
#   * The user-roster read is get_users (NOT get_workspace_users — that string
#     does not appear anywhere on the reference page).
#   * delete_task ("Permanently deletes a task and subtasks") is a real V2 tool
#     and is included as irreversible destruction.
#   * create_task (singular) is NOT a V2 tool — it appears only in a V1->V2
#     migration note ("asana_create_task is now create_task"). Excluded.
# All ids are verbatim (id_form: verbatim, the default) — no capability-form.
# ---------------------------------------------------------------------------
actions:
  # ---------- Tasks ----------
  - id: asana.delete_task
    object: Task
    action: delete_task
    description: "Permanently deletes a task and its subtasks."
    category: Tasks
    risk: critical
    business_impact: "Irreversibly destroys a task and cascades to every subtask under it; no recovery path."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: asana.create_tasks
    object: Task
    action: create_tasks
    description: "Creates up to 50 tasks in a single operation."
    category: Tasks
    risk: low
    business_impact: "Adds new tasks to a project or workspace; reversible and individually audited."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: asana.update_tasks
    object: Task
    action: update_tasks
    description: "Updates up to 50 tasks in a single operation."
    category: Tasks
    risk: medium
    business_impact: "Modifies task fields including assignee, due date, and completion across many tasks; reassigns ownership or marks work done."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: asana.get_task
    object: Task
    action: get_task
    description: "Returns full details for a single task, including assignments, dates, and comments."
    category: Tasks
    risk: low
    business_impact: "Reads one task with its description, assignee, custom fields, and comments."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: asana.get_tasks
    object: Task
    action: get_tasks
    description: "Returns filtered task lists by project, section, tag, or assignee."
    category: Tasks
    risk: low
    business_impact: "Reads multiple tasks within a project, section, tag, or assignee scope."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: asana.get_my_tasks
    object: Task
    action: get_my_tasks
    description: "Returns tasks assigned to the authenticated user."
    category: Tasks
    risk: low
    business_impact: "Reads the authenticated user's own assigned tasks."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: asana.search_tasks
