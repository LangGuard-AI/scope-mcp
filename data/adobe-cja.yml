actions:
  # ---------- Create & Update ----------
  - id: adobe-cja.upsertAudience
    object: Audience
    action: upsertAudience
    description: "Creates new audiences or updates existing ones."
    category: Data Access
    risk: medium
    business_impact: "Creates or modifies an audience cohort used to target and activate identifiable individuals; reversible but shapes downstream profiling and activation."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: adobe-cja.upsertSegment
    object: Segment
    action: upsertSegment
    description: "Creates new segments or modifies existing ones."
    category: Data Access
    risk: medium
    business_impact: "Creates or modifies a segment definition that filters individuals by behavioral and personal attributes; reversible analytics-configuration change."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: adobe-cja.upsertCalculatedMetric
    object: CalculatedMetric
    action: upsertCalculatedMetric
    description: "Creates new calculated metrics or updates existing ones."
    category: Data Access
    risk: medium
    business_impact: "Creates or modifies a calculated-metric definition used across reports; reversible but can alter reported figures organization-wide."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: adobe-cja.upsertProject
    object: Project
    action: upsertProject
    description: "Creates new workspace projects or modifies existing ones with a direct workspace URL."
    category: Data Access
    risk: medium
    business_impact: "Creates or modifies a Workspace project that surfaces analytics on identifiable individuals; reversible business write."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: adobe-cja.createDateRange
    object: DateRange
    action: createDateRange
    description: "Establishes reusable date range components."
    category: Data Access
    risk: low
    business_impact: "Adds a reusable date-range component; reversible configuration object with no personal data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: adobe-cja.setDefaultSessionDataViewId
    object: Session
    action: setDefaultSessionDataViewId
    description: "Configures the default data view ID for the current session."
    category: Data Access
    risk: low
    business_impact: "Sets a session-scoped default data view; affects only the current session and persists no data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Reporting & Analysis ----------
  - id: adobe-cja.runReport
    object: Report
    action: runReport
    description: "Executes ranked reports with dimensions, metrics, and optional segments over specified date ranges."
    category: Data Access
    risk: medium
    business_impact: "Pulls analytics broken down by dimensions that can surface identifiable visitor data; reversible read of behavioral personal data."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

