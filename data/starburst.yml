actions:
  # ---------- Data Access ----------

  # source: https://claude.com/connectors/starburst
  - id: starburst.readOnlyQuery
    object: Query
    action: readOnlyQuery
    category: Data Access
    risk: high
    business_impact: "Runs ad-hoc SQL across every Starburst catalog the connected principal can reach, returning whatever customer, employee, or financial rows those tables hold."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.starburst.io/latest/starburst-ai/mcp-server.html
  - id: starburst.queryReadOnly
    object: Query
    action: queryReadOnly
    category: Data Access
    risk: high
    business_impact: "Executes read-only SQL against the Starburst cluster and returns structured results, exposing any federated source the query engine is configured to reach."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.starburst.io/latest/starburst-ai/mcp-server.html
  - id: starburst.parametrizedQuery
    object: Query
    action: parametrizedQuery
    category: Data Access
    risk: medium
    business_impact: "Runs an administrator-defined SQL template with agent-supplied parameters, returning governed result sets that can still contain personal or regulated records."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

