schema_version: "1.1"
platform: paypal
display_name: PayPal
source: langguard-editorial
updated: "2026-06"
reference: https://docs.paypal.ai/developer/tools/ai/agent-tools-ref
actions:
  # ---------- Payments ----------
  - id: paypal.create_order
    object: Order
    action: create_order
    description: "Create an order in the PayPal system based on the provided details."
    category: Financial
    risk: high
    business_impact: "Creates a payment order committing a charge intent against a buyer; reversible before capture but binds payment terms and counterparty PII."
    compliance: [SOX, COSO, PCI, GLBA, PSD2, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.pay_order
    object: Order
    action: pay_order
    description: "Capture payment for an authorized order."
    category: Financial
    risk: critical
    business_impact: "Captures funds from an authorized order; moves money and posts revenue with direct financial-statement impact."
    compliance: [SOX, COSO, PCI, GLBA, PSD2, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.create_refund
    object: Refund
    action: create_refund
    description: "Process a refund for a captured payment."
    category: Financial
    risk: critical
    business_impact: "Moves money back to a buyer against a captured payment; an irreversible disbursement that classically requires a second approver."
    compliance: [SOX, COSO, PCI, GLBA, PSD2, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.get_order
    object: Order
    action: get_order
    description: "Get details of a specific payment."
    category: Financial
    risk: medium
    business_impact: "Reads a single payment record including amount and counterparty financial details."
    compliance: [PCI, GLBA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.get_refund
    object: Refund
    action: get_refund
    description: "Get the details for a specific refund."
    category: Financial
    risk: medium
    business_impact: "Reads a single refund record including amount and payer financial details."
    compliance: [PCI, GLBA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Disputes ----------
  - id: paypal.accept_dispute_claim
    object: Dispute
    action: accept_dispute_claim
    description: "Accept a dispute claim, resolving it in favor of the buyer."
    category: Financial
    risk: critical
    business_impact: "Unilaterally concedes a dispute in the buyer's favor, triggering an irreversible money-out resolution with no second-actor gate."
    compliance: [SOX, COSO, PCI, GLBA, PSD2, SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.list_disputes
    object: Dispute
    action: list_disputes
    description: "Retrieve a summary of all disputes with optional filtering."
    category: Financial
    risk: medium
    business_impact: "Reads dispute records across the account, exposing transaction and counterparty details."
    compliance: [GLBA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.get_dispute
    object: Dispute
    action: get_dispute
    description: "Retrieve detailed information about a specific dispute."
    category: Financial
    risk: medium
    business_impact: "Reads detailed dispute information including transaction amounts and counterparty PII."
    compliance: [GLBA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Invoices ----------
  - id: paypal.create_invoice
    object: Invoice
    action: create_invoice
    description: "Create a new invoice in the PayPal system."
    category: Financial
    risk: high
    business_impact: "Creates an invoice carrying recipient email and line-item amounts; affects accounts-receivable records and stores counterparty PII."
    compliance: [SOX, COSO, GLBA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.send_invoice
    object: Invoice
    action: send_invoice
    description: "Send an existing invoice to the specified recipient."
    category: Financial
    risk: medium
    business_impact: "Dispatches an invoice to a recipient's email, initiating a billing demand for payment."
    compliance: [GLBA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.send_invoice_reminder
    object: Invoice
    action: send_invoice_reminder
    description: "Send a reminder for an existing invoice."
    category: Financial
    risk: low
    business_impact: "Sends a payment reminder to the invoice recipient; reversible and low-impact."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.cancel_sent_invoice
    object: Invoice
    action: cancel_sent_invoice
    description: "Cancel a sent invoice."
    category: Financial
    risk: medium
    business_impact: "Cancels an outstanding invoice, voiding the billing demand and affecting accounts-receivable state."
    compliance: [SOX, COSO, GLBA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.generate_invoice_qr_code
    object: Invoice
    action: generate_invoice_qr_code
    description: "Generate a QR code for an invoice."
    category: Financial
    risk: low
    business_impact: "Generates a payment QR code for an existing invoice; non-destructive and reversible."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.list_invoices
    object: Invoice
    action: list_invoices
    description: "List invoices. Pagination and filtering options are available."
    category: Financial
    risk: high
    business_impact: "Bulk read of invoice records exposing recipient PII and receivable amounts across the account."
    compliance: [GLBA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.get_invoice
    object: Invoice
    action: get_invoice
    description: "Retrieve details about a specific invoice."
    category: Financial
    risk: medium
    business_impact: "Reads a single invoice including recipient email and line-item amounts."
    compliance: [GLBA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Reporting & Insights ----------
  - id: paypal.get_merchant_insights
    object: MerchantInsight
    action: get_merchant_insights
    description: "Retrieve business intelligence metrics and analytics for a merchant, filtered by date range, insight type, and time interval."
    category: Financial
    risk: high
    business_impact: "Returns aggregated merchant sales/orders financial intelligence; exposes revenue performance data even though the metrics are aggregated rather than per-record PII."
    compliance: [SOX, COSO, GLBA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: paypal.list_transaction
    object: Transaction
    action: list_transaction
    description: "List all transactions. Pagination and filtering options are available."
    category: Financial
    risk: high
    business_impact: "Bulk read of transaction history exposing amounts and counterparty financial PII; a data-exfiltration surface for account-wide payment activity."
    compliance: [PCI, GLBA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Shipment Tracking ----------
  - id: paypal.create_shipment_tracking
    object: ShipmentTracking
    action: create_shipment_tracking
    description: "Create shipment tracking information for a PayPal transaction."
    category: Operations
    risk: medium
    business_impact: "Attaches shipment tracking to a transaction, signaling fulfillment and affecting buyer-protection and dispute outcomes."
    compliance: [GLBA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.get_shipment_tracking
    object: ShipmentTracking
    action: get_shipment_tracking
    description: "Get shipment tracking information for a specific shipment."
    category: Operations
    risk: low
    business_impact: "Reads shipment tracking details for a transaction; non-sensitive operational data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.update_shipment_tracking
    object: ShipmentTracking
    action: update_shipment_tracking
    description: "Update shipment tracking information for a specific shipment."
    category: Operations
    risk: medium
    business_impact: "Changes the tracking number or fulfillment status on a transaction, which can alter buyer-protection and dispute eligibility."
    compliance: [GLBA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Subscriptions ----------
  - id: paypal.create_subscription
