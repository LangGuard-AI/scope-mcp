    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.update_subscription
    object: Subscription
    action: update_subscription
    description: "Update an existing subscription."
    category: Financial
    risk: high
    business_impact: "Modifies an active subscription's billing terms, changing recurring revenue and the amounts charged to the subscriber."
    compliance: [SOX, COSO, GLBA, PSD2, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: paypal.cancel_subscription
    object: Subscription
    action: cancel_subscription
    description: "Cancel an active subscription."
    category: Financial
    risk: medium
    business_impact: "Terminates an active subscription, stopping recurring revenue; reversible only by re-subscribing."
    compliance: [SOX, COSO, GLBA, SOC2, ISO_27001]
