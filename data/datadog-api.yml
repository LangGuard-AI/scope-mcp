  # ---------- Security ----------

  # source: https://docs.datadoghq.com/mcp_server/tools/
  - id: datadog-api.create_datadog_security_detection_rule
    object: DetectionRule
    action: create_datadog_security_detection_rule
    category: Security
    risk: medium
    business_impact: "Creates a new security detection rule, changing which threat conditions generate signals across the organization."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datadoghq.com/mcp_server/tools/
  - id: datadog-api.update_datadog_security_detection_rule
    object: DetectionRule
    action: update_datadog_security_detection_rule
    category: Security
    risk: high
    business_impact: "Replaces an existing detection rule in full, which can broaden, narrow, or silence the conditions under which security signals fire."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datadoghq.com/mcp_server/tools/
  - id: datadog-api.delete_datadog_security_detection_rules
    object: DetectionRule
    action: delete_datadog_security_detection_rules
    category: Security
    risk: high
    business_impact: "Removes one or more custom detection rules, eliminating the signals they would have raised and leaving the covered threats unmonitored."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datadoghq.com/mcp_server/tools/
  - id: datadog-api.create_datadog_security_suppression
    object: Suppression
    action: create_datadog_security_suppression
    category: Security
    risk: high
    business_impact: "Adds a suppression rule that stops a detection rule from generating signals for matching activity, potentially masking real attacks."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datadoghq.com/mcp_server/tools/
  - id: datadog-api.delete_datadog_security_suppression
    object: Suppression
    action: delete_datadog_security_suppression
    category: Security
    risk: medium
    business_impact: "Deletes a suppression rule, restoring the signals a detection rule had been prevented from raising."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
