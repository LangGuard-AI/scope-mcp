  # source: https://docs.datadoghq.com/mcp_server/tools/
  - id: datadog-api.upsert_datadog_security_passlist
    object: Passlist
    action: upsert_datadog_security_passlist
    category: Security
    risk: high
    business_impact: "Creates or updates a WAF exclusion filter that suppresses rules on a matched target, reducing protection coverage on that surface."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datadoghq.com/mcp_server/tools/
  - id: datadog-api.delete_datadog_security_passlist
    object: Passlist
    action: delete_datadog_security_passlist
    category: Security
    risk: medium
    business_impact: "Deletes a WAF exclusion filter, reinstating the protection rules that the passlist entry had been suppressing."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

