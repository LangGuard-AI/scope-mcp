actions:
  # ---------- Secrets & Workflows ----------

  # source: https://docs.datadoghq.com/mcp_server/tools/
  - id: datadog-api.execute_code
    object: Sandbox
    action: execute_code
    category: Secrets & Workflows
    risk: critical
    business_impact: "Runs agent-authored TypeScript inside a Datadog-managed sandbox with a live Datadog client, so a single call can read or move any data the connection's scope permits."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datadoghq.com/mcp_server/tools/
  - id: datadog-api.datadog_remote_action_restricted_shell_run_command
    object: Host
    action: datadog_remote_action_restricted_shell_run_command
    category: Secrets & Workflows
    risk: high
    business_impact: "Runs read-only shell commands such as cat and ls on a targeted host, exposing on-host files, configuration, and potentially secrets to the caller."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datadoghq.com/mcp_server/tools/
  - id: datadog-api.datadog_secrets_scan
    object: Code
    action: datadog_secrets_scan
    category: Secrets & Workflows
    risk: high
    business_impact: "Scans code for hardcoded secrets and surfaces detected AWS keys, API keys, and passwords, concentrating credential locations in one result set."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datadoghq.com/mcp_server/tools/
  - id: datadog-api.execute_datadog_workflow
    object: Workflow
    action: execute_datadog_workflow
    category: Secrets & Workflows
    risk: medium
    business_impact: "Triggers a published workflow that carries an agent trigger, running whatever automation steps it defines against connected systems."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.datadoghq.com/mcp_server/tools/
  - id: datadog-api.update_datadog_workflow_with_agent_trigger
    object: Workflow
    action: update_datadog_workflow_with_agent_trigger
    category: Secrets & Workflows
    risk: high
    business_impact: "Adds an agent trigger to a workflow and publishes it, turning a static workflow into one an agent can invoke autonomously in production."
