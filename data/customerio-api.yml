actions:
  # ---------- Data Access ----------

  # source: https://docs.customer.io/ai/mcp/get-started/
  - id: customerio-api.cio_delete_api
    object: "*"
    action: cio_delete_api
    category: Data Access
    risk: critical
    business_impact: "Issues arbitrary authenticated DELETE calls against any Customer.io endpoint, irreversibly removing customer records, segments, or campaigns with no built-in recovery path."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.customer.io/ai/mcp/get-started/
  - id: customerio-api.cio_write_api
    object: "*"
    action: cio_write_api
    category: Data Access
    risk: high
    business_impact: "Issues arbitrary POST, PUT, and PATCH calls to any endpoint, letting the agent create or edit customer profiles, attributes, segments, and campaigns — including messaging that reaches real recipients."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.customer.io/ai/mcp/get-started/
  - id: customerio-api.cio_read_api
    object: "*"
    action: cio_read_api
    category: Data Access
    risk: high
    business_impact: "Issues arbitrary authenticated GET calls against any endpoint, enabling retrieval and listing of customer profiles, attributes, and behavioral event data at scale."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

