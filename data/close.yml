schema_version: "1.1"
platform: close
display_name: Close
source: langguard-editorial
updated: "2026-06"
reference: https://developer.close.com/mcp/tools
actions:
  # ---------- Customer (destructive PII) ----------
  - id: close.delete_lead
    object: Lead
    action: delete_lead
    description: "Permanently delete an existing lead (company) by ID."
    category: Customer
    risk: high
    business_impact: "Permanently deletes a lead and its associated company PII; irreversible single-record destruction."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: close.delete_contact
    object: Contact
    action: delete_contact
    description: "Permanently delete an existing contact."
    category: Customer
    risk: high
    business_impact: "Permanently deletes a contact including name, email, and phone PII; irreversible single-record destruction."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: close.delete_address
    object: Address
    action: delete_address
    description: "Delete an address from an existing lead (company)."
    category: Customer
    risk: medium
    business_impact: "Removes a postal address from a lead; personal-data deletion scoped to one field group."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

