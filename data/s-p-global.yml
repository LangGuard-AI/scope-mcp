schema_version: "1.1"
platform: s-p-global
display_name: S&P Global
source: langguard-editorial
updated: "2026-06"
reference: https://docs.kensho.com/llmreadyapi/mcp
# Tool surface is the Kensho LLM-Ready API ("kFinance") MCP server that powers the
# S&P Global connector. Tool names are verbatim from the open-source
# kensho-technologies/kfinance package (kfinance/integrations/tool_calling/all_tools.py
# -> ALL_TOOLS; each tool's `name` attribute is what the MCP server registers).
# Every tool is a read-only get_* against S&P Global / Capital IQ datasets:
# no writes, deletes, money movement, or provisioning exist on this connector.
# Subject matter is public-company financial/market data (legal entities), so SOX/COSO
# and consumer-privacy regimes generally do NOT apply; the two `professionals` tools are
# the exception (they return named individuals = business-contact PII).
actions:
  # ---------- Financials & Statements ----------
  - id: s-p-global.get_financial_statement_from_identifiers
    object: FinancialStatement
    action: get_financial_statement_from_identifiers
    description: "Get a financial statement (balance_sheet, income_statement, or cashflow) for a group of company identifiers."
    category: Financial
    risk: low
    business_impact: "Reads licensed S&P Global / Capital IQ financial statements for public companies; reference data, not a write to the caller's own ledger."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: s-p-global.get_financial_line_item_from_identifiers
    object: FinancialLineItem
    action: get_financial_line_item_from_identifiers
    description: "Get a specific financial line item (e.g. revenue, EBITDA) for a list of identifiers over a time range."
    category: Financial
    risk: low
    business_impact: "Reads individual licensed financial line items for public companies; reference data only."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: s-p-global.get_segments_from_identifiers
    object: BusinessSegment
    action: get_segments_from_identifiers
    description: "Get the templated business or geographic segments associated with a list of identifiers."
    category: Financial
    risk: low
    business_impact: "Reads licensed business/geographic segment breakdowns for public companies; reference data only."
    compliance: [SOC2, ISO_27001]
