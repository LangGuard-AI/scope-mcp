  # source: https://raw.githubusercontent.com/dremio/dremio-mcp/main/docs/tools.md
  - id: dremio-cloud.RunSqlQuery
    object: Query
    action: RunSqlQuery
    category: Data Access
    risk: critical
    business_impact: "Runs arbitrary SELECT queries against the lakehouse, enabling bulk read of entire tables and mass extraction of any personal or confidential data the connected identity can reach."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://raw.githubusercontent.com/dremio/dremio-mcp/main/docs/tools.md
  - id: dremio-cloud.SemanticSearch
    object: Search
    action: SemanticSearch
    category: Data Access
    risk: high
    business_impact: "Searches semantically across the whole cluster, surfacing table contents that may include PII or proprietary business data in the results."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

