actions:
  # ---------- People & Entity Reference ----------
  # These tools return data about identifiable individuals (executives, board
  # members) and entity reference records. Tagged with the privacy stack;
  # confidence is medium because the data is public-figure professional data
  # rather than consumer PII, so privacy-regime applicability is real but milder.
  - id: factset.FactSet_People
    object: Person
    action: FactSet_People
    description: "Retrieve executive profiles, leadership rosters, compensation analysis, employment history, and board composition data."
    category: Data Access
    risk: medium
    business_impact: "Reads personal data about identifiable individuals — names, titles, employment history, and compensation for company executives and board members."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: factset.FactSet_EntityReference
    object: Entity
    action: FactSet_EntityReference
    description: "Get comprehensive entity reference data including business profiles, location information, and parent company relationships for 16M+ entities."
    category: Data Access
    risk: medium
    business_impact: "Reads entity reference data covering 16M+ entities, which can include personal data for individual proprietors and private entities."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: factset.FactSet_Entity
    object: Entity
    action: FactSet_Entity
    description: "Retrieve entity reference information such as parent, associated debt instruments, and corporate structures."
    category: Data Access
    risk: low
    business_impact: "Reads corporate-structure reference data — entity hierarchies, listings, and associated debt instruments."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Ownership & Market Microstructure ----------
  - id: factset.FactSet_Ownership
    object: Ownership
    action: FactSet_Ownership
    description: "Get fund holdings, institutional ownership, insider trading activity, and shareholder position changes."
    category: Data Access
    risk: medium
    business_impact: "Reads ownership and insider-trading data including institutional positions and shareholder changes, sensitive financial-market information relevant to financial-institution compliance."
    compliance: [GLBA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Company Financials & Estimates ----------
  - id: factset.FactSet_Fundamentals
    object: Fundamentals
    action: FactSet_Fundamentals
