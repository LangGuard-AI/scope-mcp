  - id: factset.FactSet_EstimatesConsensus
    object: Estimate
    action: FactSet_EstimatesConsensus
    description: "Retrieve consensus estimates, earnings surprises, analyst ratings, segment projections, and company guidance data."
    category: Data Access
    risk: low
    business_impact: "Reads analyst consensus estimates and ratings; licensed third-party market data with no PII."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: factset.FactSet_Metrics
    object: Metric
    action: FactSet_Metrics
    description: "Discover valid metric codes for Fundamentals and Estimates APIs before making data requests."
    category: Data Access
    risk: low
    business_impact: "Reads the catalogue of valid metric codes; a metadata-discovery read with no business-data exposure."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

