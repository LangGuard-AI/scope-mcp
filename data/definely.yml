# The Definely connector for Claude (https://claude.com/connectors/definely, US
# region https://mcp.us.definely.com) is an OAuth-gated MCP server whose
# tools/list is not publicly enumerable. Definely's vendor docs publish the tool
# surface only as plain-language capability labels. Per the rubric's
# id_form: capability path, every entry below carries a slug `action` and the
# verbatim label in `description`. Refresh to id_form: verbatim when a real
# tools/list capture becomes available.
reference: https://help.definely.com/en/articles/634922-definely-connector-for-claude-user-guide
actions:
  # ---------- Data Access ----------

  # source: https://help.definely.com/en/articles/634922-definely-connector-for-claude-user-guide
  - id: definely.vault_search
    object: Document
    action: vault_search
    id_form: capability
    description: "Vault Search"
    category: Data Access
    risk: medium
    business_impact: "Runs semantic and keyword search across the user's entire document library, surfacing matching contracts and their contents at corpus scale."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [MCP]
    source: langguard-editorial

