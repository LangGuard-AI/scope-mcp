  - id: lusha.prospecting_contact_enrich
    object: Contact
    action: prospecting_contact_enrich
    description: "Enrich contacts by ID to reveal emails and phones (credits consumed)"
    category: Data Access
    risk: critical
    business_impact: "Reveals direct email addresses and mobile numbers for a batch of individuals in one call, pulling third-party personal data into the agent's context and burning purchased credits per record."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

