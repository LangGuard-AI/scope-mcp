actions:
  # ---------- Secrets & Workflows ----------

  # source: https://raw.githubusercontent.com/github/github-mcp-server/main/README.md
  - id: github-api.list_secret_scanning_alerts
    object: SecretScanningAlert
    action: list_secret_scanning_alerts
    category: Secrets & Workflows
    risk: high
    business_impact: "Enumerates every secret-scanning alert in a repository, revealing the locations of leaked credentials, tokens, and keys at scale."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://raw.githubusercontent.com/github/github-mcp-server/main/README.md
  - id: github-api.get_secret_scanning_alert
    object: SecretScanningAlert
    action: get_secret_scanning_alert
    category: Secrets & Workflows
    risk: medium
    business_impact: "Returns the details of a single secret-scanning alert, exposing which credential leaked and where it was committed."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]
    source: langguard-editorial

  # source: https://raw.githubusercontent.com/github/github-mcp-server/main/README.md
