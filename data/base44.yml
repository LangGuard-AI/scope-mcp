schema_version: "1.1"
platform: base44
display_name: Base44
source: langguard-editorial
updated: "2026-06"
reference: https://docs.base44.com/developers/backend/overview/mcp-server
actions:
  # ---------- Platform & DevOps ----------
  - id: base44.edit_base44_app
    object: Project
    action: edit_base44_app
    description: "Make changes to an existing project"
    category: Platform & DevOps
    risk: high
    business_impact: "Modifies an existing project's code or configuration; unilaterally changes live application behavior without a separate review gate."
    compliance: [SOC2, ISO_27001]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: base44.create_base44_app
    object: Project
    action: create_base44_app
    description: "Create a new project from a text description"
    category: Platform & DevOps
    risk: medium
    business_impact: "Generates a new full-stack project from a prompt; adds application surface area that is reversible by deletion."
    compliance: [SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: base44.get_app_status
    object: Build
    action: get_app_status
    description: "Check whether a project build is complete"
    category: Platform & DevOps
    risk: low
    business_impact: "Reads the build/deploy status of a project; no state change."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: base44.get_app_preview_url
    object: Build
    action: get_app_preview_url
    description: "Get the preview link for a project once its build is ready"
    category: Platform & DevOps
    risk: low
    business_impact: "Returns the live preview URL for a built project; exposes a reachable link to the running app."
    compliance: []
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  # ---------- Data Access ----------
  - id: base44.query_entities
    object: Entity
    action: query_entities
    description: "Query records from an entity in a project"
    category: Data Access
    risk: high
    business_impact: "Reads arbitrary records from a project's entities; result set may include end-user PII stored by the app."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: base44.list_entity_schemas
    object: EntitySchema
    action: list_entity_schemas
    description: "Get the entity schemas for a project"
    category: Data Access
    risk: low
    business_impact: "Returns the entity (table) schema definitions for a project; structure only, no record data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: base44.list_user_apps
    object: Project
    action: list_user_apps
    description: "List your projects, optionally filtered by name"
    category: Data Access
    risk: low
    business_impact: "Lists projects owned by the authenticated user; metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
