schema_version: "1.1"
platform: calendly
display_name: Calendly
source: langguard-editorial
updated: "2026-06"
reference: https://developer.calendly.com/supported-tools
actions:
  # ---------- Users & Org ----------
  - id: calendly.organizations-create_organization_invitation
    object: OrganizationInvitation
    action: organizations-create_organization_invitation
    description: "Invites a new user to join the organization."
    category: Users & Org
    risk: high
    business_impact: "Invites a new user to the organization; expands the access surface and provisions a new member."
    compliance: [SOC2, ISO_27001, NIST_CSF]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]

  - id: calendly.organizations-revoke_organization_invitation
    object: OrganizationInvitation
    action: organizations-revoke_organization_invitation
    description: "Revokes a pending organization invitation."
    category: Users & Org
    risk: medium
    business_impact: "Cancels a pending invitation before it is accepted; reversible by re-inviting."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: calendly.organizations-list_organization_memberships
    object: OrganizationMembership
    action: organizations-list_organization_memberships
    description: "Lists members of an organization with their roles."
    category: Users & Org
    risk: medium
    business_impact: "Enumerates organization members with role information; exposes the access roster."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: calendly.organizations-get_organization_membership
    object: OrganizationMembership
    action: organizations-get_organization_membership
    description: "Reads a single organization membership record."
    category: Users & Org
    risk: low
    business_impact: "Reads one membership record including the member's role."
    compliance: [SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: calendly.organizations-list_organization_invitations
    object: OrganizationInvitation
    action: organizations-list_organization_invitations
    description: "Lists pending invitations to join the organization."
    category: Users & Org
    risk: low
    business_impact: "Lists outstanding invitations to join the org; metadata only."
    compliance: [SOC2]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: calendly.organizations-get_organization
    object: Organization
    action: organizations-get_organization
    description: "Reads tenant-level organization metadata."
    category: Users & Org
    risk: low
    business_impact: "Reads tenant-level organization metadata; non-personal configuration data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: calendly.users-get_user
    object: User
    action: users-get_user
    description: "Reads a user record by id."
    category: Users & Org
    risk: low
    business_impact: "Reads a user record including name, email, and role; single-record PII read."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: calendly.users-get_current_user
    object: User
    action: users-get_current_user
    description: "Returns the identity of the calling user."
    category: Users & Org
    risk: low
    business_impact: "Returns the calling user's own identity; self-scoped read."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Meetings ----------
  - id: calendly.meetings-cancel_event
    object: Event
    action: meetings-cancel_event
    description: "Cancels a scheduled event."
    category: Meetings
    risk: medium
    business_impact: "Cancels a scheduled meeting and notifies invitees; affects their plans but is reversible by rebooking."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: calendly.meetings-create_invitee
