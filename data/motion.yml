    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  # ---------- Feedback / Data Egress ----------
  # Documented in prose only (Troubleshooting + FAQ); accounts for the vendor's
  # "14 tools" count vs the 13-row Available Tools table. No verbatim tool id is
  # published and the OAuth-gated server cannot be introspected anonymously, so
  # this is curated via the capability-form fallback. The egressed payload is
  # the free-form conversation context, which can contain personal data
  # depending on what the user discussed — hence the privacy + confidentiality
  # tagging (export/exfil heuristic) and confidence: low pending a verbatim id.
  # access_methods is [MCP] only: the egress is described purely as an MCP-
  # session behavior, with no documented REST endpoint.
  - id: motion.submit_feedback
    object: Feedback
    action: submit_feedback
    id_form: capability
    description: "submit feedback to Motion"
    reference: https://help.motionapp.com/en/articles/14315735-motion-mcp
    category: Data Egress
    risk: medium
    business_impact: "Packages up the session's conversation context and sends it directly to Motion's team; a third-party data-egress event whose payload may contain personal data the user discussed, outside the read-only account surface."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: low
    access_methods: [MCP]
