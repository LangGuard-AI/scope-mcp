# Motion (motionapp.com) — Creative Analytics platform for Meta ad-creative
# performance. The hosted MCP server at https://projects.motionapp.com/mcp is
# OAuth-gated. The vendor docs state "14 tools across six categories"; the
# Available Tools table enumerates 13 verbatim get_*/search_* read tools
# (creative performance, workspace context, competitor/brand intelligence,
# saved reports, AI tags, auth context). The 14th is a feedback-submission tool
# that EGRESSES the conversation context to Motion's team ("submit feedback to
# Motion ... the MCP will package up the conversation context and send it
# directly to our team"). It is documented in prose only (Troubleshooting + FAQ)
# with NO verbatim tool id published anywhere reachable; the server is OAuth-
# gated so tools/list cannot be introspected anonymously. It is curated below
# via the capability-form fallback (id_form: capability, confidence: low). The
# vendor "read-only" claim is scoped to "doesn't modify your account, creatives,
# or settings" and does NOT cover this egress. No financial, destructive, or
# identity/admin surface is exposed.
actions:
  # ---------- Creative Performance ----------
  - id: motion.get_creative_insights
    object: Creative
    action: get_creative_insights
    description: "The primary analytics tool; returns your creatives ranked by performance, sortable by spend, ROAS, purchases, CPA, CPC, CTR, hook rate, and scaling status, with date and AI-tag filtering."
    category: Data Access
    risk: low
    business_impact: "Reads the workspace's own ad-creative performance metrics; aggregate marketing analytics with no personal data and no state change."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: motion.get_creative_summary
    object: Creative
    action: get_creative_summary
    description: "Gets an AI-generated digest for a single creative: detected format, plain-language summary, best hook/headline, and CTAs."
    category: Data Access
    risk: low
    business_impact: "Reads an AI-generated summary of one of the workspace's own ad creatives; marketing content only, no personal data and no state change."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: motion.get_creative_transcript
    object: Creative
    action: get_creative_transcript
    description: "Pulls the spoken transcript of a video creative with timed segments, including language detection and English translation for non-English content."
    category: Data Access
    risk: low
    business_impact: "Reads the transcript of the workspace's own video ad creative; published marketing content with no personal data and no state change."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: motion.get_demographic_breakdown
    object: DemographicBreakdown
    action: get_demographic_breakdown
    description: "Breaks down ad performance by age (18-24 through 65+) and gender, with metrics including spend, ROAS, purchase value, cost per purchase, and thumbstop ratio."
    category: Data Access
    risk: medium
    business_impact: "Reads ad performance split by audience age and gender; aggregate demographic data (not identifiable individuals) but processes age/gender attributes governed by privacy regimes."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

