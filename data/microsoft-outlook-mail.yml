  # source: https://support.claude.com/en/articles/12684923-microsoft-365-connector-security-guide
  - id: microsoft-outlook-mail.outlook_send_mail
    object: Message
    action: outlook_send_mail
    category: Messaging
    risk: high
    business_impact: "Sends an email as the user to arbitrary recipients, enabling disclosure of mailbox data to external parties and impersonation of the account owner."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

