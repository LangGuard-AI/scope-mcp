    action: get_all_entities
    category: Customer
    risk: critical
    business_impact: "Enumerates every entity in the firm — clients, households, trusts, legal entities and accounts — handing a single caller the complete advised-client roster in one call."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, GLBA, SOC2, ISO_27001]
    sod_concern: true
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

