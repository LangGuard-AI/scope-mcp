schema_version: "1.3"
platform: stripe-api
display_name: Stripe API
logo: https://stripe.com/favicon.ico
source: langguard-editorial
updated: "2026-09"
mcp_server_url: https://mcp.stripe.com
actions:
  # ---------- Financial ----------

  # source: https://docs.stripe.com/mcp
  - id: stripe-api.stripe_api_write
    object: "*"
    action: stripe_api_write
    category: Financial
    risk: critical
    business_impact: "Executes any Stripe POST, PATCH, PUT or DELETE call, so a single invocation can move money, issue refunds, or delete customer and payment records."
    compliance: [PCI, PSD2, SOX, COSO, SOC2, ISO_27001, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: true
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.stripe.com/mcp
  - id: stripe-api.stripe_api_read
    object: "*"
    action: stripe_api_read
    category: Financial
    risk: high
    business_impact: "Reads any Stripe GET endpoint, including bulk customer, charge, and payout listings that carry billing PII and card metadata."
    compliance: [PCI, SOC2, ISO_27001, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.stripe.com/mcp
  - id: stripe-api.stripe_analytics
    object: "*"
    action: stripe_analytics
    category: Financial
    risk: high
    business_impact: "Runs natural-language-generated SQL over Stripe Sigma to produce billing metrics and financial reports, returning aggregate revenue data and customer-level rows."
    compliance: [SOX, COSO, SOC2, ISO_27001, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.stripe.com/mcp
  - id: stripe-api.get_balance_summary
    object: Balance
    action: get_balance_summary
    category: Financial
    risk: medium
    business_impact: "Exposes available, pending, and Treasury account balances for the connected Stripe account."
    compliance: [GLBA, SOX, COSO, SOC2, ISO_27001]
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]
    source: langguard-editorial

  # ---------- Identity & Access ----------

  # source: https://claude.com/connectors/stripe
  - id: stripe-api.manage_stripe_accounts
    object: Account
    action: manage_stripe_accounts
    category: Identity & Access
    risk: high
    business_impact: "Administers the Stripe accounts the connection operates against, changing which merchant ledger subsequent payment and payout calls hit."
    compliance: [SOX, COSO, SOC2, ISO_27001]
    sod_concern: false
    confidence: low
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://claude.com/connectors/stripe
  - id: stripe-api.list_available_accounts_or_orgs
    object: Account
    action: list_available_accounts_or_orgs
    category: Identity & Access
    risk: low
    business_impact: "Enumerates the Stripe accounts and organizations reachable with the supplied credential."
    compliance: []
    sod_concern: false
    confidence: low
    access_methods: [REST, MCP]
    source: langguard-editorial

  # source: https://docs.stripe.com/mcp
  - id: stripe-api.get_stripe_account_info
    object: Account
    action: get_stripe_account_info
    category: Identity & Access
    risk: low
    business_impact: "Reads configuration and identity metadata for the connected Stripe account."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]
    source: langguard-editorial

