schema_version: "1.2"
platform: fmp
display_name: Financial Modeling Prep
source: langguard-editorial
updated: "2026-06"
server_version: "2026-06"
server_website: https://financialmodelingprep.com/developer/docs/mcp-server
maintainer: info@financialmodelingprep.com
reference: https://site.financialmodelingprep.com/developer/docs/mcp-server
# PROVENANCE: The official FMP hosted MCP server (https://financialmodelingprep.com/mcp?apikey=...)
# is apikey-gated and returns 401 to anonymous tools/list, so the full verbatim tool surface
# could not be introspected. The claude.com/connectors/fmp page states the server exposes
# "27 read-only tools"; the FMP MCP docs page is marketing prose that does not enumerate ids.
# Exactly ONE verbatim tool id was confirmable, from the official docs' FastMCP code example
# (`Tool(name="quote", ...)` / `client.call_tool("quote", {"symbol":"AAPL"})`): the `quote` tool,
# recorded below as id_form: verbatim. The official server uses bare lowercase tool names — this
# rules out the community GitHub servers' conflicting `get_*` ids (imbenrabi, cdtait, ccdatatraits),
# which are SEPARATE implementations and were NOT used.
# All other entries are id_form: capability, derived from capability labels explicitly attested in
# the claude.com connector prose and the FMP docs/nav. They are intent-level matches (confidence
# capped at medium), NOT verbatim identifiers. The set was intentionally NOT padded to 27.
# RISK/REGIME NOTE: Every FMP tool is a READ over PUBLIC market data (published company financials,
# stock/crypto/forex/commodity prices, SEC filings, public insider/congressional disclosures).
# This is third-party public-record data, NOT the customer's own books or customer PII — so SOX,
# COSO, GLBA, and PCI do NOT apply (those govern a firm's own financial-reporting controls and
# consumer financial-account data, neither of which this connector touches). Most arrays are [].
actions:
  # ---------- Market Data ----------
  - id: fmp.quote
    object: Quote
    action: quote
    description: "Returns a real-time price quote for a ticker symbol."
    category: Data Access
    risk: low
    business_impact: "Reads a real-time public market quote; read-only and non-sensitive."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: fmp.get_historical_prices
    object: PriceHistory
    action: get_historical_prices
    id_form: capability
    description: "Real-time and historical financial data"
    category: Data Access
