schema_version: "1.1"
platform: 10x-genomics-cloud
display_name: 10x Genomics Cloud
source: langguard-editorial
updated: "2026-06"
reference: https://www.10xgenomics.com/support/software/cloud-analysis/latest/tutorials/cloud-mcp-server
actions:
  # ---------- Data Movement ----------
  - id: 10x-genomics-cloud.upload_fastqs
    object: Fastq
    action: upload_fastqs
    description: "Uploads FASTQ files from a local path to a project."
    category: Data Access
    risk: high
    business_impact: "Ingests raw sequencing reads, which constitute special-category genetic personal data and may carry re-identifiable subject information (genetic-discrimination exposure under GINA)."
    compliance: [HIPAA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: 10x-genomics-cloud.download_analysis_files
    object: AnalysisFile
    action: download_analysis_files
    description: "Downloads all files from an analysis to a specified local path."
    category: Data Access
    risk: high
    business_impact: "Exfiltrates a full analysis output set to local disk; single-cell results derive from genetic personal data and may permit re-identification (genetic-discrimination exposure under GINA)."
    compliance: [HIPAA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: 10x-genomics-cloud.download_project_file
    object: ProjectFile
    action: download_project_file
    description: "Downloads a specific file from a project to a local path."
    category: Data Access
    risk: medium
    business_impact: "Retrieves a single project file to local disk; may include sample manifests carrying subject identifiers."
    compliance: [HIPAA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: 10x-genomics-cloud.upload_project_file
    object: ProjectFile
    action: upload_project_file
    description: "Uploads a local file to a project."
    category: Operations
    risk: medium
    business_impact: "Stores a project-level file that may contain a sample manifest with subject identifiers; reversible."
    compliance: [GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  # ---------- Analyses ----------
  - id: 10x-genomics-cloud.create_cellranger_count_analysis
    object: Analysis
    action: create_cellranger_count_analysis
    description: "Creates a new Cell Ranger 'count' analysis for single-sample gene expression."
    category: Operations
    risk: medium
    business_impact: "Launches a long-running, billable compute pipeline over genetic personal data; reversible but consumes compute credits (genetic-discrimination exposure under GINA)."
    compliance: [HIPAA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: 10x-genomics-cloud.create_cellranger_multi_analysis
    object: Analysis
    action: create_cellranger_multi_analysis
    description: "Creates a new Cell Ranger 'multi' analysis for Flex, multimodal, feature-barcoding, or multiplexed samples."
    category: Operations
    risk: medium
    business_impact: "Launches a long-running, billable multi-library pipeline over genetic personal data; reversible but consumes compute credits (genetic-discrimination exposure under GINA)."
    compliance: [HIPAA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: 10x-genomics-cloud.create_cellranger_aggr_analysis
    object: Analysis
    action: create_cellranger_aggr_analysis
    description: "Creates a new Cell Ranger 'aggr' analysis to aggregate multiple runs."
    category: Operations
    risk: medium
    business_impact: "Aggregates multiple sequencing runs into a combined dataset of genetic personal data; reversible but consumes compute credits (genetic-discrimination exposure under GINA)."
    compliance: [HIPAA, GDPR, UK_GDPR, CCPA, PIPEDA, LGPD, APPI, PIPL, POPIA, SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP, CLI]

  - id: 10x-genomics-cloud.list_analyses
    object: Analysis
    action: list_analyses
    description: "Lists all analyses in a specific project."
    category: Data Access
    risk: low
    business_impact: "Enumerates analyses within a project; metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: 10x-genomics-cloud.get_analysis_details
    object: Analysis
    action: get_analysis_details
    description: "Shows details about a single analysis."
    category: Data Access
    risk: low
    business_impact: "Reads run configuration and status for one analysis; metadata only."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  - id: 10x-genomics-cloud.list_analysis_files
    object: AnalysisFile
    action: list_analysis_files
    description: "Lists all files within a single analysis."
    category: Data Access
    risk: low
    business_impact: "Enumerates output file names for one analysis; does not transfer file contents."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP, CLI]

  # ---------- Projects ----------
  - id: 10x-genomics-cloud.create_project
