    access_methods: [REST, MCP]

  # ---------- Workflow Execution ----------
  - id: airops.run_grid_rows
    object: Grid
    action: run_grid_rows
    description: "Triggers AirOps workflow execution across the specified grid rows."
    category: Operations
    risk: medium
    business_impact: "Executes automated AirOps workflows over grid rows, consuming credits and producing or overwriting generated output; reversible per row but runs immediately."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: airops.write_grid
    object: Grid
    action: write_grid
    description: "Creates or updates rows in a grid table."
    category: Operations
    risk: medium
    business_impact: "Writes customer-supplied data into grid rows; reversible by overwriting but mutates working data that may feed downstream workflows."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: airops.add_grid_column
    object: Grid
    action: add_grid_column
    description: "Adds a new column to a grid table."
    category: Operations
    risk: low
    business_impact: "Adds a column to a grid schema; reversible and non-destructive to existing row data."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: airops.get_grid_row_execution_status
    object: Grid
    action: get_grid_row_execution_status
    description: "Checks the execution status of grid workflow rows."
    category: Operations
    risk: low
    business_impact: "Reads workflow execution status for grid rows; read-only with no state change."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

