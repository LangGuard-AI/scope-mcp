  - id: airops.publish_brand_kit
    object: BrandKit
    action: publish_brand_kit
    description: "Activates a Brand Kit's draft changes, making them live."
    category: Configuration
    risk: medium
    business_impact: "Promotes draft Brand Kit changes to the live configuration that governs all downstream content generation; takes effect immediately for every consumer of the kit."
