actions:
  # ---------- Brand Kit Configuration ----------
  - id: airops.update_brand_kit
    object: BrandKit
    action: update_brand_kit
    description: "Modifies a Brand Kit's base identity and writing-style fields."
    category: Configuration
    risk: medium
    business_impact: "Changes the brand identity and writing rules that downstream content generation depends on; reversible by re-editing but affects all content produced from the kit."
    compliance: [SOC2, ISO_27001]
    sod_concern: false
    confidence: medium
    access_methods: [REST, MCP]

  - id: airops.manage_brand_kit_product_line
    object: ProductLine
    action: manage_brand_kit_product_line
    description: "Creates or updates a product line within a Brand Kit."
    category: Configuration
    risk: low
    business_impact: "Adds or edits a brand product-line definition; reversible and scoped to a single Brand Kit."
    compliance: []
    sod_concern: false
    confidence: high
    access_methods: [REST, MCP]

  - id: airops.manage_brand_kit_competitor
